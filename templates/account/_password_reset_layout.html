{% load static %}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>{% block head_title %}Passwort zurücksetzen{% endblock %} | A+ Esthetic</title>
  <link rel="stylesheet" href="{% static 'account-recovery.css' %}">
</head>
<body>
  <main class="card">
    <div class="logo"><img src="{% static 'assets/logo.svg' %}" alt="A+ Esthetic"></div>
    <span class="eyebrow">A+ ESTHETIC</span>
    {% if messages %}{% for message in messages %}<div class="notice" role="status">{{ message }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
    <a class="back" href="/">Zurück zur Anmeldung</a>
  </main>
</body>
</html>
