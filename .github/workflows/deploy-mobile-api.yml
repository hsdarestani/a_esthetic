name: Deploy A+ Esthetic native Customer Club API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "platform_app/**"
      - "p0_app/**"
      - "p1_app/**"
      - "p2_app/**"
      - "p3_app/**"
      - "config/**"
      - "templates/legal.html"
      - "requirements.txt"
      - ".github/workflows/deploy-mobile-api.yml"

permissions:
  contents: read

concurrency:
  group: a-esthetic-mobile-api-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deployment bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/aesthetic-mobile-package
          mkdir -p /tmp/aesthetic-mobile-package
          cp -a config platform_app p0_app p1_app p2_app p3_app templates static /tmp/aesthetic-mobile-package/
          cp manage.py requirements.txt /tmp/aesthetic-mobile-package/
          tar -C /tmp/aesthetic-mobile-package -czf a-esthetic-mobile-package.tar.gz .

      - name: Upload deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "a-esthetic-mobile-package.tar.gz"
          target: "/tmp"

      - name: Deploy Django mobile API and Store legal pages
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            ROOT="/opt/a-esthetic-mobile"
            VENV="$ROOT/venv"
            RELEASE="/tmp/a-esthetic-mobile-release"
            ENV_FILE="$ROOT/mobile.env"
            PACKAGE="/tmp/a-esthetic-mobile-package.tar.gz"
            DOMAIN="esthetic.smarbiz.sbs"
            WEBROOT="/opt/a-esthetic-web/site"
            CONF="/etc/nginx/sites-available/a-esthetic-connected.conf"

            for attempt in $(seq 1 120); do
              if ! pgrep -x apt-get >/dev/null && ! pgrep -x apt >/dev/null && ! pgrep -x dpkg >/dev/null && ! pgrep -f unattended-upgrade >/dev/null; then
                break
              fi
              echo "Waiting for another package operation ($attempt/120)..."
              sleep 5
            done
            if pgrep -x apt-get >/dev/null || pgrep -x apt >/dev/null || pgrep -x dpkg >/dev/null || pgrep -f unattended-upgrade >/dev/null; then
              echo "Package manager remained busy for 10 minutes"
              exit 1
            fi

            apt-get update -y
            apt-get install -y python3 python3-venv python3-pip build-essential libjpeg-dev zlib1g-dev nginx curl ca-certificates certbot python3-certbot-nginx

            rm -rf "$RELEASE"
            mkdir -p "$RELEASE" "$ROOT" "$WEBROOT"
            tar -xzf "$PACKAGE" -C "$RELEASE"
            rm -rf "$ROOT/config" "$ROOT/platform_app" "$ROOT/p0_app" "$ROOT/p1_app" "$ROOT/p2_app" "$ROOT/p3_app" "$ROOT/templates" "$ROOT/static"
            cp -a "$RELEASE/config" "$RELEASE/platform_app" "$RELEASE/p0_app" "$RELEASE/p1_app" "$RELEASE/p2_app" "$RELEASE/p3_app" "$RELEASE/templates" "$RELEASE/static" "$ROOT/"
            install -m 0644 "$RELEASE/manage.py" "$ROOT/manage.py"
            install -m 0644 "$RELEASE/requirements.txt" "$ROOT/requirements.txt"

            if [ ! -x "$VENV/bin/python" ]; then
              python3 -m venv "$VENV"
            fi
            "$VENV/bin/pip" install --upgrade pip
            "$VENV/bin/pip" install -r "$ROOT/requirements.txt"

            if [ ! -f "$ENV_FILE" ]; then
              umask 077
              SECRET="$(python3 - <<'PY'
            import secrets
            print(secrets.token_urlsafe(64))
            PY
              )"
              cat > "$ENV_FILE" <<EOF
            DJANGO_SECRET_KEY=$SECRET
            DJANGO_DEBUG=0
            DJANGO_ALLOWED_HOSTS=$DOMAIN,127.0.0.1,localhost
            CSRF_TRUSTED_ORIGINS=https://$DOMAIN
            EOF
            fi
            chmod 600 "$ENV_FILE"

            set -a
            . "$ENV_FILE"
            set +a
            cd "$ROOT"

            "$VENV/bin/python" manage.py migrate platform_app --fake-initial --noinput
            "$VENV/bin/python" manage.py migrate --noinput
            "$VENV/bin/python" manage.py seed_platform
            "$VENV/bin/python" manage.py seed_p1
            "$VENV/bin/python" manage.py seed_p2
            "$VENV/bin/python" manage.py seed_p3
            "$VENV/bin/python" manage.py collectstatic --noinput
            "$VENV/bin/python" manage.py check

            cat > /etc/systemd/system/a-esthetic-mobile.service <<SERVICE
            [Unit]
            Description=A+ Esthetic Customer Club mobile API
            After=network.target
            [Service]
            Type=simple
            WorkingDirectory=$ROOT
            EnvironmentFile=$ENV_FILE
            ExecStart=$VENV/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8770 --workers 2 --timeout 60 --access-logfile - --error-logfile -
            Restart=on-failure
            RestartSec=3
            UMask=0077
            NoNewPrivileges=true
            PrivateTmp=true
            [Install]
            WantedBy=multi-user.target
            SERVICE
            systemctl daemon-reload
            systemctl enable --now a-esthetic-mobile.service
            systemctl restart a-esthetic-mobile.service

            if [ ! -f "$CONF" ]; then
              cat > "$CONF" <<'NGINX'
            server {
              listen 80;
              listen [::]:80;
              server_name esthetic.smarbiz.sbs;
              root /opt/a-esthetic-web/site;
              index index.html;
              client_max_body_size 30m;
              location / { try_files $uri $uri/ /index.html; }
              location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
            }
            NGINX
            fi

            python3 - <<'PY'
            from pathlib import Path
            p=Path('/etc/nginx/sites-available/a-esthetic-connected.conf')
            s=p.read_text()
            begin='    # BEGIN CUSTOMER_CLUB_DJANGO'
            end='    # END CUSTOMER_CLUB_DJANGO'
            a=s.find(begin); b=s.find(end,a)
            if a >= 0 and b >= 0:
                nl=s.find('\n',b)
                s=s[:a]+s[(nl+1 if nl>=0 else len(s)):]
            marker='''    # BEGIN CUSTOMER_CLUB_DJANGO
                location ^~ /api/mobile/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
                location ^~ /accounts/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
                location = /login/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
                location = /datenschutz/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
                location ^~ /datenschutz/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
                location = /support/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
                location = /konto-loeschen/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
                location = /nutzungsbedingungen/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
                location = /impressum/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
                # END CUSTOMER_CLUB_DJANGO
            '''
            pos=s.find('{')
            if pos < 0: raise SystemExit('Nginx server opening brace not found')
            p.write_text(s[:pos+1]+'\n'+marker+s[pos+1:])
            PY

            ln -sfn "$CONF" /etc/nginx/sites-enabled/a-esthetic-connected.conf
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl enable --now nginx
            systemctl reload nginx

            sleep 3
            systemctl is-active --quiet a-esthetic-mobile.service

            python3 - <<'PY'
            from urllib.error import HTTPError, URLError
            from urllib.request import Request, urlopen

            def fetch(url, host=None):
                headers={'User-Agent': 'A-Esthetic-Deploy-Smoke/1.0'}
                if host: headers['Host']=host
                request = Request(url, headers=headers)
                try:
                    with urlopen(request, timeout=15) as response:
                        return response.status, response.read().decode('utf-8', 'replace')
                except HTTPError as exc:
                    return exc.code, exc.read().decode('utf-8', 'replace')
                except URLError as exc:
                    raise SystemExit(f'Smoke request failed for {url}: {exc}')

            checks = [
                ('http://127.0.0.1:8770/api/mobile/status/', None, 200, 'customer club'),
                ('http://127.0.0.1/api/mobile/status/', 'esthetic.smarbiz.sbs', 200, 'customer club'),
                ('http://127.0.0.1/datenschutz/', 'esthetic.smarbiz.sbs', 200, 'Kundenclub'),
            ]
            for url, host, expected, needle in checks:
                status, body = fetch(url, host=host)
                if status != expected or needle.lower() not in body.lower():
                    raise SystemExit(f'Smoke check failed: {url} returned {status}')

            for path in ('progress', 'wallet-pass', 'cabinet', 'shop', 'gamification', 'events', 'concierge', 'conversations'):
                status, _ = fetch(f'http://127.0.0.1:8770/api/mobile/{path}/')
                if status != 401:
                    raise SystemExit(f'Auth smoke failed for {path}: expected 401, got {status}')

            print('All A+ Esthetic new-origin mobile API smoke checks passed.')
            PY

            certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
            rm -rf "$RELEASE" "$PACKAGE"
            echo 'A+ Esthetic Customer Club API is prepared on the new STRATO origin.'
