name: Stop stalled obsolete iOS Simulator QA (not production)
on:
  push:
    branches: [feature/mobile-unified-overhaul]
    paths: [.github/workflows/stop-stalled-ios-simulator-qa.yml]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only two exact obsolete simulator-only runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          api='https://api.github.com/repos/'+os.environ['GH_REPO']+'/actions/runs/'
          token=os.environ['GH_TOKEN']
          exact={45080329549:'a2738af884789fb34a64c2cd63bfb03c523f52ff',
                 45080641202:'e944e017c3a828b0b140a8bf9a6ae553feab8ebb'}
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          for run_id, sha in exact.items():
              with urllib.request.urlopen(urllib.request.Request(api+str(run_id),headers=headers),timeout=15) as r:
                  data=json.load(r)
              if data.get('head_sha')!=sha:
                  print(run_id,'SAFE_SKIP different commit')
                  continue
              if data.get('status') not in ('queued','in_progress'):
                  print(run_id,'already completed')
                  continue
              req=urllib.request.Request(api+str(run_id)+'/cancel',headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      print(run_id,'obsolete simulator QA cancellation requested',r.status)
              except urllib.error.HTTPError as exc:
                  print(run_id,'cancel response',exc.code)
          PY
