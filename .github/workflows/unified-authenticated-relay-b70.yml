name: Check authenticated native calendar contract at both production origins

on:
  push:
    branches: [qa/unified-authenticated-relay-b70]
    paths: ['.github/workflows/unified-authenticated-relay-b70.yml']

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Compare the real calendar endpoints with a disposable staff identity
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -euo pipefail
            cd /opt/a-esthetic-mobile
            test "$(sha256sum p0_app/mobile_staff_views.py | cut -d' ' -f1)" = 9204476cb9a9c63130dc8b3e80041e40832bf137471948984026e3fb896dfe99
            if command -v nginx >/dev/null && nginx -T 2>/dev/null | awk '/location/ && /mobile\/staff|book\/calendar/ {found=1} END {exit !found}'; then echo NGINX_EXPLICIT_STAFF_LOCATION=yes; else echo NGINX_EXPLICIT_STAFF_LOCATION=no; fi
            set -a
            source mobile.env
            set +a
            if /opt/a-esthetic-mobile/venv/bin/python manage.py shell 2>/dev/null <<'PY'
            from django.contrib.auth import get_user_model
            from urllib.error import HTTPError
            from urllib.request import Request, urlopen
            from uuid import uuid4
            from platform_app.mobile_api import _token_for
            from platform_app.models import UserProfile

            import json
            import os
            from django.conf import settings
            from django.test import RequestFactory
            from p0_app import mobile_staff_views
            from datetime import date, timedelta

            def check(origin, path, token, relay_headers=False):
                query = '?start=' + (date.today() + timedelta(days=370)).isoformat() + '&days=1'
                request = Request(origin + path + query,
                    headers={'Accept':'application/json', 'Cache-Control':'no-cache',
                             **({'Content-Type':'application/json'} if relay_headers else {'Origin':'capacitor://localhost'}),
                             **({'Authorization':'Bearer '+token} if token else {})})
                try:
                    with urlopen(request, timeout=20) as reply:
                        payload = json.load(reply)
                        return (reply.status, payload.get('calendar_editability_contract') == 'source-revisions-v2',
                                payload.get('calendar_actor_role') == 'admin',
                                (reply.headers.get('CF-Cache-Status') or '').upper() in {'HIT','STALE','UPDATING','REVALIDATED'},
                                reply.headers.get('X-APlus-Staff-Contract') == 'source-revisions-v2')
                except HTTPError as error:
                    return error.code, False, False, False, False

            fixtures = []
            try:
                for role in ('admin','customer'):
                    user = get_user_model()(username='synthetic-relay-'+uuid4().hex)
                    user.set_unusable_password()
                    user.save()
                    fixtures.append(user)
                    UserProfile.objects.update_or_create(user=user, defaults={'role':role})
                app = 'https://app.a-esthetic.de'
                book = 'https://book.a-esthetic.de'
                relay_path = '/api/mobile/staff/book/calendar/'
                book_path = '/api/mobile/staff/calendar/'
                token = _token_for(fixtures[0])
                direct = check(book, book_path, token)
                relay = check(app, relay_path, token)
                print('DIRECT_BOOK', *direct, flush=True)
                print('APP_RELAY', *relay, flush=True)
                assert check(app, relay_path, None)[0] == 401
                assert check(app, relay_path, _token_for(fixtures[1]))[0] == 403
                upstream = getattr(settings, 'MOBILE_STAFF_BOOK_ORIGIN', book)
                print('CONFIGURED_PUBLIC_BOOK', upstream == book, flush=True)
                print('DIRECT_WITH_RELAY_HEADERS', *check(book, book_path, token, relay_headers=True), flush=True)
                req = RequestFactory().get(relay_path, {
                    'start': (date.today() + timedelta(days=370)).isoformat(), 'days': '1',
                }, HTTP_AUTHORIZATION='Bearer ' + token, HTTP_HOST='app.a-esthetic.de', secure=True)
                local = mobile_staff_views.book(req, 'calendar')
                payload = json.loads(local.content)
                print('DJANGO_RELAY_VIEW', local.status_code,
                      payload.get('calendar_editability_contract') == 'source-revisions-v2',
                      payload.get('calendar_actor_role') == 'admin', flush=True)
                import http.client
                import re
                import subprocess
                from urllib.parse import urlencode
                from urllib.request import getproxies
                def unit(service, prop):
                    return subprocess.check_output(['systemctl','show',service,'-p',prop,'--value'], text=True).strip()
                def local_check(address, port):
                    conn = http.client.HTTPConnection(address, port, timeout=15)
                    path = relay_path + '?' + urlencode({'start': (date.today() + timedelta(days=370)).isoformat(), 'days': '1'})
                    try:
                        conn.request('GET', path, headers={'Host':'app.a-esthetic.de',
                            'X-Forwarded-Proto':'https','Authorization':'Bearer '+token,'Accept':'application/json'})
                        reply = conn.getresponse()
                        if reply.status != 200:
                            return reply.status, False, False
                        payload = json.load(reply)
                        return reply.status, payload.get('calendar_editability_contract') == 'source-revisions-v2', payload.get('calendar_actor_role') == 'admin'
                    except Exception:
                        return 'unreachable', False, False
                    finally:
                        conn.close()
                service = 'a-esthetic-mobile.service'
                worker_pid = int(unit(service, 'MainPID'))
                assert worker_pid > 1
                worker_env = dict(item.split(b'=', 1) for item in open('/proc/%d/environ' % worker_pid, 'rb').read().split(b'\0') if b'=' in item)
                print('WORKER_SETTINGS_MATCH', worker_env.get(b'DJANGO_SETTINGS_MODULE', b'config.settings').decode() == settings.SETTINGS_MODULE, flush=True)
                print('WORKER_CWD_MATCH', os.path.realpath('/proc/%d/cwd' % worker_pid) == os.getcwd(), flush=True)
                print('WORKER_PROXY_ENV_MATCH', all(worker_env.get(k.encode()) == os.environb.get(k.encode()) for k in
                     ('HTTPS_PROXY','https_proxy','HTTP_PROXY','http_proxy','ALL_PROXY','all_proxy','NO_PROXY','no_proxy')), flush=True)
                exec_spec = unit(service, 'ExecStart')
                binds = sorted(set(re.findall(r'(?:--bind(?:=| )|-b )((?:127\.0\.0\.1|0\.0\.0\.0):[0-9]+)', exec_spec)))
                for bind in binds:
                    print('LOCAL_APP_WORKER', *local_check('127.0.0.1', int(bind.rsplit(':',1)[1])), flush=True)
                print('APP_WORKER_TCP_BIND_FOUND', bool(binds), flush=True)
                for proxy in ('caddy','nginx','apache2','cloudflared'):
                    print('PROXY_ACTIVE', proxy, unit(proxy,'ActiveState') == 'active', flush=True)
                try:
                    with urlopen('http://127.0.0.1:2019/config/apps/http/servers/', timeout=3) as config:
                        servers = json.load(config)
                    def inspect(routes, matched=False):
                        for route in routes:
                            relevant = matched or any('app.a-esthetic.de' in rule.get('host', []) for rule in route.get('match', []))
                            if relevant:
                                for handler in route.get('handle', []):
                                    for upstream in handler.get('upstreams', []):
                                        bind = re.fullmatch(r'(?:127\.0\.0\.1|localhost):([0-9]+)', upstream.get('dial',''))
                                        if bind:
                                            print('CADDY_APP_UPSTREAM_MATCHES_WORKER', any(v.endswith(':'+bind[1]) for v in binds), flush=True)
                                            print('CADDY_APP_UPSTREAM', *local_check('127.0.0.1', int(bind[1])), flush=True)
                                    inspect(handler.get('routes', []), relevant)
                    for server in servers.values():
                        inspect(server.get('routes', []))
                except Exception:
                    print('CADDY_ADMIN_UNAVAILABLE', flush=True)
                assert direct[:3] == relay[:3] == (200, True, True)
            finally:
                for user in fixtures:
                    user.delete()
            PY
            then
              echo 'PRODUCTION_BEARER_RELAY_ADMIN_AND_CUSTOMER_BOUNDARIES=passed'
            else
              echo 'PRODUCTION_BEARER_RELAY_ADMIN_AND_CUSTOMER_BOUNDARIES=unverified'
              exit 1
            fi
