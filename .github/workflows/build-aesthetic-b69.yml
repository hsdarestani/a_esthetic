name: Build A+ Esthetic 1.0.60 (69) Android and iOS

on:
  workflow_dispatch:
  push:
    branches: [release/esthetic-store-b69-20261126]
    paths:
      - '.github/workflows/build-aesthetic-b69.yml'

permissions:
  contents: read

jobs:
  quality-gate:
    name: Source and production regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all native URLs, app assets, syntax and version rules
        run: |
          set -euo pipefail
          python3 scripts/check_app_production_domains.py
          python3 scripts/store_positioning_check.py
          bash -n scripts/build-android.sh scripts/build-ios.sh
          grep -q 'Verified Android Play versionName=' scripts/build-android.sh
          for script in www/*.js; do node --check "$script"; done
          node --test scripts/test-mobile-lifecycle.js scripts/test-android-system-back.js scripts/test-ios-onboarding-recovery.js scripts/test-booking-details-login.js
          python3 scripts/test_native_calendar_colors.py
          node scripts/test_native_calendar_layout.mjs
          node scripts/test_native_staff_controller.mjs
          grep -F 'section.book-next-card.is-empty .approved-next-main' www/booking-book-flow.css
          grep -F '20261126-empty-appointment-v3' www/index.html
          python3 -m compileall -q config platform_app p0_app p1_app p2_app p3_app
      - name: Check canonical HTTPS status, OAuth config and password reset
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 30 https://app.a-esthetic.de/api/mobile/status/ \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True and x.get("service") == "A+ Esthetic App API"'
          curl -fLsS --retry 2 --max-time 30 https://app.a-esthetic.de/api/mobile/auth/config/ \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True and x.get("google") is True and x.get("apple") is True'
          curl -fLsS --retry 2 --max-time 30 https://app.a-esthetic.de/accounts/password/reset/ \
            | grep -q 'Passwort vergessen'
          curl -fLsS --retry 2 --max-time 30 https://app.a-esthetic.de/ \
            | grep -q 'core-app.js'

  android:
    needs: quality-gate
    name: Android release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build 1.0.60 (69)
        env:
          APP_VERSION_NAME: '1.0.60'
          APP_BUILD_NUMBER: '69'
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            export REQUIRE_ANDROID_SIGNING=1
            echo 'ANDROID_STORE_SIGNING=present' | tee android-build-status.txt
          else
            export REQUIRE_ANDROID_SIGNING=0
            echo 'ANDROID_STORE_SIGNING=missing; AAB is a build candidate, not a Play release' | tee android-build-status.txt
          fi
          bash scripts/build-android.sh
          test -s artifacts/a-esthetic-release.aab
          grep -F '20261126-empty-appointment-v3' android/app/src/main/assets/public/index.html
          (cd android && ./gradlew assembleDebug --no-daemon)
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/a-esthetic-b69-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-esthetic-android-1.0.60-build-69
          path: |
            artifacts/a-esthetic-release.aab
            artifacts/a-esthetic-b69-debug.apk
            android-build-status.txt
          if-no-files-found: warn

  ios:
    needs: quality-gate
    name: iOS archive / simulator build
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build 1.0.60 (69)
        env:
          APP_VERSION_NAME: '1.0.60'
          APP_BUILD_NUMBER: '69'
          APPLE_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_AUTH_KEY_B64: ${{ secrets.APPSTORE_AUTH_KEY_B64 }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          if [[ -n "$APPLE_TEAM_ID" && -n "$APPLE_KEY_ID" && -n "$APPLE_ISSUER_ID" && -n "$APPLE_AUTH_KEY_B64" ]]; then
            printf '%s' "$APPLE_AUTH_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            echo 'IOS_STORE_SIGNING=attempted via App Store Connect API key' | tee ios-build-status.txt
            bash scripts/build-ios.sh
            test -s artifacts/a-esthetic.ipa
          else
            echo 'IOS_STORE_SIGNING=unavailable; compiling simulator build only, not an installable/store IPA' | tee ios-build-status.txt
            npm pkg delete scripts.capacitor:sync:after
            npx cap add ios
            python3 scripts/configure_native_camera_permissions.py
            python3 scripts/install_native_staff.py
            if [[ -d ios/App/App.xcworkspace ]]; then app=(-workspace ios/App/App.xcworkspace); else app=(-project ios/App/App.xcodeproj); fi
            xcodebuild -quiet "${app[@]}" -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/aesthetic-ios" ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO ENABLE_DEBUG_DYLIB=NO IPHONEOS_DEPLOYMENT_TARGET=16.0 MARKETING_VERSION=1.0.60 CURRENT_PROJECT_VERSION=69 build
            mkdir -p artifacts
            app_path="$RUNNER_TEMP/aesthetic-ios/Build/Products/Debug-iphonesimulator/App.app"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app_path/Info.plist")" = 69
            grep -F '20261126-empty-appointment-v3' "$app_path/public/index.html"
            /usr/bin/ditto -c -k --keepParent "$app_path" artifacts/a-esthetic-ios-simulator.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-esthetic-ios-1.0.60-build-69
          path: |
            artifacts/a-esthetic.ipa
            artifacts/a-esthetic-ios-simulator.zip
            ios-build-status.txt
          if-no-files-found: warn
