name: Verify A+ Esthetic password reset live
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-password-reset-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify German recovery page and stylesheet over HTTPS
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 https://app.a-esthetic.de/accounts/password/reset/ | grep -q 'Passwort vergessen?'
          curl -fsSL --retry 3 --max-time 30 https://app.a-esthetic.de/static/account-recovery.css | grep -q '.card'
          echo 'Branded German password recovery is live.'

      - name: Verify production SMTP authenticated connection without sending mail
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            ROOT=/opt/a-esthetic-mobile
            cd "$ROOT"
            set -a
            . "$ROOT/mobile.env"
            set +a
            "$ROOT/venv/bin/python" - <<'PYCODE'
            import os
            os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
            import django
            django.setup()
            from django.conf import settings
            from django.core.mail import get_connection
            if not settings.EMAIL_HOST_PASSWORD:
                raise RuntimeError("SMTP password is not configured")
            with get_connection():
                print("SMTP authenticated connection OK")
            PYCODE
