name: Native backend concurrency hotfix
on:
  push:
    branches: [ops/native-concurrency-hotfix-20261128]
permissions:
  contents: read
concurrency:
  group: a-esthetic-mobile-api-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -euo pipefail
            cd /opt/a-esthetic-mobile
            exec 9>/opt/a-esthetic-mobile/remediation-rollbacks/release.lock
            flock -n 9
            app=a-esthetic-mobile.service
            book=aesthetic-book.service
            for svc in "$app" "$book"; do
              systemctl is-active --quiet "$svc"
            done
            free_kb=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
            echo "AVAILABLE_MEMORY_MB=$((free_kb/1024))"
            test "$free_kb" -gt 786432
            set -a
            source mobile.env
            set +a
            export DJANGO_SETTINGS_MODULE=config.settings
            export PYTHONPATH=/opt/a-esthetic-mobile
            probe=$(mktemp)
            chmod 600 "$probe"
            cat > "$probe" <<'PY'
            import django
            django.setup()
            from django.contrib.auth import get_user_model
            from platform_app.mobile_api import _token_for
            from platform_app.models import UserProfile
            from time import monotonic
            from urllib.request import Request,urlopen
            from urllib.error import HTTPError
            from uuid import uuid4
            from concurrent.futures import ThreadPoolExecutor
            import sys
            stage=sys.argv[1]
            user=get_user_model()(username='synthetic-perf-'+uuid4().hex)
            user.set_unusable_password()
            user.save()
            try:
                UserProfile.objects.update_or_create(user=user,defaults={"role":"admin"})
                token=_token_for(user)
                urls=['https://app.a-esthetic.de/api/mobile/staff/book/patients/?q=synthetic-no-match',
                      'https://app.a-esthetic.de/api/mobile/staff/book/catalog/']
                def fetch(i):
                    t=monotonic()
                    try:
                        with urlopen(Request(urls[i%2],headers={"Authorization":"Bearer "+token,"Accept":"application/json"}),timeout=16) as res:
                            res.read()
                            status=res.status
                    except HTTPError as exc:
                        status=exc.code
                    except Exception:
                        status=0
                    return status,round((monotonic()-t)*1000)
                with ThreadPoolExecutor(max_workers=6) as pool:
                    rows=list(pool.map(fetch,range(6)))
                print("CONCURRENT",stage,rows,flush=True)
                if stage=="after":
                    assert all(status==200 for status,ms in rows)
                    assert max(ms for status,ms in rows)<5000
            finally:
                user.delete()
            PY
            /opt/a-esthetic-mobile/venv/bin/python "$probe" before
            changed=()
            rollback() {
              result=$?
              trap - EXIT
              if (( result != 0 )); then
                for svc in "${changed[@]}"; do
                  rm -f "/etc/systemd/system/$svc.d/93-native-concurrency.conf"
                done
                systemctl daemon-reload
                for svc in "${changed[@]}"; do systemctl restart "$svc"; done
              fi
              rm -f "$probe"
              exit "$result"
            }
            trap rollback EXIT
            for svc in "$app" "$book"; do
              pid=$(systemctl show "$svc" -p MainPID --value)
              test "$pid" -gt 1
              exec_line=$(systemctl show "$svc" -p ExecStart --value)
              if ! grep -q gunicorn <<<"$exec_line"; then
                echo "SKIP_NON_GUNICORN=$svc"; continue
              fi
              if grep -Eq -- '(^|[[:space:]])(--threads|--worker-class|-k)([=[:space:]]|$)' <<<"$exec_line"; then
                echo "SKIP_EXPLICIT_WORKER_CONFIG=$svc"; continue
              fi
              if tr '\0' '\n' < "/proc/$pid/environ" | grep -q '^GUNICORN_CMD_ARGS='; then
                echo "SKIP_EXISTING_GUNICORN_ARGS=$svc"; continue
              fi
              config="/etc/systemd/system/$svc.d/93-native-concurrency.conf"
              test ! -e "$config"
              mkdir -p "$(dirname "$config")"
              printf '%s\n' '[Service]' 'Environment="GUNICORN_CMD_ARGS=--threads 4"' > "$config"
              changed+=("$svc")
              echo "CONFIGURED_THREADS=$svc:4"
            done
            test "${#changed[@]}" -gt 0
            systemctl daemon-reload
            for svc in "${changed[@]}"; do systemctl restart "$svc"; done
            for attempt in {1..15}; do
              if curl -fsS --max-time 5 https://book.a-esthetic.de/api/health/ -o /dev/null && curl -fsS --max-time 5 https://app.a-esthetic.de/api/mobile/status/ -o /dev/null; then break; fi
              sleep 2
            done
            for svc in "${changed[@]}"; do
              systemctl is-active --quiet "$svc"
              pid=$(systemctl show "$svc" -p MainPID --value)
              tr '\0' '\n' < "/proc/$pid/environ" | grep -Fx 'GUNICORN_CMD_ARGS=--threads 4' >/dev/null
            done
            /opt/a-esthetic-mobile/venv/bin/python "$probe" after
            echo NATIVE_CONCURRENCY_VERIFIED=yes
