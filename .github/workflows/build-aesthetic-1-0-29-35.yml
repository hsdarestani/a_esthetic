name: Build A+ Esthetic 1.0.29 (35) Android and iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-aesthetic-1-0-29-35.yml'

permissions:
  contents: read

jobs:
  quality-gate:
    name: Source and production regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all native URLs, app assets, syntax and version rules
        run: |
          set -euo pipefail
          python3 scripts/check_app_production_domains.py
          python3 scripts/store_positioning_check.py
          bash -n scripts/build-android.sh scripts/build-ios.sh
          grep -q 'Verified Android Play versionName=' scripts/build-android.sh
          for script in www/*.js; do node --check "$script"; done
          python3 -m compileall -q config platform_app p0_app p1_app p2_app p3_app
      - name: Check canonical HTTPS status, OAuth config and password reset
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 30 https://app.a-esthetic.de/api/mobile/status/ \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True and x.get("service") == "A+ Esthetic App API"'
          curl -fLsS --retry 2 --max-time 30 https://app.a-esthetic.de/api/mobile/auth/config/ \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True and x.get("google") is True and x.get("apple") is True'
          curl -fLsS --retry 2 --max-time 30 https://app.a-esthetic.de/accounts/password/reset/ \
            | grep -q 'Passwort vergessen'
          curl -fLsS --retry 2 --max-time 30 https://app.a-esthetic.de/ \
            | grep -q 'core-app.js'

  android:
    needs: quality-gate
    name: Android release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build 1.0.29 (35)
        env:
          APP_VERSION_NAME: '1.0.29'
          APP_BUILD_NUMBER: '35'
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            export REQUIRE_ANDROID_SIGNING=1
            echo 'ANDROID_STORE_SIGNING=present' | tee android-build-status.txt
          else
            export REQUIRE_ANDROID_SIGNING=0
            echo 'ANDROID_STORE_SIGNING=missing; AAB is a build candidate, not a Play release' | tee android-build-status.txt
          fi
          bash scripts/build-android.sh
          test -s artifacts/a-esthetic-release.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-esthetic-android-1.0.29-build-35
          path: |
            artifacts/a-esthetic-release.aab
            android-build-status.txt
          if-no-files-found: warn

  ios:
    needs: quality-gate
    name: iOS archive / simulator build
    runs-on: macos-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build 1.0.29 (35)
        env:
          APP_VERSION_NAME: '1.0.29'
          APP_BUILD_NUMBER: '35'
          APPLE_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_AUTH_KEY_B64: ${{ secrets.APPSTORE_AUTH_KEY_B64 }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          if [[ -n "$APPLE_TEAM_ID" && -n "$APPLE_KEY_ID" && -n "$APPLE_ISSUER_ID" && -n "$APPLE_AUTH_KEY_B64" ]]; then
            printf '%s' "$APPLE_AUTH_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            echo 'IOS_STORE_SIGNING=attempted via App Store Connect API key' | tee ios-build-status.txt
            bash scripts/build-ios.sh
            test -s artifacts/a-esthetic.ipa
          else
            echo 'IOS_STORE_SIGNING=unavailable; compiling simulator build only, not an installable/store IPA' | tee ios-build-status.txt
            npx cap add ios
            npx cap sync ios
            if [[ -d ios/App/App.xcworkspace ]]; then
              xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath "$RUNNER_TEMP/aesthetic-ios" CODE_SIGNING_ALLOWED=NO build
            else
              xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath "$RUNNER_TEMP/aesthetic-ios" CODE_SIGNING_ALLOWED=NO build
            fi
            mkdir -p artifacts
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/aesthetic-ios/Build/Products/Debug-iphonesimulator/App.app" artifacts/a-esthetic-ios-simulator.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-esthetic-ios-1.0.29-build-35
          path: |
            artifacts/a-esthetic.ipa
            artifacts/a-esthetic-ios-simulator.zip
            ios-build-status.txt
          if-no-files-found: warn
