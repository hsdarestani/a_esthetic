name: Diagnose A+ authentication pages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  auth-pages:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-ci-only-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver,esthetic.smarbiz.sbs
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare test database
        run: |
          python -m pip install --upgrade pip wheel >/dev/null
          pip install -r requirements.txt >/dev/null
          export PRIVATE_FILE_ENCRYPTION_KEYS="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python manage.py migrate --noinput >/dev/null
          python manage.py seed_platform >/dev/null
          python manage.py seed_complete_features >/dev/null
      - name: Render authentication pages
        id: auth
        continue-on-error: true
        run: |
          set -o pipefail
          export PRIVATE_FILE_ENCRYPTION_KEYS="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python - <<'PY' 2>&1 | tee /tmp/auth-pages.txt
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django
          django.setup()
          from django.test import Client
          from django.urls import reverse
          routes = [
              ('account_login', ('Willkommen zurück','auth-card')),
              ('account_signup', ('Konto erstellen','Sicher registrieren')),
              ('account_reset_password', ('Passwort zurücksetzen','Link zum Zurücksetzen')),
              ('account_email_verification_sent', ('E-Mail-Adresse','auth-status-icon')),
          ]
          client=Client()
          failed=False
          for name, markers in routes:
              try:
                  url=reverse(name)
                  response=client.get(url, secure=True, HTTP_HOST='esthetic.smarbiz.sbs')
                  html=response.content.decode('utf-8', errors='replace')
                  print(f'{name} {url} status={response.status_code} bytes={len(response.content)}')
                  print('markers:', {m:(m in html) for m in markers})
                  print('raw_english:', {m:(m in html) for m in ('Menu:','Sign Up','Verify Your Email Address')})
                  if response.status_code != 200 or any(m not in html for m in markers): failed=True
              except Exception as exc:
                  failed=True
                  print(f'{name} EXCEPTION {type(exc).__name__}: {exc}')
          if failed:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a-esthetic-auth-pages-${{ github.run_id }}
          path: /tmp/auth-pages.txt
      - if: steps.auth.outcome == 'failure'
        run: exit 1
