name: A+ Esthetic focused Book admin production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/book-admin-production-smoke.yml"
      - "p0_app/admin_mobile_views.py"
      - "p0_app/book_admin_proxy_views.py"
      - "p0_app/wallet_lookup_views.py"
      - "p0_app/review_views.py"
      - "p0_app/urls.py"
      - "www/admin-mode.js"
      - "www/index.html"

permissions:
  contents: read

concurrency:
  group: a-esthetic-book-admin-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify focused Book and A+ points administration
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            ROOT=/opt/a-esthetic-mobile
            BASE=https://esthetic.smarbiz.sbs
            BOOK=https://book.a-esthetic.de
            PREFIX="focused-admin-smoke-$(date +%s)-$$"
            export PREFIX

            cd "$ROOT"
            set -a
            . "$ROOT/mobile.env"
            set +a
            export PYTHONPATH="$ROOT/vendor"

            cleanup() {
              python3 - <<'PY' || true
            import os
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
            import django
            django.setup()
            from django.contrib.auth.models import User
            User.objects.filter(username__startswith=os.environ.get('PREFIX', '')).delete()
            PY
              rm -f /tmp/aplus-smoke.env /tmp/book.cookies /tmp/sso.json /tmp/wallet.json \
                /tmp/dashboard.html /tmp/calendar.html /tmp/points.html /tmp/patients.html /tmp/reviews.html /tmp/referrals.html
            }
            trap cleanup EXIT

            python3 - <<'PY'
            import os, shlex
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
            import django
            django.setup()
            from django.contrib.auth.models import User
            from platform_app.mobile_api import _token_for
            from platform_app.models import MemberAccount, UserProfile, WalletAccount, WalletTransaction

            prefix = os.environ['PREFIX']
            admin = User.objects.create(username=f'{prefix}-admin', email=f'{prefix}-admin@example.invalid', is_staff=True)
            admin.set_unusable_password(); admin.save(update_fields=['password'])
            profile, _ = UserProfile.objects.get_or_create(user=admin)
            profile.role = 'admin'; profile.save(update_fields=['role'])

            customer = User.objects.create(
                username=f'{prefix}-member', email=f'{prefix}-member@example.invalid',
                first_name='Smoke', last_name='Points'
            )
            customer.set_unusable_password(); customer.save(update_fields=['password'])
            profile, _ = UserProfile.objects.get_or_create(user=customer)
            profile.role = 'customer'; profile.save(update_fields=['role'])
            member, _ = MemberAccount.objects.get_or_create(user=customer)
            wallet, _ = WalletAccount.objects.get_or_create(user=customer)
            wallet.coin_balance = 420; wallet.save(update_fields=['coin_balance', 'updated_at'])
            WalletTransaction.objects.create(
                user=customer, kind='coin', direction='in', coin_amount=420,
                description='Production smoke points', reference=prefix
            )

            with open('/tmp/aplus-smoke.env', 'w') as fh:
                fh.write(f'ADMIN_TOKEN={shlex.quote(_token_for(admin))}\n')
                fh.write(f'QR_TOKEN={shlex.quote(member.qr_token)}\n')
                fh.write(f'CUSTOMER_EMAIL={shlex.quote(customer.email)}\n')
                fh.write(f'CUSTOMER_ID={customer.pk}\n')
            PY
            . /tmp/aplus-smoke.env
            export ADMIN_TOKEN QR_TOKEN CUSTOMER_EMAIL CUSTOMER_ID

            require_json_ok() {
              url="$1"
              body="$(curl -fsS --max-time 30 -H "Authorization: Bearer $ADMIN_TOKEN" "$url")"
              printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d'
            }
            require_marker() {
              file="$1"; marker="$2"; label="$3"
              if ! grep -Fq "$marker" "$file"; then
                echo "FAIL marker: $label ($marker)" >&2
                exit 1
              fi
              echo "PASS marker: $label"
            }

            require_json_ok "$BASE/api/mobile/admin/book/overview/"
            require_json_ok "$BASE/api/mobile/admin/book/calendar/?date=$(date +%F)"
            require_json_ok "$BASE/api/mobile/admin/book/bookings/"
            echo 'PASS canonical Book bridge.'

            for endpoint in customers/ referrals/ reviews/ dashboard-banners/; do
              require_json_ok "$BASE/api/mobile/admin/$endpoint"
            done
            echo 'PASS focused A+ APIs.'

            http="$(curl -sS --max-time 30 -o /tmp/wallet.json -w '%{http_code}' \
              -X POST -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' \
              --data "{\"qr_token\":\"$QR_TOKEN\"}" "$BASE/api/mobile/admin/wallet/lookup/")"
            test "$http" = 200
            python3 - <<'PY'
            import json, os
            data = json.load(open('/tmp/wallet.json'))
            customer = data.get('customer') or {}
            assert data.get('ok') is True and data.get('resolved_by') == 'wallet_qr', data
            assert str(customer.get('id')) == os.environ['CUSTOMER_ID'], customer
            assert customer.get('email') == os.environ['CUSTOMER_EMAIL'], customer
            assert 'qr_token' not in customer, customer
            PY
            echo 'PASS secure A+ QR lookup.'

            rm -f /tmp/book.cookies
            sso_ok=0
            for attempt in $(seq 1 12); do
              http="$(curl -sS --max-time 30 -o /tmp/sso.json -w '%{http_code}' \
                -c /tmp/book.cookies -b /tmp/book.cookies -X POST \
                -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Accept: application/json' \
                "$BOOK/verwaltung/app-sso/" || true)"
              if [ "$http" = 200 ] && python3 -c 'import json; d=json.load(open("/tmp/sso.json")); assert d.get("ok") is True and d.get("redirect")=="/verwaltung/dashboard/"'; then
                sso_ok=1; break
              fi
              echo "Waiting for Book SSO ($attempt/12, HTTP $http)"
              sleep 5
            done
            test "$sso_ok" = 1

            curl -fsS --max-time 30 -c /tmp/book.cookies -b /tmp/book.cookies "$BOOK/verwaltung/dashboard/" > /tmp/dashboard.html
            require_marker /tmp/dashboard.html 'Patient suchen' 'admin dashboard patient search'
            require_marker /tmp/dashboard.html 'Kampagnen & Banner' 'campaign editor'
            require_marker /tmp/dashboard.html 'Nachrichten-Vorlagen' 'WhatsApp templates'

            curl -fsS --max-time 30 -c /tmp/book.cookies -b /tmp/book.cookies "$BOOK/verwaltung/kalender/" > /tmp/calendar.html
            require_marker /tmp/calendar.html 'Kalender (Tagesansicht)' 'Book calendar'
            require_marker /tmp/calendar.html 'Patientenakten' 'patient records navigation'
            require_marker /tmp/calendar.html 'href="/verwaltung/app/wallet/"' 'points navigation'
            require_marker /tmp/calendar.html 'href="/verwaltung/app/reviews/"' 'reviews navigation'
            require_marker /tmp/calendar.html 'href="/verwaltung/app/referrals/"' 'referrals navigation'
            if grep -Eq '/verwaltung/app/(club|packages|rewards|notifications|modules)/' /tmp/calendar.html; then
              echo 'FAIL: removed legacy A+ management route leaked into calendar.' >&2
              exit 1
            fi

            encoded_email="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["CUSTOMER_EMAIL"]))')"
            curl -fsS --max-time 30 -c /tmp/book.cookies -b /tmp/book.cookies \
              "$BOOK/verwaltung/app/wallet/?q=$encoded_email&scan=1" > /tmp/points.html
            require_marker /tmp/points.html 'A+ Punkte' 'points page'
            require_marker /tmp/points.html 'QR-Code scannen' 'QR scanner action'
            require_marker /tmp/points.html 'data-wallet-scan-open' 'scanner trigger'
            require_marker /tmp/points.html 'data-wallet-camera' 'camera surface'
            require_marker /tmp/points.html 'app-wallet-scanner' 'scanner static asset'
            require_marker /tmp/points.html "$CUSTOMER_EMAIL" 'resolved patient'
            require_marker /tmp/points.html '420' 'resolved points'
            if grep -Fq 'Guthaben' /tmp/points.html; then
              echo 'FAIL: money wording leaked into points admin.' >&2
              exit 1
            fi

            curl -fsS --max-time 30 -c /tmp/book.cookies -b /tmp/book.cookies "$BOOK/verwaltung/app/patients/" > /tmp/patients.html
            curl -fsS --max-time 30 -c /tmp/book.cookies -b /tmp/book.cookies "$BOOK/verwaltung/app/reviews/" > /tmp/reviews.html
            curl -fsS --max-time 30 -c /tmp/book.cookies -b /tmp/book.cookies "$BOOK/verwaltung/app/referrals/" > /tmp/referrals.html
            require_marker /tmp/patients.html 'Patientenakten' 'patient records page'
            require_marker /tmp/reviews.html 'Google Bewertungen' 'reviews page'
            require_marker /tmp/referrals.html 'Empfehlungen' 'referrals page'

            for file in /tmp/points.html /tmp/patients.html /tmp/reviews.html /tmp/referrals.html; do
              if grep -Eq '/verwaltung/app/(club|packages|rewards|notifications|modules)/' "$file"; then
                echo "FAIL: removed management module leaked into $file" >&2
                exit 1
              fi
            done
            echo 'PASS focused A+ production management: Dashboard + Termine + Patientenakten + Reviews + Punkte/QR + Empfehlungen.'