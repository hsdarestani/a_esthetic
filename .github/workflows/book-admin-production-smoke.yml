name: A+ Esthetic exact Book admin production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/book-admin-production-smoke.yml"
      - "p0_app/book_admin_proxy_views.py"
      - "p0_app/urls.py"
      - "platform_app/admin_aware_login.py"
      - "www/admin-mode.js"
      - "www/index.html"
      - "capacitor.config.json"

permissions:
  contents: read

concurrency:
  group: a-esthetic-book-admin-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify A+ admin bearer opens the real Book administration
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            ROOT=/opt/a-esthetic-mobile
            BASE=https://esthetic.smarbiz.sbs
            BOOK=https://book.a-esthetic.de
            PREFIX="book-admin-smoke-$(date +%s)-$$"
            export PREFIX
            cd "$ROOT"
            set -a
            . "$ROOT/mobile.env"
            set +a
            export PYTHONPATH="$ROOT/vendor"

            cleanup() {
              python3 - <<'PY' || true
            import os
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
            import django
            django.setup()
            from django.contrib.auth.models import User
            User.objects.filter(username=os.environ.get('PREFIX', '')).delete()
            PY
              rm -f /tmp/aesthetic-book-admin-smoke.env /tmp/book-admin.cookies /tmp/book-admin-calendar.html
            }
            trap cleanup EXIT

            python3 - <<'PY'
            import os, shlex
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
            import django
            django.setup()
            from django.contrib.auth.models import User
            from platform_app.mobile_api import _token_for
            from platform_app.models import UserProfile

            username = os.environ['PREFIX']
            user = User.objects.create(username=username, email=f'{username}@example.invalid', is_staff=True)
            user.set_unusable_password()
            user.save(update_fields=['password'])
            profile, _ = UserProfile.objects.get_or_create(user=user)
            profile.role = 'admin'
            profile.save(update_fields=['role'])
            token = _token_for(user)
            with open('/tmp/aesthetic-book-admin-smoke.env', 'w') as handle:
                handle.write(f'ADMIN_TOKEN={shlex.quote(token)}\n')
            PY
            . /tmp/aesthetic-book-admin-smoke.env

            # Existing JSON bridge remains healthy.
            for endpoint in overview calendar bookings customers services settings; do
              url="$BASE/api/mobile/admin/book/$endpoint/"
              if [ "$endpoint" = calendar ]; then
                url="$url?date=$(date +%F)"
              fi
              body="$(curl -fsS --max-time 30 -H "Authorization: Bearer $ADMIN_TOKEN" "$url")"
              printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d'
              echo "PASS Book admin API: $endpoint"
            done

            # New canonical flow: exchange the A+ bearer for a first-party Book staff
            # session, then render the exact same responsive Book admin HTML the clinic uses.
            sso="$(curl -fsS --max-time 30 -c /tmp/book-admin.cookies -b /tmp/book-admin.cookies \
              -X POST -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Accept: application/json' \
              "$BOOK/verwaltung/app-sso/")"
            printf '%s' "$sso" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, d; assert d.get("redirect")=="/verwaltung/kalender/", d'

            curl -fsS --max-time 30 -c /tmp/book-admin.cookies -b /tmp/book-admin.cookies \
              "$BOOK/verwaltung/kalender/" > /tmp/book-admin-calendar.html
            grep -q 'class="sb-mobile-bar"' /tmp/book-admin-calendar.html
            grep -q 'data-drawer-open' /tmp/book-admin-calendar.html
            grep -q 'class="sb-drawer"' /tmp/book-admin-calendar.html
            grep -q 'Kalender (Tagesansicht)' /tmp/book-admin-calendar.html
            if grep -q 'nav-center-disc' /tmp/book-admin-calendar.html; then
              echo 'FAIL: Customer Club bottom navigation leaked into Book admin.' >&2
              exit 1
            fi
            echo 'PASS exact Book admin: real mobile header, hamburger drawer, calendar; no Customer Club footer.'
