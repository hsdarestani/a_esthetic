name: Guarded patient booking UX static release
on:
  push:
    branches: [release/patient-booking-ux-20261126]
    paths: ['.github/workflows/patient-booking-ux-scoped-release.yml']
permissions:
  contents: read
concurrency:
  group: a-esthetic-customer-club-web-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package only the four tested web assets
        run: |
          set -euo pipefail
          mkdir -p release/files
          baseline=97bfd86b3273ef7edeba42f2d32ca1b6a7a69085
          target=7077018477ed0c8f491ad84e20ebb5ecd9a72ca2
          for f in booking-book-flow.css booking-book-flow.js core-app.js index.html; do
            git show "$target:www/$f" > "release/files/$f"
            old=$(git show "$baseline:www/$f" | sha256sum | cut -d' ' -f1)
            new=$(sha256sum "release/files/$f" | cut -d' ' -f1)
            printf '%s %s %s\n' "$old" "$new" "$f" >> release/manifest
          done
          node --check release/files/core-app.js
          node --check release/files/booking-book-flow.js
          test "$(grep -o '20261126-patient-booking-v2' release/files/index.html | wc -l)" -eq 3
          tar -czf patient-ux-${GITHUB_RUN_ID}.tar.gz -C release .
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: patient-ux-${{ github.run_id }}.tar.gz
          target: /tmp
      - name: Verify baseline, replace four files, verify public bytes or roll back
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            umask 077
            root=/opt/a-esthetic-web/site
            test -d "$root" && test ! -L "$root"
            archive=/tmp/patient-ux-${{ github.run_id }}.tar.gz
            work=$(mktemp -d)
            backup_root=/opt/a-esthetic-web/remediation-rollbacks
            install -d -m 0700 "$backup_root"
            exec 9>"$backup_root/web-release.lock"
            flock -n 9
            snapshot=$(mktemp -d "$backup_root/patient-ux.XXXXXXXX")
            changed=0
            restore() {
              rc=$?
              trap - EXIT
              if [ "$rc" != 0 ] && [ "$changed" = 1 ]; then
                while read -r old new f; do
                  cp -p "$snapshot/$f" "$root/.$f.restore-${{ github.run_id }}"
                  mv -f "$root/.$f.restore-${{ github.run_id }}" "$root/$f"
                done < "$work/manifest"
                echo 'Scoped web assets restored.'
              fi
              rm -rf -- "$work"
              rm -f -- "$archive"
              exit "$rc"
            }
            trap restore EXIT
            tar -xzf "$archive" -C "$work"
            test "$(wc -l < "$work/manifest")" -eq 4
            hash() { sha256sum "$1" | cut -d' ' -f1; }
            while read -r old new f; do
              case "$f" in index.html|core-app.js|booking-book-flow.js|booking-book-flow.css) ;; *) exit 1;; esac
              test -f "$root/$f" && test ! -L "$root/$f"
              test "$(hash "$work/files/$f")" = "$new"
              current=$(hash "$root/$f")
              if [ "$current" != "$old" ] && [ "$current" != "$new" ]; then
                echo "Unexpected live baseline: $f; no changes made."
                exit 1
              fi
              cp -a "$root/$f" "$snapshot/$f"
              curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://app.a-esthetic.de/$f?scoped_preflight=${{ github.run_id }}" -o "$work/public"
              test "$(hash "$work/public")" = "$current" || { echo "Public origin mismatch: $f; no changes made."; exit 1; }
            done < "$work/manifest"
            changed=1
            while read -r old new f; do
              tmp="$root/.$f.release-${{ github.run_id }}"
              cp -p "$root/$f" "$tmp"
              cat "$work/files/$f" > "$tmp"
              mv -f "$tmp" "$root/$f"
              test "$(hash "$root/$f")" = "$new"
            done < "$work/manifest"
            while read -r old new f; do
              curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://app.a-esthetic.de/$f?release=${{ github.run_id }}" -o "$work/public"
              test "$(hash "$work/public")" = "$new"
              echo "Verified public asset: $f"
            done < "$work/manifest"
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://app.a-esthetic.de/?release=${{ github.run_id }}" -o "$work/public"
            test "$(hash "$work/public")" = "$(hash "$work/files/index.html")"
            curl -fsS --max-time 20 https://app.a-esthetic.de/api/mobile/status/ -o /dev/null
            changed=0
            echo 'PATIENT_BOOKING_UX_DEPLOYED=7077018477ed0c8f491ad84e20ebb5ecd9a72ca2'
            echo 'Four static files only; backend, database and configuration unchanged.'
