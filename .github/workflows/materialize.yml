name: Materialize source

on:
  push:
    branches: [agent/a-esthetic-platform]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a-esthetic-platform
          fetch-depth: 0
      - name: Materialize source tree
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* | base64 --decode > /tmp/a-esthetic.tar.gz
          tar -xzf /tmp/a-esthetic.tar.gz
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build A+ Esthetic platform"
          git push origin HEAD:agent/a-esthetic-platform
