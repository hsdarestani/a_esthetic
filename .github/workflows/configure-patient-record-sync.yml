name: Configure A+Esthetic patient record sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-patient-record-sync.yml"
  workflow_run:
    workflows: ["Deploy A+ Esthetic native Customer Club API"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: a-esthetic-patient-record-sync
  cancel-in-progress: true

jobs:
  configure:
    if: ${{ github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure cross-service patient record bridge
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            ROOT="/opt/a-esthetic-mobile"
            VENV="$ROOT/venv"
            ENV_FILE="$ROOT/mobile.env"
            TOKEN_FILE="/etc/aesthetic-patient-sync.token"
            SYNC_URL="https://book.a-esthetic.de/api/internal/patient-records/ingest/"
            PORTAL_URL="https://book.a-esthetic.de/api/internal/patient-records/portal/list/"

            test -f "$ENV_FILE"
            test -x "$VENV/bin/python"
            test -f "$ROOT/manage.py"

            if [ ! -s "$TOKEN_FILE" ]; then
              umask 0077
              openssl rand -hex 48 > "$TOKEN_FILE"
            fi
            if getent group aestheticbook >/dev/null 2>&1; then
              chown root:aestheticbook "$TOKEN_FILE"
              chmod 0640 "$TOKEN_FILE"
            else
              chown root:root "$TOKEN_FILE"
              chmod 0600 "$TOKEN_FILE"
            fi

            sed -i '/^PATIENT_RECORD_SYNC_URL=/d;/^PATIENT_RECORD_SYNC_TOKEN=/d;/^PATIENT_RECORD_SYNC_TOKEN_FILE=/d;/^PATIENT_RECORD_SYNC_TIMEOUT=/d' "$ENV_FILE"
            cat >> "$ENV_FILE" <<EOF
            PATIENT_RECORD_SYNC_URL=$SYNC_URL
            PATIENT_RECORD_SYNC_TOKEN_FILE=$TOKEN_FILE
            PATIENT_RECORD_SYNC_TIMEOUT=8
            EOF
            chmod 0600 "$ENV_FILE"
            systemctl restart a-esthetic-mobile.service

            cat > /etc/systemd/system/a-esthetic-patient-record-sync.service <<EOF
            [Unit]
            Description=A+Esthetic consent to patient record synchronization
            After=network.target a-esthetic-mobile.service aesthetic-book.service

            [Service]
            Type=oneshot
            WorkingDirectory=$ROOT
            EnvironmentFile=$ENV_FILE
            ExecStart=$VENV/bin/python $ROOT/manage.py sync_patient_records --limit 1000
            PrivateTmp=true
            NoNewPrivileges=true
            EOF

            cat > /etc/systemd/system/a-esthetic-patient-record-sync.timer <<EOF
            [Unit]
            Description=Retry A+Esthetic patient record synchronization

            [Timer]
            OnBootSec=3min
            OnUnitActiveSec=15min
            RandomizedDelaySec=45s
            Persistent=true

            [Install]
            WantedBy=timers.target
            EOF

            systemctl daemon-reload
            systemctl enable --now a-esthetic-patient-record-sync.timer

            TOKEN="$(cat "$TOKEN_FILE")"
            HTTP_CODE="$(curl -sS -o /tmp/patient-sync-smoke.json -w '%{http_code}' -X POST -H "X-Aesthetic-Patient-Sync: $TOKEN" "$SYNC_URL")"
            test "$HTTP_CODE" = "400"

            PORTAL_CODE="$(curl -sS -o /tmp/patient-portal-smoke.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "X-Aesthetic-Patient-Sync: $TOKEN" --data '{"email":"","phone":""}' "$PORTAL_URL")"
            test "$PORTAL_CODE" = "200"
            "$VENV/bin/python" - <<'PY'
            import json
            with open('/tmp/patient-portal-smoke.json', encoding='utf-8') as handle:
                payload = json.load(handle)
            assert payload.get('ok') is True, payload
            assert payload.get('patient_found') is False, payload
            PY

            set -a; . "$ENV_FILE"; set +a
            cd "$ROOT"
            "$VENV/bin/python" manage.py sync_patient_records --limit 1000
            systemctl is-active --quiet a-esthetic-mobile.service
            systemctl is-active --quiet a-esthetic-patient-record-sync.timer
            echo "A+Esthetic patient record synchronization and customer portal bridge configured."
