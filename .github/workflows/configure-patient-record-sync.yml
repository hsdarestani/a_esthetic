name: Configure A+Esthetic patient record sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-patient-record-sync.yml"
  workflow_run:
    workflows: ["Deploy A+ Esthetic native Customer Club API"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: a-esthetic-patient-record-sync
  cancel-in-progress: true

jobs:
  configure:
    if: ${{ github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure secure cross-server synchronization
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            ROOT="/opt/a-esthetic-mobile"
            ENV_FILE="$ROOT/mobile.env"
            SYNC_URL="https://book.a-esthetic.de/api/internal/patient-records/ingest/"

            test -f "$ENV_FILE"
            test -f "$ROOT/manage.py"

            # The booking service is on a different server. It authenticates this
            # backend by the actual reverse-proxy source address of esthetic.smarbiz.sbs.
            # Remove the obsolete localhost-only token created by the first setup.
            rm -f /etc/aesthetic-patient-sync.token
            sed -i '/^PATIENT_RECORD_SYNC_URL=/d;/^PATIENT_RECORD_SYNC_TOKEN=/d;/^PATIENT_RECORD_SYNC_TOKEN_FILE=/d;/^PATIENT_RECORD_SYNC_TIMEOUT=/d' "$ENV_FILE"
            cat >> "$ENV_FILE" <<EOF
            PATIENT_RECORD_SYNC_URL=$SYNC_URL
            PATIENT_RECORD_SYNC_TIMEOUT=8
            EOF
            chmod 0600 "$ENV_FILE"

            # Reload the API so new ConsentRecords immediately use the public,
            # server-authenticated bridge. A temporary sync failure never blocks
            # consent capture; the timer retries idempotently.
            systemctl restart a-esthetic-mobile.service

            cat > /etc/systemd/system/a-esthetic-patient-record-sync.service <<EOF
            [Unit]
            Description=A+Esthetic consent to patient record synchronization
            After=network.target a-esthetic-mobile.service

            [Service]
            Type=oneshot
            WorkingDirectory=$ROOT
            EnvironmentFile=$ENV_FILE
            Environment=PYTHONPATH=$ROOT/vendor
            ExecStart=/usr/bin/python3 $ROOT/manage.py sync_patient_records --limit 1000
            PrivateTmp=true
            NoNewPrivileges=true
            EOF

            cat > /etc/systemd/system/a-esthetic-patient-record-sync.timer <<EOF
            [Unit]
            Description=Retry A+Esthetic patient record synchronization

            [Timer]
            OnBootSec=3min
            OnUnitActiveSec=15min
            RandomizedDelaySec=45s
            Persistent=true

            [Install]
            WantedBy=timers.target
            EOF

            systemctl daemon-reload
            systemctl enable --now a-esthetic-patient-record-sync.timer

            # Empty POST should pass server authentication and then fail payload
            # validation with 400. 401 means the source-server allowlist failed.
            HTTP_CODE="$(curl -sS -o /tmp/patient-sync-smoke.json -w '%{http_code}' -X POST "$SYNC_URL")"
            if [ "$HTTP_CODE" != "400" ]; then
              cat /tmp/patient-sync-smoke.json || true
              echo "Unexpected patient sync bridge status: $HTTP_CODE" >&2
              exit 1
            fi

            set -a
            . "$ENV_FILE"
            set +a
            export PYTHONPATH="$ROOT/vendor"
            cd "$ROOT"
            python3 manage.py sync_patient_records --limit 1000
            systemctl is-active --quiet a-esthetic-mobile.service
            systemctl is-active --quiet a-esthetic-patient-record-sync.timer
            echo "A+Esthetic patient record synchronization configured."
