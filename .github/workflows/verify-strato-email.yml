name: Verify STRATO email delivery

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  smtp-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send real STRATO test email
        env:
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
        run: |
          test -n "$EMAIL_SMTP_PASSWORD"
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage
          from datetime import datetime, timezone

          username = "app@a-esthetic.de"
          password = os.environ["EMAIL_SMTP_PASSWORD"]
          message = EmailMessage()
          message["Subject"] = "A+ Esthetic – SMTP erfolgreich verbunden"
          message["From"] = f"A+ Esthetic <{username}>"
          message["To"] = username
          message.set_content(
              "Die A+ Esthetic Web-App ist erfolgreich mit dem STRATO SMTP-Postfach verbunden.\n\n"
              f"Testzeitpunkt (UTC): {datetime.now(timezone.utc).isoformat()}\n"
              "Absender: app@a-esthetic.de\n"
              "Server: smtp.strato.de:465 (SSL/TLS)\n"
          )
          context = ssl.create_default_context()
          with smtplib.SMTP_SSL("smtp.strato.de", 465, context=context, timeout=25) as smtp:
              smtp.login(username, password)
              refused = smtp.send_message(message)
              if refused:
                  raise RuntimeError(f"Recipients refused: {refused}")
          print("STRATO SMTP login succeeded and test email was accepted for delivery.")
          PY
