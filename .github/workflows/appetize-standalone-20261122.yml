name: A+ Esthetic Appetize standalone builds 2026-11-22
on:
  push:
    branches: [appetize-isolated-build-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build A+ Esthetic real Android standalone test app
        env:
          APP_VERSION_NAME: '1.0.40'
          APP_BUILD_NUMBER: '46'
          REQUIRE_ANDROID_SIGNING: '0'
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          bash scripts/build-android.sh
          grep -Eq 'minSdkVersion[[:space:]]*=[[:space:]]*26' android/variables.gradle
          echo 'Verified Android minSdkVersion=26 for barcode compatibility'
          (cd android && ./gradlew --no-daemon assembleDebug)
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/A_Esthetic_Appetize_Android_20261122.apk
          test -s artifacts/A_Esthetic_Appetize_Android_20261122.apk
      - uses: actions/upload-artifact@v4
        with:
          name: A_Esthetic_Appetize_Android_20261122
          path: artifacts/A_Esthetic_Appetize_Android_20261122.apk
          if-no-files-found: error
          retention-days: 14
  ios:
    if: false # iOS Appetize artifact was verified in previous run
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build A+ Esthetic real iOS Simulator bundle
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          python3 scripts/configure_native_camera_permissions.py
          if [ -d ios/App/App.xcworkspace ]; then
            CONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            CONTAINER=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${CONTAINER[@]}" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/esthetic-simulator" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP="$RUNNER_TEMP/esthetic-simulator/Build/Products/Debug-iphonesimulator/App.app"
          test -f "$APP/Info.plist"
          test -f "$APP/public/index.html"
          grep -q 'A+ Esthetic' "$APP/public/index.html"
          ! grep -q 'Lokale Vorschau verbinden' "$APP/public/index.html"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifacts/A_Esthetic_Appetize_iOS_20261122.zip
          unzip -t artifacts/A_Esthetic_Appetize_iOS_20261122.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: A_Esthetic_Appetize_iOS_20261122
          path: artifacts/A_Esthetic_Appetize_iOS_20261122.zip
          if-no-files-found: error
          retention-days: 14
