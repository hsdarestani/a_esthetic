name: Diagnose A+ Esthetic Customer Club login

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-customer-club-login.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify migrated account token and dashboard safely
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            ROOT="/opt/a-esthetic-mobile"
            ENV_FILE="$ROOT/mobile.env"
            set -a
            . "$ENV_FILE"
            set +a
            export PYTHONPATH="$ROOT/vendor"
            cd "$ROOT"
            python3 manage.py shell -c "
            from django.contrib.auth.models import User
            from django.contrib.auth.hashers import identify_hasher
            from platform_app.mobile_api import _token_for, _member_payload
            from p0_app.models import DeviceSession
            u=User.objects.get(email__iexact='hsdf7rb@gmail.com')
            member=_member_payload(u)
            token=_token_for(u)
            print('TARGET_PRESENT=', True)
            print('TARGET_ACTIVE=', u.is_active)
            print('PASSWORD_HASHER_SUPPORTED=', bool(identify_hasher(u.password)))
            print('TOKEN_GENERATED=', bool(token))
            print('MEMBER_NUMBER_PRESENT=', bool(member.get('member_number')))
            print('WALLET_READY=', 'coins' in member and 'credit_cents' in member)
            "
