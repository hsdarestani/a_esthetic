name: Diagnose A+ Esthetic Customer Club login

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-customer-club-login.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare current and legacy production accounts safely
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            python3 - <<'PY'
            import os, pathlib, subprocess

            email = 'hsdf7rb@gmail.com'

            # New Customer Club DB.
            new_root = pathlib.Path('/opt/a-esthetic-mobile')
            env = os.environ.copy()
            env_file = new_root / 'mobile.env'
            for raw in env_file.read_text().splitlines():
                raw = raw.strip()
                if raw and not raw.startswith('#') and '=' in raw:
                    k, v = raw.split('=', 1)
                    env[k] = v
            env['PYTHONPATH'] = str(new_root / 'vendor')
            new_code = """
            from django.contrib.auth.models import User
            email='hsdf7rb@gmail.com'
            qs=User.objects.filter(email__iexact=email)
            print('NEW_MATCH=', qs.count())
            print('NEW_TOTAL=', User.objects.count())
            """
            out = subprocess.check_output(['/usr/bin/python3','manage.py','shell','-c',new_code], cwd=new_root, env=env, text=True)
            print(out.strip())

            # Legacy Django service: reuse its live process environment without printing secrets.
            pids=[]
            for p in pathlib.Path('/proc').iterdir():
                if not p.name.isdigit():
                    continue
                try:
                    cmd=(p/'cmdline').read_bytes().replace(b'\0', b' ').decode(errors='ignore')
                    cwd=(p/'cwd').resolve()
                except Exception:
                    continue
                if 'gunicorn' in cmd and '127.0.0.1:8766' in cmd:
                    pids.append((int(p.name), cwd, cmd))
            if not pids:
                raise SystemExit('Legacy :8766 gunicorn process not found')
            pid, legacy_root, _ = sorted(pids)[0]
            raw_env=(pathlib.Path('/proc')/str(pid)/'environ').read_bytes().split(b'\0')
            legacy_env=os.environ.copy()
            for item in raw_env:
                if b'=' not in item:
                    continue
                k,v=item.split(b'=',1)
                legacy_env[k.decode(errors='ignore')]=v.decode(errors='ignore')
            legacy_python='/opt/aesthetic-platform/venv/bin/python3'
            legacy_code = """
            from django.contrib.auth import get_user_model
            U=get_user_model()
            email='hsdf7rb@gmail.com'
            qs=U.objects.filter(email__iexact=email)
            print('LEGACY_MATCH=', qs.count())
            print('LEGACY_TOTAL=', U.objects.count())
            for u in qs:
                print('LEGACY_USER=', {'id':u.pk,'username':getattr(u,'username',''),'email':u.email,'is_active':u.is_active,'is_staff':u.is_staff,'is_superuser':u.is_superuser,'has_usable_password':u.has_usable_password()})
            """
            out = subprocess.check_output([legacy_python,'manage.py','shell','-c',legacy_code], cwd=legacy_root, env=legacy_env, text=True, stderr=subprocess.STDOUT)
            print(out.strip())
            print('LEGACY_ROOT=', legacy_root)
            PY
