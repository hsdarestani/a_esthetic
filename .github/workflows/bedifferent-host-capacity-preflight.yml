name: Read-only Be Different hosting preflight on Esthetic VPS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bedifferent-host-capacity-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check production externally before
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/api/mobile/status/ >/dev/null && echo ESTHETIC_BEFORE=OK
          curl -fsS --max-time 20 https://book.a-esthetic.de/api/health/ >/dev/null && echo BOOKING_BEFORE=OK

      - name: Read-only resource and topology inspection
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            echo "=== CPU ==="
            printf "CPU_CORES="; nproc
            printf "LOAD_AVG="; cat /proc/loadavg
            printf "UPTIME="; uptime -p
            echo "=== RAM ==="
            free -m
            echo "=== DISK ==="
            df -h / /opt /var/lib/docker 2>/dev/null || df -h /
            echo "=== DEPLOY RUNTIME ==="
            printf 'DEPLOY_USER='; id -un
            printf 'OS='; . /etc/os-release && echo "$PRETTY_NAME"
            printf 'ARCH='; uname -m
            for cmd in node npm psql pg_config curl tar sha256sum; do printf 'BIN_%s=' "$cmd"; command -v "$cmd" || echo missing; done
            node --version 2>/dev/null || true
            psql --version 2>/dev/null || true
            printf 'POSTGRES_READY='; pg_isready 2>/dev/null || true
            printf 'DB_BEDIFFERENT_EXISTS='
            if command -v runuser >/dev/null 2>&1; then
              runuser -u postgres -- psql -tAc "SELECT 1 FROM pg_database WHERE datname='bedifferent_temp'" 2>/dev/null | grep -qx 1 && echo true || echo false
            else echo unknown; fi
            echo "=== INODES ==="
            df -i / | tail -n 1
            echo "=== MAJOR SERVICES ==="
            for svc in nginx postgresql docker a-esthetic-mobile a-esthetic-api aesthetic-book; do
              printf "%s=" "$svc"
              systemctl is-active "$svc" 2>/dev/null || true
            done
            echo "=== LISTENING PORTS ==="
            ss -ltnp | grep -E ':(80|443|3100|8017|8765|8770) ' || true
            echo "=== TOP RESIDENT MEMORY ==="
            ps -eo pid,comm,rss,%cpu --sort=-rss | head -n 16
            echo "=== DOCKER COUNTS ==="
            if command -v docker >/dev/null 2>&1; then
              docker ps --format '{{.Names}} | {{.Status}}' || true
              docker system df || true
            else
              echo 'DOCKER_NOT_INSTALLED'
            fi
            echo "=== LOCAL BACKEND HEALTH ==="
            curl -fsS --max-time 10 http://127.0.0.1:8017/api/health/ >/dev/null && echo BOOK_LOCAL=OK || echo BOOK_LOCAL=FAIL
            curl -fsS --max-time 10 http://127.0.0.1:8770/api/mobile/status/ >/dev/null && echo MOBILE_LOCAL=OK || echo MOBILE_LOCAL=FAIL
            echo "=== INSPECTION COMPLETED WITHOUT WRITES ==="

      - name: Check production externally after
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/api/mobile/status/ >/dev/null && echo ESTHETIC_AFTER=OK
          curl -fsS --max-time 20 https://book.a-esthetic.de/api/health/ >/dev/null && echo BOOKING_AFTER=OK
