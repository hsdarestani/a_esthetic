name: Deploy A+ Esthetic Customer Club web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/deploy-customer-club-web.yml"

permissions:
  contents: read

concurrency:
  group: a-esthetic-customer-club-web-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate focused A+ patient app
        run: |
          set -euo pipefail
          for FILE in index.html core-app.css core-app.js customer-dashboard-v2.css booking-direct-api.js admin-mode.js booking-book-flow.css booking-book-flow.js booking-consent-bridge.js booking-final-rules.js focused-upgrade.css focused-upgrade.js native-push.js apple-wallet-only.css apple-wallet-native.js native-interactions.js native-interactions.css mobile-polish.js mobile-polish.css assets/logo.svg; do
            test -s "www/$FILE"
          done
          python - <<'PY'
          import pathlib
          import re
          html = pathlib.Path('www/index.html').read_text(encoding='utf-8')
          legacy = {'app.js','p0.js','p1.js','p2.js','p3.js','ops.js','reference-ui.js','feature-flags.js','runtime-hotfix.js'}
          sources = re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']', html, flags=re.I)
          styles = re.findall(r'<link\b[^>]*\bhref=["\']([^"\']+)["\']', html, flags=re.I)
          names = {source.split('?', 1)[0].rsplit('/', 1)[-1] for source in sources}
          style_names = {source.split('?', 1)[0].rsplit('/', 1)[-1] for source in styles}
          loaded = sorted(names & legacy)
          if loaded: raise SystemExit(f'Legacy customer-club runtime is still loaded: {loaded}')
          required = {'booking-direct-api.js','admin-mode.js','core-app.js','booking-consent-bridge.js','booking-book-flow.js','booking-final-rules.js','focused-upgrade.js','apple-wallet-native.js','native-push.js','native-interactions.js','mobile-polish.js','customer-luxury.js'}
          missing = sorted(required - names)
          if missing: raise SystemExit(f'Focused runtime is missing required scripts: {missing}')
          required_styles = {'core-app.css','booking-book-flow.css','focused-upgrade.css','apple-wallet-only.css','native-interactions.css','mobile-polish.css','customer-luxury.css','customer-dashboard-v2.css'}
          missing_styles = sorted(required_styles - style_names)
          if missing_styles: raise SystemExit(f'Focused runtime is missing required styles: {missing_styles}')
          print('Focused runtime validation OK')
          PY
          grep -q './assets/logo.svg' www/focused-upgrade.js
          node --check www/core-app.js
          node --check www/booking-direct-api.js
          node --check www/admin-mode.js
          node --check www/booking-consent-bridge.js
          node --check www/booking-book-flow.js
          node --check www/booking-final-rules.js
          node --check www/focused-upgrade.js
          node --check www/apple-wallet-native.js
          node --check www/native-push.js
          node --check www/native-interactions.js
          node --check www/mobile-polish.js
          node --check www/customer-luxury.js
          tar -C www -czf customer-club-web.tar.gz .

      - name: Upload focused web bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "customer-club-web.tar.gz"
          target: "/tmp"

      - name: Publish focused app on new STRATO server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            WEBROOT="/opt/a-esthetic-web/site"
            RELEASE_DIR="/tmp/a-esthetic-focused-app"
            PACKAGE="/tmp/customer-club-web.tar.gz"
            DOMAIN="esthetic.smarbiz.sbs"
            CONF="/etc/nginx/sites-available/a-esthetic-connected.conf"

            for attempt in $(seq 1 120); do
              if ! pgrep -x apt-get >/dev/null && ! pgrep -x apt >/dev/null && ! pgrep -x dpkg >/dev/null; then break; fi
              echo "Waiting for another package operation ($attempt/120)..."
              sleep 5
            done
            if pgrep -x apt-get >/dev/null || pgrep -x apt >/dev/null || pgrep -x dpkg >/dev/null; then
              echo "Package manager remained busy for 10 minutes"; exit 1
            fi

            apt-get update -y
            apt-get install -y nginx curl ca-certificates certbot python3-certbot-nginx

            test -f "$PACKAGE"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR" "$WEBROOT"
            tar -xzf "$PACKAGE" -C "$RELEASE_DIR"
            for FILE in index.html core-app.css core-app.js customer-dashboard-v2.css booking-direct-api.js admin-mode.js booking-book-flow.css booking-book-flow.js booking-consent-bridge.js booking-final-rules.js focused-upgrade.css focused-upgrade.js native-push.js apple-wallet-only.css apple-wallet-native.js native-interactions.js native-interactions.css mobile-polish.js mobile-polish.css customer-luxury.js customer-luxury.css assets/logo.svg; do test -s "$RELEASE_DIR/$FILE"; done

            rm -rf "$WEBROOT"/*
            cp -a "$RELEASE_DIR"/. "$WEBROOT"/
            chown -R root:root "$WEBROOT"
            find "$WEBROOT" -type d -exec chmod 0755 {} +
            find "$WEBROOT" -type f -exec chmod 0644 {} +

            if [ ! -f "$CONF" ]; then
              cat > "$CONF" <<'NGINX'
            server {
              listen 80;
              listen [::]:80;
              server_name esthetic.smarbiz.sbs;
              root /opt/a-esthetic-web/site;
              index index.html;
              client_max_body_size 30m;
              location / { try_files $uri $uri/ /index.html; }
              location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
              add_header X-Content-Type-Options nosniff always;
              add_header X-Frame-Options DENY always;
              add_header Referrer-Policy strict-origin-when-cross-origin always;
              add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            }
            NGINX
            fi

            ln -sfn "$CONF" /etc/nginx/sites-enabled/a-esthetic-connected.conf
            rm -f /etc/nginx/sites-enabled/default
            nginx -t

            # Certbot redirects the HTTP vhost to HTTPS. Follow that redirect for
            # the smoke check; a 301 body is not the customer bundle.
            if ! curl -fsSL --max-time 15 http://127.0.0.1/ -H "Host: $DOMAIN" -o /tmp/aesthetic-focused-local-index.html; then
              systemctl restart nginx || {
                systemctl status nginx --no-pager || true
                journalctl -u nginx -n 80 --no-pager || true
                exit 1
              }
              sleep 2
              curl -fsSL --max-time 20 http://127.0.0.1/ -H "Host: $DOMAIN" -o /tmp/aesthetic-focused-local-index.html
            fi

            grep -q 'customer-dashboard-v2.css' /tmp/aesthetic-focused-local-index.html
            grep -q 'core-app.js' /tmp/aesthetic-focused-local-index.html
            grep -q 'booking-final-rules.js' /tmp/aesthetic-focused-local-index.html
            grep -q 'mobile-polish.js' /tmp/aesthetic-focused-local-index.html
            grep -q '20260912-native-scroll-spacing-v6' /tmp/aesthetic-focused-local-index.html
            grep -q '20260912-native-scroll-v6' /tmp/aesthetic-focused-local-index.html

            if ! curl -fsSL --max-time 20 "https://$DOMAIN/?release=20260912-native-scroll-v6" -o /tmp/aesthetic-focused-index.html; then
              certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email --redirect
              curl -fsSL --max-time 20 "https://$DOMAIN/?release=20260912-native-scroll-v6" -o /tmp/aesthetic-focused-index.html
            fi
            grep -q '20260912-native-scroll-spacing-v6' /tmp/aesthetic-focused-index.html
            echo "Focused A+ patient app prepared on new STRATO origin for $DOMAIN"
            rm -rf "$RELEASE_DIR" "$PACKAGE"
