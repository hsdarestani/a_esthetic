name: Deploy A+ Esthetic Customer Club web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/deploy-customer-club-web.yml"

permissions:
  contents: read

concurrency:
  group: a-esthetic-customer-club-web-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate focused A+ patient app
        run: |
          set -euo pipefail
          for FILE in index.html core-app.css core-app.js customer-dashboard-v2.css booking-direct-api.js admin-mode.js booking-book-flow.css booking-book-flow.js booking-consent-bridge.js booking-final-rules.js focused-upgrade.css focused-upgrade.js native-push.js apple-wallet-only.css apple-wallet-native.js native-interactions.js native-interactions.css mobile-polish.js mobile-polish.css assets/logo.svg; do
            test -s "www/$FILE"
          done
          python - <<'PY'
          import pathlib
          import re

          html = pathlib.Path('www/index.html').read_text(encoding='utf-8')
          legacy = {
              'app.js', 'p0.js', 'p1.js', 'p2.js', 'p3.js', 'ops.js',
              'reference-ui.js', 'feature-flags.js', 'runtime-hotfix.js',
          }
          sources = re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']', html, flags=re.I)
          styles = re.findall(r'<link\b[^>]*\bhref=["\']([^"\']+)["\']', html, flags=re.I)
          names = {source.split('?', 1)[0].rsplit('/', 1)[-1] for source in sources}
          style_names = {source.split('?', 1)[0].rsplit('/', 1)[-1] for source in styles}
          loaded = sorted(names & legacy)
          if loaded:
              raise SystemExit(f'Legacy customer-club runtime is still loaded: {loaded}')
          required = {
              'booking-direct-api.js', 'admin-mode.js', 'core-app.js',
              'booking-consent-bridge.js', 'booking-book-flow.js', 'booking-final-rules.js',
              'focused-upgrade.js', 'apple-wallet-native.js', 'native-push.js',
              'native-interactions.js', 'mobile-polish.js', 'customer-luxury.js',
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'Focused runtime is missing required scripts: {missing}')
          required_styles = {
              'core-app.css', 'booking-book-flow.css', 'focused-upgrade.css',
              'apple-wallet-only.css', 'native-interactions.css', 'mobile-polish.css',
              'customer-luxury.css', 'customer-dashboard-v2.css',
          }
          missing_styles = sorted(required_styles - style_names)
          if missing_styles:
              raise SystemExit(f'Focused runtime is missing required styles: {missing_styles}')
          print('Focused runtime validation OK')
          PY
          grep -q './assets/logo.svg' www/focused-upgrade.js
          node --check www/core-app.js
          node --check www/booking-direct-api.js
          node --check www/admin-mode.js
          node --check www/booking-consent-bridge.js
          node --check www/booking-book-flow.js
          node --check www/booking-final-rules.js
          node --check www/focused-upgrade.js
          node --check www/apple-wallet-native.js
          node --check www/native-push.js
          node --check www/native-interactions.js
          node --check www/mobile-polish.js
          node --check www/customer-luxury.js
          tar -C www -czf customer-club-web.tar.gz .

      - name: Upload focused web bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          source: "customer-club-web.tar.gz"
          target: "/tmp"

      - name: Publish focused app on production HTTPS vhost
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            WEBROOT="/opt/a-esthetic-web/site"
            RELEASE_DIR="/tmp/a-esthetic-focused-app"
            PACKAGE="/tmp/customer-club-web.tar.gz"
            DOMAIN="esthetic.smarbiz.sbs"

            test -f "$PACKAGE"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR" "$WEBROOT"
            tar -xzf "$PACKAGE" -C "$RELEASE_DIR"

            for FILE in index.html core-app.css core-app.js customer-dashboard-v2.css booking-direct-api.js admin-mode.js booking-book-flow.css booking-book-flow.js booking-consent-bridge.js booking-final-rules.js focused-upgrade.css focused-upgrade.js native-push.js apple-wallet-only.css apple-wallet-native.js native-interactions.js native-interactions.css mobile-polish.js mobile-polish.css customer-luxury.js customer-luxury.css assets/logo.svg; do
              test -s "$RELEASE_DIR/$FILE"
            done

            rm -rf "$WEBROOT"/*
            cp -a "$RELEASE_DIR"/. "$WEBROOT"/
            chown -R root:root "$WEBROOT"
            find "$WEBROOT" -type d -exec chmod 0755 {} +
            find "$WEBROOT" -type f -exec chmod 0644 {} +

            nginx -t
            systemctl reload nginx
            sleep 2

            curl -fsS --max-time 20 "https://$DOMAIN/?release=20260907-dashboard-points" -o /tmp/aesthetic-focused-index.html
            grep -q 'customer-dashboard-v2.css' /tmp/aesthetic-focused-index.html
            grep -q 'core-app.js' /tmp/aesthetic-focused-index.html
            grep -q 'booking-final-rules.js' /tmp/aesthetic-focused-index.html
            grep -q 'mobile-polish.js' /tmp/aesthetic-focused-index.html
            for FILE in core-app.css core-app.js customer-dashboard-v2.css booking-direct-api.js admin-mode.js booking-book-flow.css booking-book-flow.js booking-consent-bridge.js booking-final-rules.js focused-upgrade.css focused-upgrade.js native-push.js apple-wallet-only.css apple-wallet-native.js native-interactions.js native-interactions.css mobile-polish.js mobile-polish.css customer-luxury.js customer-luxury.css assets/logo.svg; do
              SAFE_NAME="$(printf '%s' "$FILE" | tr '/' '-')"
              curl -fsS --max-time 20 "https://$DOMAIN/$FILE?release=20260907-dashboard-points" -o "/tmp/$SAFE_NAME"
              test -s "/tmp/$SAFE_NAME"
            done
            curl -fsS --max-time 20 "https://$DOMAIN/api/mobile/status/" | grep -qi 'customer club'

            echo "Focused A+ patient app deployed successfully: https://$DOMAIN"
            rm -rf "$RELEASE_DIR" "$PACKAGE"
