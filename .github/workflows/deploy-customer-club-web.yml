name: Deploy A+ Esthetic Customer Club web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/deploy-customer-club-web.yml"

permissions:
  contents: read

concurrency:
  group: a-esthetic-customer-club-web-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and package current Customer Club web
        run: |
          set -euo pipefail
          test -f www/index.html
          test -f www/app.css
          test -f www/app.js
          test -f www/p0.js
          test -f www/p0-booking-change.js
          test -f www/p1.js
          test -f www/p2.js
          test -f www/p3.js
          test -f www/sw.js
          grep -q 'p3.js?v=20260812-p3-web' www/index.html
          node --check www/app.js
          node --check www/p0.js
          node --check www/p0-booking-change.js
          node --check www/p1.js
          node --check www/p2.js
          node --check www/p3.js
          tar -C www -czf customer-club-web.tar.gz .

      - name: Upload Customer Club web bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          source: "customer-club-web.tar.gz"
          target: "/tmp"

      - name: Publish current Customer Club web on esthetic.smarbiz.sbs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            WEBROOT="/opt/a-esthetic-web/site"
            RELEASE="/tmp/a-esthetic-customer-club-web"
            PACKAGE="/tmp/customer-club-web.tar.gz"
            DOMAIN="esthetic.smarbiz.sbs"
            RELEASE_ID="20260812-p3-web"

            command -v python3 >/dev/null
            command -v tar >/dev/null
            test -f "$PACKAGE"

            rm -rf "$RELEASE"
            mkdir -p "$RELEASE" "$WEBROOT"
            tar -xzf "$PACKAGE" -C "$RELEASE"

            for FILE in index.html app.css app.js p0.js p0-booking-change.js p1.js p2.js p3.js sw.js; do
              test -f "$RELEASE/$FILE"
            done
            grep -q "p3.js?v=$RELEASE_ID" "$RELEASE/index.html"

            rm -rf "$WEBROOT"/*
            cp -a "$RELEASE"/. "$WEBROOT"/
            chown -R root:root "$WEBROOT"
            find "$WEBROOT" -type d -exec chmod 0755 {} +
            find "$WEBROOT" -type f -exec chmod 0644 {} +
            grep -q "p3.js?v=$RELEASE_ID" "$WEBROOT/index.html"

            if command -v nginx >/dev/null 2>&1 && systemctl is-active --quiet nginx; then
              CONF="/etc/nginx/sites-available/a-esthetic-connected.conf"
              cat > "$CONF" <<'NGINX'
            server {
              listen 80;
              listen [::]:80;
              server_name esthetic.smarbiz.sbs;
              root /opt/a-esthetic-web/site;
              index index.html;
              client_max_body_size 10m;

              location ^~ /api/mobile/ {
                proxy_pass http://127.0.0.1:8770;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
              location ^~ /accounts/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
              location = /login/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
              location = /datenschutz/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
              location ^~ /datenschutz/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
              location = /support/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
              location = /konto-loeschen/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
              location = /nutzungsbedingungen/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
              location = /impressum/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

              # Keep the legacy connected API reachable for any remaining admin/compatibility routes.
              location /api/ {
                proxy_pass http://127.0.0.1:8765;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }

              location = /index.html {
                try_files /index.html =404;
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
                add_header Pragma "no-cache" always;
                add_header X-A-Esthetic-Release "20260812-p3-web" always;
              }
              location = /sw.js {
                try_files /sw.js =404;
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
                add_header X-A-Esthetic-Release "20260812-p3-web" always;
              }
              location / {
                try_files $uri $uri/ /index.html;
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
                add_header X-A-Esthetic-Release "20260812-p3-web" always;
              }

              add_header X-Content-Type-Options nosniff always;
              add_header X-Frame-Options DENY always;
              add_header Referrer-Policy strict-origin-when-cross-origin always;
              add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
              add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self' https://esthetic.smarbiz.sbs; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            }
            NGINX
              rm -f /etc/nginx/sites-enabled/default
              ln -sfn "$CONF" /etc/nginx/sites-enabled/a-esthetic-connected.conf
              nginx -t
              systemctl reload nginx
            fi

            if command -v caddy >/dev/null 2>&1 && systemctl is-active --quiet caddy; then
              CADDYFILE="/etc/caddy/Caddyfile"
              python3 - <<'PY'
            from pathlib import Path
            p = Path('/etc/caddy/Caddyfile')
            s = p.read_text() if p.exists() else ''
            begin = '# BEGIN A_ESTHETIC_WEB'
            end = '# END A_ESTHETIC_WEB'
            a = s.find(begin)
            b = s.find(end, a)
            if a >= 0 and b >= 0:
                b += len(end)
                s = s[:a] + s[b:]
            block = r'''# BEGIN A_ESTHETIC_WEB
            esthetic.smarbiz.sbs {
              encode zstd gzip
              @mobile path /api/mobile/* /accounts/* /login/ /datenschutz/ /datenschutz/* /support/ /konto-loeschen/ /nutzungsbedingungen/ /impressum/
              handle @mobile { reverse_proxy 127.0.0.1:8770 }
              handle /api/* { reverse_proxy 127.0.0.1:8765 }
              root * /opt/a-esthetic-web/site
              try_files {path} /index.html
              file_server
              header {
                Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
                X-A-Esthetic-Release "20260812-p3-web"
                X-Content-Type-Options nosniff
                X-Frame-Options DENY
                Referrer-Policy strict-origin-when-cross-origin
              }
            }
            # END A_ESTHETIC_WEB
            '''
            p.write_text(s.rstrip() + '\n' + block)
            PY
              caddy validate --config "$CADDYFILE"
              systemctl reload caddy
            fi

            python3 - <<'PY'
            import socket
            from pathlib import Path
            from urllib.error import HTTPError, URLError
            from urllib.request import Request, urlopen

            release = '20260812-p3-web'
            marker = f'p3.js?v={release}'
            webroot = Path('/opt/a-esthetic-web/site/index.html').read_text(encoding='utf-8')
            if marker not in webroot:
                raise SystemExit('Published webroot does not contain the P3 release marker.')

            def fetch(url, host=None):
                headers = {
                    'User-Agent': 'A-Esthetic-Web-Deploy-Smoke/2.0',
                    'Cache-Control': 'no-cache, no-store',
                }
                if host:
                    headers['Host'] = host
                req = Request(url, headers=headers)
                try:
                    with urlopen(req, timeout=20) as response:
                        return response.status, response.read().decode('utf-8', 'replace'), dict(response.headers)
                except HTTPError as exc:
                    return exc.code, exc.read().decode('utf-8', 'replace'), dict(exc.headers)
                except URLError as exc:
                    raise SystemExit(f'Web smoke request failed for {url}: {exc}')

            # First prove that the local origin itself serves the new root for the production Host header.
            local_status, local_home, local_headers = fetch('http://127.0.0.1/?release=' + release, host='esthetic.smarbiz.sbs')
            if local_status != 200 or marker not in local_home:
                raise SystemExit(f'Origin routing smoke failed: {local_status}')

            public_status, public_home, public_headers = fetch('https://esthetic.smarbiz.sbs/?release=' + release)
            if public_status != 200 or marker not in public_home:
                resolved = socket.gethostbyname_ex('esthetic.smarbiz.sbs')
                raise SystemExit(f'Public index still differs from origin: status={public_status}, dns={resolved}')

            for asset in ('app.css', 'app.js', 'p0.js', 'p0-booking-change.js', 'p1.js', 'p2.js', 'p3.js', 'sw.js'):
                status, body, _ = fetch(f'https://esthetic.smarbiz.sbs/{asset}?release={release}')
                if status != 200 or not body.strip():
                    raise SystemExit(f'Customer Club asset smoke failed for {asset}: {status}')

            status, _, _ = fetch('https://esthetic.smarbiz.sbs/api/mobile/status/')
            if status != 200:
                raise SystemExit(f'Mobile API smoke failed after web publish: {status}')

            print('A+ Esthetic Customer Club web P0-P3 is live on esthetic.smarbiz.sbs.')
            PY

            rm -rf "$RELEASE" "$PACKAGE"
