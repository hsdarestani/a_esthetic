name: Deploy A+ Esthetic Customer Club web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/deploy-customer-club-web.yml"

permissions:
  contents: read

concurrency:
  group: a-esthetic-customer-club-web-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate focused A+ patient app
        run: |
          set -euo pipefail
          for FILE in index.html core-app.css core-app.js booking-direct-api.js admin-mode.js; do
            test -s "www/$FILE"
          done
          grep -q 'core-app.css?v=20260906-focus-v1' www/index.html
          grep -q 'core-app.js?v=20260906-focus-v1' www/index.html
          grep -q 'booking-direct-api.js?v=20260906-focus-v1' www/index.html
          grep -q 'admin-mode.js?v=20260906-focus-v1' www/index.html
          python - <<'PY'
          import pathlib
          import re

          html = pathlib.Path('www/index.html').read_text(encoding='utf-8')
          legacy = {
              'app.js', 'p0.js', 'p1.js', 'p2.js', 'p3.js', 'ops.js',
              'reference-ui.js', 'feature-flags.js', 'runtime-hotfix.js',
          }
          sources = re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']', html, flags=re.I)
          loaded = []
          for source in sources:
              path = source.split('?', 1)[0].split('#', 1)[0]
              if path.rsplit('/', 1)[-1] in legacy:
                  loaded.append(source)
          if loaded:
              raise SystemExit(f'Legacy customer-club runtime is still loaded: {loaded}')
          print('Focused runtime validation OK:', ', '.join(sources))
          PY
          node --check www/core-app.js
          node --check www/booking-direct-api.js
          node --check www/admin-mode.js
          tar -C www -czf customer-club-web.tar.gz .

      - name: Upload focused web bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          source: "customer-club-web.tar.gz"
          target: "/tmp"

      - name: Publish focused app on production HTTPS vhost
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            WEBROOT="/opt/a-esthetic-web/site"
            RELEASE_DIR="/tmp/a-esthetic-focused-app"
            PACKAGE="/tmp/customer-club-web.tar.gz"
            DOMAIN="esthetic.smarbiz.sbs"

            test -f "$PACKAGE"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR" "$WEBROOT"
            tar -xzf "$PACKAGE" -C "$RELEASE_DIR"

            for FILE in index.html core-app.css core-app.js booking-direct-api.js admin-mode.js; do
              test -s "$RELEASE_DIR/$FILE"
            done
            grep -q 'core-app.js?v=20260906-focus-v1' "$RELEASE_DIR/index.html"
            grep -q 'core-app.css?v=20260906-focus-v1' "$RELEASE_DIR/index.html"

            rm -rf "$WEBROOT"/*
            cp -a "$RELEASE_DIR"/. "$WEBROOT"/
            chown -R root:root "$WEBROOT"
            find "$WEBROOT" -type d -exec chmod 0755 {} +
            find "$WEBROOT" -type f -exec chmod 0644 {} +

            nginx -t
            systemctl reload nginx
            sleep 2

            curl -fsS --max-time 20 "https://$DOMAIN/?release=20260906-focus-v1" -o /tmp/aesthetic-focused-index.html
            grep -q 'core-app.js?v=20260906-focus-v1' /tmp/aesthetic-focused-index.html
            grep -q 'core-app.css?v=20260906-focus-v1' /tmp/aesthetic-focused-index.html
            for FILE in core-app.css core-app.js booking-direct-api.js admin-mode.js; do
              curl -fsS --max-time 20 "https://$DOMAIN/$FILE?release=20260906-focus-v1" -o "/tmp/$FILE"
              test -s "/tmp/$FILE"
            done
            curl -fsS --max-time 20 "https://$DOMAIN/api/mobile/status/" | grep -qi 'customer club'

            echo "Focused A+ patient app deployed successfully: https://$DOMAIN"
            rm -rf "$RELEASE_DIR" "$PACKAGE"
