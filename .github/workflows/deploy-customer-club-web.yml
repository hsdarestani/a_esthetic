name: Deploy A+ Esthetic Customer Club web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/deploy-customer-club-web.yml"

permissions:
  contents: read

concurrency:
  group: a-esthetic-customer-club-web-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and package current Customer Club web
        run: |
          set -euo pipefail
          for FILE in index.html app.css app.js p0.js p1.js p2.js p3.js reference-ui.css reference-ui.js sw.js booking-direct-api.js booking-book-flow.js booking-book-flow.css booking-manage.js; do
            test -s "www/$FILE"
          done
          grep -q 'p3.js?v=20260812-p3-web' www/index.html
          grep -q 'app.css?v=20260812-core' www/index.html
          grep -q 'reference-ui.css?v=20260816-luxury-v2' www/index.html
          grep -q 'reference-ui.js?v=20260816-luxury-v2' www/index.html
          grep -q 'booking-book-flow.js?v=20260904-book-match-v2' www/index.html
          grep -q 'booking-manage.js?v=20260904-book-manage-v1' www/index.html
          if grep -Eq 'booking-modern|booking-doctolib|p0-booking-change|booking-confirm-mobile-fix|wow.js' www/index.html; then
            echo 'A retired booking/UI asset is still loaded.'
            exit 1
          fi
          node --check www/app.js
          node --check www/p0.js
          node --check www/p1.js
          node --check www/p2.js
          node --check www/p3.js
          node --check www/booking-direct-api.js
          node --check www/booking-book-flow.js
          node --check www/booking-manage.js
          node --check www/reference-ui.js
          tar -C www -czf customer-club-web.tar.gz .

      - name: Upload Customer Club web bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          source: "customer-club-web.tar.gz"
          target: "/tmp"

      - name: Publish luxury Customer Club on the production HTTPS vhost
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            WEBROOT="/opt/a-esthetic-web/site"
            RELEASE_DIR="/tmp/a-esthetic-customer-club-web"
            PACKAGE="/tmp/customer-club-web.tar.gz"
            VHOST="/etc/nginx/sites-available/a-esthetic-web.conf"
            DOMAIN="esthetic.smarbiz.sbs"
            P3_RELEASE_ID="20260812-p3-web"
            CORE_RELEASE_ID="20260812-core"
            LUX_RELEASE_ID="20260816-luxury-v2"

            command -v python3 >/dev/null
            command -v tar >/dev/null
            command -v nginx >/dev/null
            test -f "$PACKAGE"
            test -f /etc/letsencrypt/live/esthetic.smarbiz.sbs/fullchain.pem
            test -f /etc/letsencrypt/live/esthetic.smarbiz.sbs/privkey.pem

            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR" "$WEBROOT"
            tar -xzf "$PACKAGE" -C "$RELEASE_DIR"

            for FILE in index.html app.css app.js p0.js p1.js p2.js p3.js reference-ui.css reference-ui.js sw.js booking-direct-api.js booking-book-flow.js booking-book-flow.css booking-manage.js; do
              test -s "$RELEASE_DIR/$FILE"
            done
            grep -q "p3.js?v=$P3_RELEASE_ID" "$RELEASE_DIR/index.html"
            grep -q "app.css?v=$CORE_RELEASE_ID" "$RELEASE_DIR/index.html"
            grep -q "reference-ui.css?v=$LUX_RELEASE_ID" "$RELEASE_DIR/index.html"
            grep -q "reference-ui.js?v=$LUX_RELEASE_ID" "$RELEASE_DIR/index.html"
            grep -q 'booking-book-flow.js?v=20260904-book-match-v2' "$RELEASE_DIR/index.html"
            grep -q 'booking-manage.js?v=20260904-book-manage-v1' "$RELEASE_DIR/index.html"

            rm -rf "$WEBROOT"/*
            cp -a "$RELEASE_DIR"/. "$WEBROOT"/
            chown -R root:root "$WEBROOT"
            find "$WEBROOT" -type d -exec chmod 0755 {} +
            find "$WEBROOT" -type f -exec chmod 0644 {} +
            grep -q "reference-ui.js?v=$LUX_RELEASE_ID" "$WEBROOT/index.html"

            if [ -f "$VHOST" ]; then
              cp -a "$VHOST" "$VHOST.pre-luxury-static"
            fi

            cat > "$VHOST" <<'NGINX'
            server {
              listen 80;
              listen [::]:80;
              server_name esthetic.smarbiz.sbs;
              return 301 https://$host$request_uri;
            }

            server {
              listen 443 ssl http2;
              listen [::]:443 ssl http2;
              server_name esthetic.smarbiz.sbs;

              ssl_certificate /etc/letsencrypt/live/esthetic.smarbiz.sbs/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/esthetic.smarbiz.sbs/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

              root /opt/a-esthetic-web/site;
              index index.html;
              client_max_body_size 10m;

              location ^~ /api/mobile/ {
                proxy_pass http://127.0.0.1:8770;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
              }
              location ^~ /accounts/ {
                proxy_pass http://127.0.0.1:8770;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
              }
              location = /login/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
              location = /datenschutz/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
              location ^~ /datenschutz/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
              location = /support/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
              location = /konto-loeschen/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
              location = /nutzungsbedingungen/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
              location = /impressum/ { proxy_pass http://127.0.0.1:8770; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }

              location /api/ {
                proxy_pass http://127.0.0.1:8765;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
              }

              location = /index.html {
                try_files /index.html =404;
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
                add_header Pragma "no-cache" always;
                add_header X-A-Esthetic-Release "20260904-book-canonical-v2" always;
              }
              location = /sw.js {
                try_files /sw.js =404;
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
                add_header X-A-Esthetic-Release "20260904-book-canonical-v2" always;
              }
              location / {
                try_files $uri $uri/ /index.html;
                add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
                add_header X-A-Esthetic-Release "20260904-book-canonical-v2" always;
              }

              add_header X-Content-Type-Options nosniff always;
              add_header X-Frame-Options DENY always;
              add_header Referrer-Policy strict-origin-when-cross-origin always;
            }
            NGINX

            rm -f /etc/nginx/sites-enabled/a-esthetic-connected.conf
            rm -f /etc/nginx/sites-enabled/default
            ln -sfn "$VHOST" /etc/nginx/sites-enabled/a-esthetic-web.conf

            CONFLICTS="$(find /etc/nginx/sites-enabled /etc/nginx/conf.d -maxdepth 1 \( -type f -o -type l \) 2>/dev/null | while read -r f; do [ "$(readlink -f "$f" 2>/dev/null || echo "$f")" = "$(readlink -f "$VHOST")" ] && continue; grep -l 'server_name esthetic.smarbiz.sbs' "$f" 2>/dev/null || true; done)"
            test -z "$CONFLICTS" || { echo "Conflicting A+ Esthetic nginx configs: $CONFLICTS"; exit 1; }

            nginx -t
            systemctl reload nginx

            python3 - <<'PY'
            import ssl
            from pathlib import Path
            from urllib.error import HTTPError, URLError
            from urllib.request import HTTPSHandler, Request, build_opener, urlopen

            markers = (
                'p3.js?v=20260812-p3-web',
                'app.css?v=20260812-core',
                'reference-ui.css?v=20260816-luxury-v2',
                'reference-ui.js?v=20260816-luxury-v2',
                'booking-book-flow.js?v=20260904-book-match-v2',
                'booking-manage.js?v=20260904-book-manage-v1',
            )
            domain = 'esthetic.smarbiz.sbs'
            release_id = '20260904-book-canonical-v2'

            webroot_html = Path('/opt/a-esthetic-web/site/index.html').read_text(encoding='utf-8')
            for marker in markers:
                if marker not in webroot_html:
                    raise SystemExit(f'Published webroot is missing marker: {marker}')
            retired = ('booking-modern', 'booking-doctolib', 'p0-booking-change', 'booking-confirm-mobile-fix', 'wow.js')
            if any(marker in webroot_html for marker in retired):
                raise SystemExit('A retired booking/UI asset is still loaded in published index.html')

            def fetch(url, host=None, insecure=False):
                headers = {
                    'User-Agent': 'A-Esthetic-Canonical-Booking-Smoke/1.0',
                    'Cache-Control': 'no-cache, no-store',
                    'Pragma': 'no-cache',
                }
                if host:
                    headers['Host'] = host
                req = Request(url, headers=headers)
                try:
                    if insecure:
                        context = ssl._create_unverified_context()
                        opener = build_opener(HTTPSHandler(context=context))
                        response = opener.open(req, timeout=20)
                    else:
                        response = urlopen(req, timeout=20)
                    with response:
                        return response.status, response.read().decode('utf-8', 'replace'), dict(response.headers)
                except HTTPError as exc:
                    return exc.code, exc.read().decode('utf-8', 'replace'), dict(exc.headers)
                except URLError as exc:
                    raise SystemExit(f'Web smoke request failed for {url}: {exc}')

            origin_status, origin_html, _ = fetch(f'https://127.0.0.1/?release={release_id}', host=domain, insecure=True)
            if origin_status != 200 or not all(m in origin_html for m in markers):
                raise SystemExit(f'HTTPS origin is not serving canonical booking release: {origin_status}')

            public_status, public_html, _ = fetch(f'https://{domain}/?release={release_id}')
            if public_status != 200 or not all(m in public_html for m in markers):
                raise SystemExit(f'Public Customer Club is not serving canonical booking release: {public_status}')

            assets = (
                'app.css','app.js','p0.js','p1.js','p2.js','p3.js','reference-ui.css','reference-ui.js','sw.js',
                'booking-direct-api.js','booking-book-flow.js','booking-book-flow.css','booking-manage.js'
            )
            for asset in assets:
                status, body, _ = fetch(f'https://{domain}/{asset}?release={release_id}')
                if status != 200 or not body.strip():
                    raise SystemExit(f'Public asset {asset} failed: {status}')

            api_status, api_body, _ = fetch(f'https://{domain}/api/mobile/status/')
            if api_status != 200 or 'customer club' not in api_body.lower():
                raise SystemExit(f'Mobile API failed after web publish: {api_status}')

            package_status, _, _ = fetch(f'https://{domain}/api/mobile/package-booking/')
            if package_status not in {401, 405}:
                raise SystemExit(f'Package bridge endpoint smoke failed: {package_status}')

            print('A+ Esthetic canonical booking Customer Club UI is live on production HTTPS.')
            PY

            rm -rf "$RELEASE_DIR" "$PACKAGE"
