name: Focused A+ Office and GOÄ web release QA (no deploy)
on:
  push:
    branches: [release/office-goae-web-20261123]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check all DB migrations and server-side URLs
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check
      - name: Test signed Office intake and GOÄ multi-line arithmetic
        run: |
          python manage.py test platform_app.test_office_invoicing platform_app.test_goae_draft --verbosity 2
      - name: Full Django regression
        run: python manage.py test --verbosity 1
