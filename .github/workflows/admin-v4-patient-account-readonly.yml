name: Diagnose production patient account API (read only)
on:
  push:
    branches: ['ops/admin-v4-production-preflight-20261124']
    paths: ['.github/workflows/admin-v4-patient-account-readonly.yml']
permissions: {contents: read}
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -euo pipefail
            cd /opt/a-esthetic-mobile
            set -a
            . /opt/a-esthetic-mobile/mobile.env
            set +a
            git rev-parse HEAD || true
            systemctl show a-esthetic-mobile.service -p ActiveState -p WorkingDirectory --no-pager
            master=$(systemctl show a-esthetic-mobile.service -p MainPID --value)
            python3 - "$master" <<'PY'
            import os,sys,datetime
            pid=int(sys.argv[1]); args=open(f'/proc/{pid}/cmdline','rb').read().split(b'\0')
            print('GUNICORN_PRELOAD_FLAG',b'--preload' in args)
            print('MASTER_START',datetime.datetime.fromtimestamp(os.stat(f'/proc/{pid}').st_ctime).isoformat())
            print('OFFICE_FILE_MODIFIED',datetime.datetime.fromtimestamp(os.stat('p0_app/native_office.py').st_mtime).isoformat())
            PY
            /opt/a-esthetic-mobile/venv/bin/python manage.py shell <<'PY'
            from django.urls import resolve
            from django.db import connection, transaction
            from django.test import RequestFactory
            from unittest.mock import patch
            from p0_app import native_office
            paths=['/api/mobile/staff/office/patient-account/0/','/api/mobile/staff/office/invoices/0/','/api/mobile/admin/customers/0/']
            for path in paths:
                match=resolve(path)
                print('ROUTE',path,match.func.__module__,match.func.__name__)
            # Isolated in-process test with an impossible synthetic identifier;
            # no authentication policy is changed, no user data read or logged.
            with transaction.atomic():
                if connection.vendor=='postgresql':
                    with connection.cursor() as cursor: cursor.execute('SET TRANSACTION READ ONLY')
                match=resolve(paths[0])
                with patch.object(native_office,'_auth',return_value=(object(),None)), patch.object(native_office,'_is_admin',return_value=True):
                    response=match.func(RequestFactory().get(paths[0]),**match.kwargs)
                print('MISSING_LINK_STATUS',response.status_code)
                if response.status_code==200:
                    import json
                    print('MISSING_LINK_NULL',json.loads(response.content).get('customer_id') is None)
                transaction.set_rollback(True)
            PY
            for route in staff/office/patient-account/0/ staff/office/invoices/0/ admin/customers/0/; do
              curl -sS -o /dev/null -w "PUBLIC_ROUTE $route %{http_code}\n" --max-time 15 "https://app.a-esthetic.de/api/mobile/$route"
            done
            # Aggregate only status and route category: never print IDs, IPs,
            # timestamps tied to patients, headers, or complete log lines.
            python3 - <<'PY'
            from collections import Counter
            from glob import glob
            import re, subprocess
            result=Counter()
            pattern=re.compile(r'/(?:api/mobile/)(staff/office/(?:patient-account|invoices)|admin/customers|staff/book/patient)/\d+/[^\s\"]*\s+HTTP/[^\"]+\"\s+(\d{3})')
            for path in glob('/var/log/nginx/*access*.log'):
                try:
                    with open(path,'rb') as stream:
                        stream.seek(max(0,__import__('os').fstat(stream.fileno()).st_size-2_000_000))
                        for line in stream:
                            match=pattern.search(line.decode(errors='replace'))
                            if match: result[match.groups()]+=1
                except OSError: pass
            for (route,status),count in sorted(result.items()): print('AGGREGATE',route,status,count)
            PY
