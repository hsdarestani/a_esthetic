name: Inspect production routing and SimplyBook readiness (read only)
on:
  push:
    branches: ['release/integration-qa-20261124']
    paths: ['.github/workflows/release-live-routing-readonly-20261124.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -uo pipefail
            echo 'ESTHETIC_ROUTE_DETAILS'
            for f in a-esthetic-app.conf a-esthetic-office.conf aesthetic-book.conf a-esthetic-connected.conf; do
              echo "FILE $f"
              awk '/server_name|^[[:space:]]*location[[:space:]]|^[[:space:]]*proxy_pass[[:space:]]|^[[:space:]]*root[[:space:]]|^[[:space:]]*alias[[:space:]]/{print}' "/etc/nginx/sites-enabled/$f"
            done
            echo 'PERSISTENT_DATA_PATHS'
            for d in /opt/a-esthetic-mobile /opt/a-esthetic-mobile/releases/patient-labels-32a02a2ca4884a1b648e8b97f5ce61ea42c82ee2 /opt/aesthetic-book/app; do
              echo "PERSISTENT_ROOT $d"
              for name in db.sqlite3 private_media media staticfiles; do
                if test -e "$d/$name"; then echo "PATH $name $(readlink -f "$d/$name")"; fi
              done
              for f in "$d/production_native_settings.py" "$d/production_settings.py"; do
                if test -f "$f"; then grep -E '^DATABASES|^MEDIA_ROOT|^STATIC_ROOT|^PATIENT_FILES_ROOT|^from config.settings import' "$f" || true; fi
              done
            done
            systemctl show aesthetic-native-patients-32a02a2ca4.service -p EnvironmentFiles --no-pager
            echo 'IMPORT_ENTRYPOINT_PATHS'
            systemctl show aesthetic-simplybook-sync.service -p ExecStart --value | grep -oE '/(opt|etc|usr/local)/(aesthetic[^ ;{}"]*|[A-Za-z0-9._/-]*simplybook[A-Za-z0-9._/-]*)' | sort -u || true
            find /etc -maxdepth 2 -type f -iname '*simplybook*' -printf '%p\n' 2>/dev/null | head -n 20
            echo 'SIMPLYBOOK_IMPORT_UNIT_METADATA'
            systemctl list-unit-files --no-legend | grep -Ei 'simplybook|aesthetic.*sync|aesthetic.*import' || true
            for unit in $(systemctl list-unit-files --no-legend | awk 'tolower($1) ~ /simplybook|aesthetic.*sync|aesthetic.*import/ && $1 ~ /\.service$/ {print $1}'); do
              echo "IMPORT_UNIT $unit"
              systemctl show "$unit" -p EnvironmentFiles -p WorkingDirectory -p User -p ActiveState --no-pager
            done
            for dir in /opt/a-esthetic-mobile /opt/aesthetic-book; do
              echo "DIR $dir"
              stat -c '%a %U:%G %n' "$dir" "$dir/releases" "$dir/venv" 2>/dev/null || true
            done
            for p in 8017 8018 8019 8020 8770 8771 8772 8773 8774; do
              if ss -ltn "( sport = :$p )" | grep -q LISTEN; then echo "PORT_IN_USE $p"; fi
            done
            for unit in $(systemctl list-units --type=service --state=running --no-legend 'aesthetic-*' 'a-esthetic-*' | awk '{print $1}'); do
              echo "UNIT $unit"
              systemctl show "$unit" -p WorkingDirectory -p ActiveState --no-pager
            done
            for dir in /opt/a-esthetic-mobile /opt/aesthetic-book; do
              test -x "$dir/venv/bin/python"
              "$dir/venv/bin/python" -c 'import PIL._imaging, django; print("VENV_OK",django.get_version())' || echo "VENV_CHECK_FAILED $dir"
            done
            python3 - <<'PY'
            from pathlib import Path
            import re
            p=Path('/etc/aesthetic-book.env')
            keys={'SIMPLYBOOK_COMPANY_LOGIN','SIMPLYBOOK_USER_LOGIN','SIMPLYBOOK_API_USER_KEY','SIMPLYBOOK_USER_PASSWORD','SIMPLYBOOK_ADMIN_WRITEBACK_ENABLED','AESTHETIC_MEMBER_API_URL'}
            found={}
            for line in p.read_text().splitlines():
                m=re.match(r'^\s*(?:export\s+)?([A-Z_]+)=(.*)$',line)
                if m and m[1] in keys:
                    found[m[1]]=bool(m[2].strip().strip('"').strip("'"))
            for key in sorted(keys):
                print('CONFIG_PRESENT',key,found.get(key,False))
            print('APP_SQLITE_EXISTS',Path('/opt/a-esthetic-mobile/db.sqlite3').is_file())
            PY
            for u in https://book.a-esthetic.de/api/health/ https://book.a-esthetic.de/api/mobile/staff/catalog/ https://app.a-esthetic.de/api/mobile/staff/session/ https://office.a-esthetic.de/office/; do
              echo "HTTP $u $(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' "$u")"
            done
