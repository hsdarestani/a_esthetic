name: Provision requested Be Different admin on existing server
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bedifferent-admin-create-now.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check password exists and is at least 8 characters
        shell: bash
        env:
          PASSWORD: ${{ secrets.BD_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${#PASSWORD}" -lt 8 ]; then
            echo "Admin secret must have at least eight characters"
            exit 1
          fi
      - name: Create admin using isolated app and secret
        uses: appleboy/ssh-action@v1.2.0
        env:
          BD_ADMIN_PASSWORD: ${{ secrets.BD_ADMIN_PASSWORD }}
          BD_ADMIN_EMAIL: ${{ secrets.BD_ADMIN_EMAIL || 'admin@bedifferent.smarbiz.sbs' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: BD_ADMIN_PASSWORD,BD_ADMIN_EMAIL
          command_timeout: 3m
          script: |
            set -euo pipefail
            APP=/opt/bedifferent-temp/current
            test "$(id -u)" -eq 0
            systemctl is-active --quiet bedifferent-temp
            systemctl is-active --quiet a-esthetic-mobile
            systemctl is-active --quiet aesthetic-book
            test -s "$APP/scripts/provision-admin.mjs"
            test -s /etc/bedifferent-temp.env
            if grep -Fq 'password.length < 20' "$APP/scripts/provision-admin.mjs"; then
              sed -i 's/password.length < 20/password.length < 8/;s/20-128 character password/8-128 character password/g' "$APP/scripts/provision-admin.mjs"
            fi
            grep -Fq 'password.length < 8' "$APP/scripts/provision-admin.mjs"
            set -a
            . /etc/bedifferent-temp.env
            set +a
            runuser -u bedifferenttemp -- env DATABASE_URL="$DATABASE_URL" BD_ADMIN_EMAIL="$BD_ADMIN_EMAIL" BD_ADMIN_PASSWORD="$BD_ADMIN_PASSWORD" "$APP/bin/node" "$APP/scripts/provision-admin.mjs"
            curl -fsS --max-time 10 http://127.0.0.1:3100/api/ready >/dev/null
            echo BEDIFFERENT_ADMIN_STEP_COMPLETE
      - name: Validate production remains healthy
        if: always()
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://bedifferent.smarbiz.sbs/api/ready >/dev/null
          curl -fsS --max-time 15 https://esthetic.smarbiz.sbs/api/mobile/status/ >/dev/null
          curl -fsS --max-time 15 https://book.a-esthetic.de/api/health/ >/dev/null
          echo ALL_SERVICES_HEALTHY
