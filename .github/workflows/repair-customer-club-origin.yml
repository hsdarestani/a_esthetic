name: Repair A+ Esthetic Customer Club origin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-customer-club-origin.yml"

permissions:
  contents: read

concurrency:
  group: a-esthetic-customer-club-origin-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Restore HTTPS origin and inspect active A+ Esthetic vhost
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            OLD="/etc/nginx/sites-available/a-esthetic-web.conf"
            NEW="/etc/nginx/sites-available/a-esthetic-connected.conf"

            command -v nginx >/dev/null
            command -v python3 >/dev/null
            test -f "$OLD"

            # The old vhost owns the TLS/443 origin expected by Cloudflare. Restore it first
            # so the public site is reachable while its web root is migrated safely.
            rm -f /etc/nginx/sites-enabled/a-esthetic-connected.conf
            ln -sfn "$OLD" /etc/nginx/sites-enabled/a-esthetic-web.conf
            nginx -t
            systemctl reload nginx

            echo '===== A_ESTHETIC_OLD_VHOST_BEGIN ====='
            sed -n '1,260p' "$OLD"
            echo '===== A_ESTHETIC_OLD_VHOST_END ====='

            python3 - <<'PY'
            from urllib.error import HTTPError, URLError
            from urllib.request import Request, urlopen

            def status(url):
                req = Request(url, headers={'User-Agent':'A-Esthetic-Origin-Restore/1.0','Cache-Control':'no-cache'})
                try:
                    with urlopen(req, timeout=20) as response:
                        return response.status
                except HTTPError as exc:
                    return exc.code
                except URLError as exc:
                    raise SystemExit(f'Origin restore request failed for {url}: {exc}')

            public = status('https://esthetic.smarbiz.sbs/?origin-restore=1')
            print('Public root status after HTTPS restore:', public)
            if public != 200:
                raise SystemExit(f'Cloudflare HTTPS origin not restored: {public}')

            api = status('https://esthetic.smarbiz.sbs/api/mobile/status/')
            print('Mobile API status after HTTPS restore:', api)
            if api != 200:
                raise SystemExit(f'Mobile API not reachable after HTTPS restore: {api}')
            PY
