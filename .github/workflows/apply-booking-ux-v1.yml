name: Apply booking UX v1

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_booking_ux_v1.py"
      - ".github/workflows/apply-booking-ux-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply booking UX patch
        run: python3 scripts/apply_booking_ux_v1.py

      - name: Validate JavaScript and Python
        run: |
          node --check www/app.js
          node --check www/booking-modern.js
          node --check www/p0-booking-change.js
          node --check www/reference-ui.js
          python3 -m py_compile p0_app/views.py p0_app/appointment_views.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/app.js www/p0-booking-change.js p0_app/views.py p0_app/appointment_views.py .github/workflows/deploy-customer-club-web.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Modernize booking flow and smooth navigation"
            git push origin HEAD:main
          fi
