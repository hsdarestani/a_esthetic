# Credential verification refresh: 2026-09-11-strato
name: Configure A+ Esthetic mobile operations production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-mobile-ops-production.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare push provider secrets bundle
        env:
          FCM_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FCM_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_PRIVATE_KEY_B64: ${{ secrets.APNS_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          : > aesthetic-push-secrets.env

          if [ -n "${FCM_B64:-}" ]; then
            printf 'FIREBASE_SERVICE_ACCOUNT_B64=%s\n' "$FCM_B64" >> aesthetic-push-secrets.env
            echo 'REPOSITORY_FCM_SECRET=present_b64'
          elif [ -n "${FCM_JSON:-}" ]; then
            VALUE="$(printf '%s' "$FCM_JSON" | base64 -w0)"
            printf 'FIREBASE_SERVICE_ACCOUNT_B64=%s\n' "$VALUE" >> aesthetic-push-secrets.env
            echo 'REPOSITORY_FCM_SECRET=present_json'
          else
            echo 'REPOSITORY_FCM_SECRET=missing'
          fi

          if [ -n "${APNS_KEY_ID:-}" ] && [ -n "${APNS_TEAM_ID:-}" ]; then
            if [ -n "${APNS_PRIVATE_KEY_B64:-}" ]; then
              printf 'APNS_KEY_ID=%s\nAPNS_TEAM_ID=%s\nAPNS_PRIVATE_KEY_B64=%s\nAPNS_ENV=production\nAPNS_BUNDLE_ID=de.aplusesthetic.app\n' "$APNS_KEY_ID" "$APNS_TEAM_ID" "$APNS_PRIVATE_KEY_B64" >> aesthetic-push-secrets.env
              echo 'REPOSITORY_APNS_SECRET=present_b64'
            elif [ -n "${APNS_PRIVATE_KEY:-}" ]; then
              VALUE="$(printf '%s' "$APNS_PRIVATE_KEY" | base64 -w0)"
              printf 'APNS_KEY_ID=%s\nAPNS_TEAM_ID=%s\nAPNS_PRIVATE_KEY_B64=%s\nAPNS_ENV=production\nAPNS_BUNDLE_ID=de.aplusesthetic.app\n' "$APNS_KEY_ID" "$APNS_TEAM_ID" "$VALUE" >> aesthetic-push-secrets.env
              echo 'REPOSITORY_APNS_SECRET=present_key'
            else
              echo 'REPOSITORY_APNS_SECRET=missing_private_key'
            fi
          else
            echo 'REPOSITORY_APNS_SECRET=missing'
          fi

      - name: Upload push provider secrets to new STRATO server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "aesthetic-push-secrets.env"
          target: "/tmp"

      - name: Install and verify push provider secrets
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            MOBILE_ENV=/opt/a-esthetic-mobile/mobile.env
            BUNDLE=/tmp/aesthetic-push-secrets.env
            test -s "$MOBILE_ENV"

            if [ -s "$BUNDLE" ]; then
              sed -i '/^FIREBASE_SERVICE_ACCOUNT_JSON=/d;/^FIREBASE_SERVICE_ACCOUNT_B64=/d;/^APNS_KEY_ID=/d;/^APNS_TEAM_ID=/d;/^APNS_PRIVATE_KEY=/d;/^APNS_PRIVATE_KEY_BASE64=/d;/^APNS_PRIVATE_KEY_B64=/d;/^APNS_USE_SANDBOX=/d;/^APNS_ENV=/d;/^APNS_BUNDLE_ID=/d' "$MOBILE_ENV"
              cat "$BUNDLE" >> "$MOBILE_ENV"
              chmod 600 "$MOBILE_ENV"
              systemctl restart a-esthetic-mobile.service
              sleep 2
            fi
            rm -f "$BUNDLE"

            systemctl is-active --quiet a-esthetic-mobile.service
            echo 'MOBILE_API_READY=1'
            if grep -Eq '^(FIREBASE_SERVICE_ACCOUNT_JSON|FIREBASE_SERVICE_ACCOUNT_B64)=' "$MOBILE_ENV"; then
              echo 'ANDROID_PUSH_CREDENTIALS=present'
            else
              echo 'ANDROID_PUSH_CREDENTIALS=missing'
            fi
            if grep -q '^APNS_KEY_ID=' "$MOBILE_ENV" && grep -q '^APNS_TEAM_ID=' "$MOBILE_ENV" && grep -Eq '^(APNS_PRIVATE_KEY|APNS_PRIVATE_KEY_B64)=' "$MOBILE_ENV"; then
              echo 'IOS_PUSH_CREDENTIALS=present'
            else
              echo 'IOS_PUSH_CREDENTIALS=missing'
            fi

            cd /opt/a-esthetic-mobile
            set -a; . "$MOBILE_ENV"; set +a
            /opt/a-esthetic-mobile/venv/bin/python manage.py shell -c "from p0_app.push import push_configuration; import json; print('PUSH_CONFIGURATION='+json.dumps(push_configuration(), sort_keys=True))"
