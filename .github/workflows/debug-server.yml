name: Diagnose A+ Esthetic Server

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Audit new STRATO runtime
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            ROOT=/opt/a-esthetic-mobile
            VENV="$ROOT/venv"
            ENV_FILE="$ROOT/mobile.env"
            test -x "$VENV/bin/python"
            test -s "$ENV_FILE"
            systemctl is-active --quiet a-esthetic-mobile.service
            systemctl is-active --quiet a-esthetic-patient-record-sync.timer
            nginx -t
            cd "$ROOT"
            set -a
            . "$ENV_FILE"
            set +a
            "$VENV/bin/python" manage.py check

            echo '=== provider configuration ==='
            "$VENV/bin/python" manage.py shell -c "from django.conf import settings; from p0_app.push import push_configuration; from p2_app.passes import wallet_provider_status; import json; apps=set(settings.INSTALLED_APPS); assert ('allauth.socialaccount.providers.google' in apps)==settings.GOOGLE_SOCIAL_LOGIN_ENABLED; assert ('allauth.socialaccount.providers.apple' in apps)==settings.APPLE_SOCIAL_LOGIN_ENABLED; print('PUSH_CONFIGURATION='+json.dumps(push_configuration(),sort_keys=True)); print('WALLET_CONFIGURATION='+json.dumps(wallet_provider_status(),sort_keys=True)); print('GOOGLE_LOGIN_CONFIGURED='+str(settings.GOOGLE_SOCIAL_LOGIN_ENABLED)); print('APPLE_LOGIN_CONFIGURED='+str(settings.APPLE_SOCIAL_LOGIN_ENABLED))"
            "$VENV/bin/python" - <<'PY'
            import json, os
            from pathlib import Path
            path_keys=['APPLE_PASS_CERT_PATH','APPLE_PASS_KEY_PATH','APPLE_WWDR_CERT_PATH']
            apple_required=['APPLE_PASS_TYPE_ID','APPLE_TEAM_ID',*path_keys]
            if all((os.environ.get(k) or '').strip() for k in apple_required):
                missing=[k for k in path_keys if not Path(os.environ[k]).is_file()]
                if missing:
                    raise SystemExit('APPLE_WALLET_FILES_MISSING='+','.join(missing))
                print('APPLE_WALLET_FILES=present')
            else:
                print('APPLE_WALLET_FILES=not_configured')
            raw=(os.environ.get('GOOGLE_WALLET_SERVICE_ACCOUNT_JSON') or '').strip()
            issuer=(os.environ.get('GOOGLE_WALLET_ISSUER_ID') or '').strip()
            if raw and issuer:
                info=json.loads(raw)
                if not info.get('client_email') or not info.get('private_key'):
                    raise SystemExit('GOOGLE_WALLET_CONFIG=invalid')
                print('GOOGLE_WALLET_CONFIG=valid')
            else:
                print('GOOGLE_WALLET_CONFIG=not_configured')
            PY

            GOOGLE_LOGIN="$($VENV/bin/python manage.py shell -c "from django.conf import settings; print('1' if settings.GOOGLE_SOCIAL_LOGIN_ENABLED else '0')" | tail -n 1)"
            APPLE_LOGIN="$($VENV/bin/python manage.py shell -c "from django.conf import settings; print('1' if settings.APPLE_SOCIAL_LOGIN_ENABLED else '0')" | tail -n 1)"
            if [ "$GOOGLE_LOGIN" = 0 ]; then
              test "$(curl -sS -o /dev/null -w '%{http_code}' https://esthetic.smarbiz.sbs/accounts/google/login/)" = 404
              echo 'GOOGLE_SOCIAL_LOGIN=hidden'
            fi
            if [ "$APPLE_LOGIN" = 0 ]; then
              test "$(curl -sS -o /dev/null -w '%{http_code}' https://esthetic.smarbiz.sbs/accounts/apple/login/)" = 404
              echo 'APPLE_SOCIAL_LOGIN=hidden'
            fi

            # Audit the actual web bundle customers receive, not the backend checkout.
            curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/ -o /tmp/aplus-index.html
            curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/booking-direct-api.js -o /tmp/aplus-booking-direct-api.js
            curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/core-app.js -o /tmp/aplus-core-app.js
            grep -q "booking-direct-api.js" /tmp/aplus-index.html
            grep -q "BOOKING_API_BASE = 'https://book.a-esthetic.de/api/mobile'" /tmp/aplus-booking-direct-api.js
            if [ -z "${GOOGLE_WALLET_ISSUER_ID:-}" ] || [ -z "${GOOGLE_WALLET_SERVICE_ACCOUNT_JSON:-}" ]; then
              if grep -q 'data-wallet-provider="google"' /tmp/aplus-core-app.js; then
                echo 'Unconfigured Google Wallet control is visible' >&2
                exit 21
              fi
              echo 'GOOGLE_WALLET_UI=hidden'
            fi
            echo 'LIVE_CUSTOMER_WEB_BUNDLE=success'

            echo '=== authenticated visible-feature smoke ==='
            TOKEN="$($VENV/bin/python manage.py shell -c "from django.contrib.auth import get_user_model; from platform_app.mobile_api import _token_for; U=get_user_model(); u=U.objects.filter(is_active=True,is_staff=False,member_account__status='active').order_by('pk').first(); assert u is not None, 'No active customer account for smoke test'; print(_token_for(u))" | tail -n 1)"
            test -n "$TOKEN"

            check_json() {
              URL="$1"
              BODY="$(curl -fsS --max-time 25 -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json' "$URL")"
              printf '%s' "$BODY" | "$VENV/bin/python" -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True, d"
            }

            check_json https://esthetic.smarbiz.sbs/api/mobile/me/
            check_json https://esthetic.smarbiz.sbs/api/mobile/dashboard/
            check_json https://esthetic.smarbiz.sbs/api/mobile/patient-records/
            check_json https://esthetic.smarbiz.sbs/api/mobile/wallet/
            check_json https://esthetic.smarbiz.sbs/api/mobile/reviews/
            check_json https://esthetic.smarbiz.sbs/api/mobile/wallet-pass/
            check_json https://esthetic.smarbiz.sbs/api/mobile/club/
            check_json https://esthetic.smarbiz.sbs/api/mobile/notifications/
            # The shipped JS rewrites booking/slots to this canonical Book service.
            check_json https://book.a-esthetic.de/api/mobile/booking/
            echo 'CUSTOMER_VISIBLE_APIS=success'

            curl -fsS --max-time 25 -H "Authorization: Bearer $TOKEN" https://esthetic.smarbiz.sbs/api/mobile/wallet-pass/qr/ -o /tmp/aplus-member-qr.png
            test -s /tmp/aplus-member-qr.png
            file /tmp/aplus-member-qr.png | grep -qi 'PNG image'
            echo 'MEMBER_QR=success'

            APPLE_WALLET="$($VENV/bin/python manage.py shell -c "from p2_app.passes import wallet_provider_status; print('1' if wallet_provider_status()['apple'] else '0')" | tail -n 1)"
            if [ "$APPLE_WALLET" = 1 ]; then
              curl -fsS --max-time 30 -D /tmp/aplus-apple.headers -H "Authorization: Bearer $TOKEN" https://esthetic.smarbiz.sbs/api/mobile/wallet-pass/apple/ -o /tmp/aplus.pkpass
              test -s /tmp/aplus.pkpass
              grep -qi '^content-type: application/vnd.apple.pkpass' /tmp/aplus-apple.headers
              echo 'APPLE_WALLET_PASS=success'
            fi

            for URL in \
              https://esthetic.smarbiz.sbs/datenschutz/ \
              https://esthetic.smarbiz.sbs/nutzungsbedingungen/ \
              https://esthetic.smarbiz.sbs/impressum/ \
              https://esthetic.smarbiz.sbs/konto-loeschen/; do
              curl -fsSL --max-time 20 -o /dev/null "$URL"
            done
            echo 'LEGAL_LINKS=success'

            # Provider credential verification uses deliberately invalid device tokens,
            # so no real customer device receives a notification.
            "$VENV/bin/python" manage.py shell -c "from p0_app.push import _android_push; import sys; 
            try: _android_push('invalid-audit-token','Audit','Audit',{})
            except Exception as exc:
                msg=str(exc); print('FCM_PROVIDER_RESPONSE='+msg[:120]);
                sys.exit(0 if ('fcm_http_400' in msg or 'fcm_http_404' in msg) else 1)
            else: print('FCM_PROVIDER_RESPONSE=unexpected_success')"
            "$VENV/bin/python" manage.py shell -c "from p0_app.push import _ios_push; import sys; 
            try: _ios_push('0'*64,'Audit','Audit',{})
            except Exception as exc:
                msg=str(exc); print('APNS_PROVIDER_RESPONSE='+msg[:120]);
                sys.exit(0 if ('apns_http_400' in msg or 'apns_http_410' in msg) else 1)
            else: print('APNS_PROVIDER_RESPONSE=unexpected_success')"
            echo 'PUSH_PROVIDER_AUTH=success'

            test -s /etc/aesthetic-patient-sync.token
            "$VENV/bin/python" manage.py sync_patient_records --limit 1000
            echo 'PATIENT_RECORD_SYNC=success'
            curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/api/mobile/status/ | grep -qi 'customer club'
            curl -fsS --max-time 20 https://book.a-esthetic.de/api/health/ | grep -q '"ok"'
            echo 'PUBLIC_ENDPOINTS=success'
            echo 'AESTHETIC_RUNTIME_AUDIT=PASS'
