name: Verify public A+ Esthetic Customer Club web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/verify-public-customer-club-web.yml"

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-latest
    steps:
      - name: Verify focused Book + Wallet release
        run: |
          python3 - <<'PY'
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          release = '20260906-sams-v1'
          domain = 'esthetic.smarbiz.sbs'
          required_markers = (
              f'core-app.js?v={release}',
              f'booking-direct-api.js?v={release}',
              f'booking-book-flow.js?v={release}',
              f'focused-upgrade.js?v={release}',
              f'focused-upgrade.css?v={release}',
          )

          def fetch(url):
              req = Request(url, headers={
                  'User-Agent': 'A-Esthetic-Public-Web-Verify/4.0',
                  'Cache-Control': 'no-cache, no-store',
                  'Pragma': 'no-cache',
              })
              try:
                  with urlopen(req, timeout=25) as response:
                      return response.status, response.read().decode('utf-8', 'replace')
              except HTTPError as exc:
                  return exc.code, exc.read().decode('utf-8', 'replace')
              except URLError as exc:
                  return 0, str(exc)

          status = 0
          html = ''
          for attempt in range(18):
              status, html = fetch(f'https://{domain}/?release={release}&attempt={attempt}')
              if status == 200 and all(marker in html for marker in required_markers):
                  break
              print(f'Waiting for focused web deployment: attempt {attempt + 1}/18, status={status}')
              time.sleep(10)
          else:
              raise SystemExit('Public root did not switch to the focused Book/Wallet release within 180 seconds.')

          assets = (
              'core-app.css', 'core-app.js', 'booking-direct-api.js', 'admin-mode.js',
              'booking-book-flow.css', 'booking-book-flow.js',
              'focused-upgrade.css', 'focused-upgrade.js', 'assets/logo.svg',
          )
          for asset in assets:
              asset_status, body = fetch(f'https://{domain}/{asset}?release={release}')
              print(asset, asset_status, len(body))
              if asset_status != 200 or not body.strip():
                  raise SystemExit(f'Public asset {asset} failed: {asset_status}')

          _, booking_flow = fetch(f'https://{domain}/booking-book-flow.js?release={release}')
          if 'Behandlung wählen' not in booking_flow or 'Freien Termin wählen' not in booking_flow:
              raise SystemExit('Canonical Book-style four-step booking flow is missing.')

          _, focused_upgrade = fetch(f'https://{domain}/focused-upgrade.js?release={release}')
          for marker in ('wallet-pass/qr/', 'wallet-pass/apple/', 'wallet-pass/google/', './assets/logo.svg'):
              if marker not in focused_upgrade:
                  raise SystemExit(f'Focused Wallet/Login runtime is missing marker: {marker}')

          api_status, api_body = fetch(f'https://{domain}/api/mobile/status/')
          if api_status != 200 or 'customer club' not in api_body.lower():
              raise SystemExit(f'Mobile API verification failed: {api_status}')

          print('PUBLIC A+ ESTHETIC FOCUSED BOOK + WALLET RELEASE IS LIVE.')
          PY
