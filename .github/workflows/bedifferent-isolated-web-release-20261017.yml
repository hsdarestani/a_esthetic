name: Release BE DIFFERENT isolated web 20261017

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bedifferent-isolated-web-release-20261017.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bedifferent-esthetic-temp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bedifferent
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: bedifferent_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bedifferent -d bedifferent_build"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://bedifferent:test_only@127.0.0.1:5432/bedifferent_build?schema=public
      NEXT_PUBLIC_APP_URL: https://bedifferent.smarbiz.sbs
      CRON_SECRET: only-for-github-build
      DATA_DIR: /tmp/bedifferent-build
    steps:
      - name: Checkout exact tested BE DIFFERENT source
        uses: actions/checkout@v4
        with:
          repository: hsdarestani/aymantraining
          ref: 8bd0b0884ed89e362d8c6689fb57f39f4a727571
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and build without touching production
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx prisma generate
          npm run check
          npx prisma db push
          npm run build
          test -s .next/standalone/server.js
          test -d .next/static
          grep -Fq 'RhythmHorizon' app/dashboard/page.tsx
          grep -Fq 'NICHT GESCHÄTZT. GEMESSEN.' app/progress/page.tsx
          grep -Fq 'bd-rhythm-stage' app/bd-art-direction.css
          grep -Fq 'DEIN GRIND.' app/progress/page.tsx
          grep -Fq 'DEINE SPUREN.' app/progress/page.tsx
          grep -Fq 'DEIN PLAN.' app/training/page.tsx
          grep -Fq 'bd-train-hero' app/athlete-experience.css
          printf 'BUILT_SOURCE_SHA='
          git rev-parse HEAD

      - name: Package isolated server binary with immutable source marker
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          cp -a .next/standalone/. "$STAGE/"
          mkdir -p "$STAGE/.next" "$STAGE/bin" "$STAGE/data" "$STAGE/node_modules"
          cp -a .next/static "$STAGE/.next/static"
          cp -a public "$STAGE/public"
          cp "$(command -v node)" "$STAGE/bin/node"
          if [ -d node_modules/.prisma ]; then cp -a node_modules/.prisma "$STAGE/node_modules/"; fi
          if [ -d node_modules/@prisma ]; then cp -a node_modules/@prisma "$STAGE/node_modules/"; fi
          if [ -d node_modules/bcryptjs ]; then cp -a node_modules/bcryptjs "$STAGE/node_modules/"; fi
          git rev-parse HEAD > "$STAGE/.source-sha"
          test -s "$STAGE/node_modules/@prisma/client/package.json"
          test -s "$STAGE/server.js"
          tar -C "$STAGE" -czf bd-web-release.tgz .
          test -s bd-web-release.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: bd-web-release
          path: bd-web-release.tgz
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify all three current production services before
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://bedifferent.smarbiz.sbs/api/ready | grep -Fq '"ok":true'
          curl -fsS --max-time 15 https://esthetic.smarbiz.sbs/api/mobile/status/ >/dev/null
          curl -fsS --max-time 15 https://book.a-esthetic.de/api/health/ >/dev/null
          echo ALL_PRECHECKS_OK

      - uses: actions/download-artifact@v4
        with:
          name: bd-web-release

      - name: Transfer to temporary location only
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: bd-web-release.tgz
          target: /tmp

      - name: Switch isolated BE DIFFERENT service with health rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            APP=/opt/bedifferent-temp
            SERVICE=bedifferent-temp
            EXPECTED_SHA=8bd0b0884ed89e362d8c6689fb57f39f4a727571
            RELEASE="$APP/releases/${{ github.run_id }}"
            test "$(id -u)" -eq 0
            test -d /opt/a-esthetic-mobile
            test -d /opt/aesthetic-book
            test -L "$APP/current"
            test -s /etc/bedifferent-temp.env
            test -s /etc/systemd/system/bedifferent-temp.service
            systemctl is-active --quiet nginx
            systemctl is-active --quiet postgresql
            systemctl is-active --quiet a-esthetic-mobile
            systemctl is-active --quiet aesthetic-book
            systemctl is-active --quiet "$SERVICE"
            OLD="$(readlink -f "$APP/current")"
            case "$OLD" in "$APP"/releases/*) : ;; *) echo UNEXPECTED_ACTIVE_RELEASE; exit 1 ;; esac
            test -s "$OLD/server.js"
            test -s /tmp/bd-web-release.tgz
            test ! -e "$RELEASE"
            available_kb="$(awk '/MemAvailable/ {print $2}' /proc/meminfo)"
            test "$available_kb" -ge 1000000 || { echo MEMORY_PRECHECK_FAILED; exit 1; }
            test "$(df -Pk "$APP" | awk 'NR==2 {print $4}')" -ge 1500000 || { echo DISK_PRECHECK_FAILED; exit 1; }
            mkdir -p "$RELEASE"
            tar -xzf /tmp/bd-web-release.tgz -C "$RELEASE"
            test -s "$RELEASE/server.js"
            test -x "$RELEASE/bin/node"
            test -d "$RELEASE/.next/static"
            test "$(cat "$RELEASE/.source-sha")" = "$EXPECTED_SHA"
            test -s "$RELEASE/node_modules/@prisma/client/package.json"
            chown -R root:root "$RELEASE"
            chmod -R go-w "$RELEASE"
            mkdir -p "$RELEASE/.next/cache"
            chown -R bedifferenttemp:bedifferenttemp "$RELEASE/.next/cache"
            echo "OLD_RELEASE=$OLD"
            echo "NEW_RELEASE=$RELEASE"
            # Existing data, env, nginx, PostgreSQL, ports, and other systemd units remain untouched.
            ln -sfn "$RELEASE" "$APP/current.next"
            mv -Tf "$APP/current.next" "$APP/current"
            if ! systemctl restart "$SERVICE"; then
              echo SERVICE_RESTART_FAILED
              ln -sfn "$OLD" "$APP/current.next"
              mv -Tf "$APP/current.next" "$APP/current"
              systemctl restart "$SERVICE" || true
              exit 1
            fi
            ready=0
            for i in $(seq 1 35); do
              if curl -fsS --max-time 4 http://127.0.0.1:3100/api/ready 2>/dev/null | grep -Fq '"ok":true'; then ready=1; break; fi
              sleep 2
            done
            if [ "$ready" -ne 1 ] || ! curl -fsS --max-time 5 http://127.0.0.1:3100/api/health >/dev/null; then
              echo RELEASE_HEALTH_FAILED_ROLLING_BACK
              ln -sfn "$OLD" "$APP/current.next"
              mv -Tf "$APP/current.next" "$APP/current"
              systemctl restart "$SERVICE" || true
              exit 1
            fi
            if ! systemctl is-active --quiet a-esthetic-mobile || ! systemctl is-active --quiet aesthetic-book; then
              echo OTHER_SERVICE_HEALTH_FAILED_ROLLING_BACK
              ln -sfn "$OLD" "$APP/current.next"
              mv -Tf "$APP/current.next" "$APP/current"
              systemctl restart "$SERVICE" || true
              exit 1
            fi
            test "$(cat "$APP/current/.source-sha")" = "$EXPECTED_SHA"
            rm -f /tmp/bd-web-release.tgz
            echo "BEDIFFERENT_NEW_SOURCE_SHA=$EXPECTED_SHA"
            echo BE_DIFFERENT_ISOLATED_RELEASE=OK

      - name: Verify all public production services after
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://bedifferent.smarbiz.sbs/api/ready | grep -Fq '"ok":true'
          curl -fsS --max-time 15 https://esthetic.smarbiz.sbs/api/mobile/status/ >/dev/null
          curl -fsS --max-time 15 https://book.a-esthetic.de/api/health/ >/dev/null
          echo ALL_POSTCHECKS_OK
