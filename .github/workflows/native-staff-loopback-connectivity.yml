name: Diagnose Book-to-App internal connection (read-only)
on:
  push:
    branches: [feature/mobile-unified-overhaul]
    paths: [.github/workflows/native-staff-loopback-connectivity.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare external HTTPS and local loopback from the Book worker account
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            runuser -u aestheticbook -- python3 - <<'PY'
            import urllib.request,urllib.error,ssl,socket
            paths=[
              ('public_https','https://app.a-esthetic.de/api/mobile/staff/session/',{}),
              ('local_active','http://127.0.0.1:8772/api/mobile/staff/session/',{'Host':'app.a-esthetic.de'}),
              ('local_previous','http://127.0.0.1:8771/api/mobile/staff/session/',{'Host':'app.a-esthetic.de'}),
            ]
            for label,url,headers in paths:
              request=urllib.request.Request(url,headers=headers|{'Authorization':'Bearer deliberately-invalid-check-only'})
              try:
                with urllib.request.build_opener(urllib.request.ProxyHandler({})).open(request,timeout=4) as r:
                  print(label,'HTTP',r.status)
              except urllib.error.HTTPError as e: print(label,'HTTP',e.code)
              except Exception as e: print(label,'ERROR',type(e).__name__,type(getattr(e,'reason',None)).__name__)
            PY
            echo 'Book worker network diagnostics completed without printing private data'
