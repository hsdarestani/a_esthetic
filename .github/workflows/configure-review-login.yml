name: Verify A+ Esthetic Store review login

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-review-login.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify review-only demo account on production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          script: |
            set -euo pipefail
            MOBILE=/opt/a-esthetic-mobile
            test -d "$MOBILE"
            set -a
            . "$MOBILE/mobile.env"
            set +a
            export PYTHONPATH="$MOBILE/vendor"
            REVIEW_USER='demo@a-esthetic.de'
            REVIEW_PASS="${DEMO_PASSWORD:-Aplus-Demo-2026!}"
            cd "$MOBILE"
            REVIEW_USER="$REVIEW_USER" REVIEW_PASS="$REVIEW_PASS" python3 manage.py shell -c \
              "import os; from django.contrib.auth import authenticate; u=authenticate(username=os.environ['REVIEW_USER'],password=os.environ['REVIEW_PASS']); assert u is not None and u.is_active; print('review_demo_auth=yes')"
            echo 'Review demo account is ready.'
