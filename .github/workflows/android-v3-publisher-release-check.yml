name: A+ Esthetic Android V3 Publisher AAB build check (unsigned QA)
on:
  push:
    branches: [feature/simplybook-v3-android-20261123]
    paths:
      - .github/workflows/android-v3-publisher-release-check.yml
      - scripts/build-android.sh
      - scripts/install_native_staff.py
      - native/staff/android/**
      - www/mobile/**
  workflow_dispatch:
permissions: {contents: read}
jobs:
  release-path:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build from the real A+ Publisher entrypoint
        env:
          APP_VERSION_NAME: '1.0.43'
          APP_BUILD_NUMBER: '49'
          REQUIRE_ANDROID_SIGNING: '0'
        run: |
          set -euo pipefail
          bash scripts/build-android.sh > "$RUNNER_TEMP/v3-publisher-build.log" 2>&1 || {
            tail -140 "$RUNNER_TEMP/v3-publisher-build.log"
            exit 1
          }
          test -s artifacts/a-esthetic-release.aab
          grep -q 'NativeStaff and V3 SimplyBook calendar registered' "$RUNNER_TEMP/v3-publisher-build.log"
          grep -q 'BUILD SUCCESSFUL' "$RUNNER_TEMP/v3-publisher-build.log"
          grep -R -q 'registerPlugin(NativeStaffPlugin.class);' android/app/src/main/java
          test "$(find android/app/src/main/java -name 'NativeStaffV3Calendar.java'|wc -l)" -eq 1
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('artifacts/a-esthetic-release.aab') as bundle:
              assert bundle.testzip() is None
              assert any(n.endswith('dex/classes.dex') for n in bundle.namelist())
          print('PASS Publisher release path, Android V3 native plugin registration and AAB integrity')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: APlus-Esthetic-V3-Android-Unsigned-AAB-QA-ONLY
          path: artifacts/a-esthetic-release.aab
          retention-days: 7
          if-no-files-found: error
