name: Verify A+ Esthetic iOS social login return

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/configure_native_camera_permissions.py
      - scripts/build-ios.sh
      - scripts/test_ios_social_deeplink.py
      - platform_app/account_onboarding.py
      - www/account-onboarding.js
      - .github/workflows/ios-social-login-native-build.yml
  push:
    branches: [main]
    paths:
      - scripts/configure_native_camera_permissions.py
      - scripts/build-ios.sh
      - scripts/test_ios_social_deeplink.py
      - platform_app/account_onboarding.py
      - www/account-onboarding.js
      - .github/workflows/ios-social-login-native-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Verify built iOS app accepts OAuth callback
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate app and assert callback registration
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          python3 scripts/configure_native_camera_permissions.py
          python3 scripts/test_ios_social_deeplink.py
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          with Path('ios/App/App/Info.plist').open('rb') as f:
              data = plistlib.load(f)
          schemes = [s for row in data.get('CFBundleURLTypes', [])
                     for s in row.get('CFBundleURLSchemes', [])]
          assert 'de.aplusesthetic.app' in schemes, schemes
          print('Verified iOS will open de.aplusesthetic.app://social-login')
          PY
      - name: Compile iOS simulator and verify installed app bundle
        run: |
          set -euo pipefail
          if [[ -d ios/App/App.xcworkspace ]]; then
            CONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            CONTAINER=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${CONTAINER[@]}" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/esthetic-ios-social" \
            CODE_SIGNING_ALLOWED=NO TARGETED_DEVICE_FAMILY=1 build
          APP="$RUNNER_TEMP/esthetic-ios-social/Build/Products/Debug-iphonesimulator/App.app"
          test -s "$APP/Info.plist"
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib,sys
          with open(sys.argv[1], 'rb') as f: info=plistlib.load(f)
          schemes = [s for row in info.get('CFBundleURLTypes',[])
                     for s in row.get('CFBundleURLSchemes',[])]
          assert 'de.aplusesthetic.app' in schemes, schemes
          print('Compiled app contains iOS social OAuth return URL scheme.')
          PY
          mkdir -p artifacts
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" artifacts/a-esthetic-ios-social-login-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: a-esthetic-ios-social-login-simulator
          path: artifacts/a-esthetic-ios-social-login-simulator.zip
          if-no-files-found: error

  ios-store-build:
    name: Signed iOS 1.0.38 (44) candidate
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build IPA with available Apple signing credentials
        env:
          APP_VERSION_NAME: '1.0.38'
          APP_BUILD_NUMBER: '44'
          APPLE_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_AUTH_KEY_B64: ${{ secrets.APPSTORE_AUTH_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_TEAM_ID" || -z "$APPLE_KEY_ID" || -z "$APPLE_ISSUER_ID" || -z "$APPLE_AUTH_KEY_B64" ]]; then
            echo 'Apple signing credentials unavailable; no signed IPA was produced.'
            exit 0
          fi
          npm install --no-audit --no-fund
          printf '%s' "$APPLE_AUTH_KEY_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          bash scripts/build-ios.sh
          test -s artifacts/a-esthetic.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: a-esthetic-ios-1.0.38-build-44
          path: artifacts/a-esthetic.ipa
          if-no-files-found: warn
