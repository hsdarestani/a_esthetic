name: Read-only Ayman account and media recovery audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bedifferent-ayman-recovery-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit only metadata without disclosing private media or credentials
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -euo pipefail
            systemctl is-active --quiet bedifferent-temp
            systemctl is-active --quiet a-esthetic-mobile
            systemctl is-active --quiet aesthetic-book
            echo '=== NEW_DATABASE ==='
            runuser -u postgres -- psql -XAt -d bedifferent_temp <<'SQL'
            SELECT 'USER_COUNT='||count(*) FROM "User";
            SELECT 'MATCHING_AYMAN_ACCOUNTS='||count(*) FROM "User" WHERE "name" ILIKE '%ayman%' OR "name" ILIKE '%lhadaf%';
            SELECT 'MATCHING_AYMAN_MEDIA_RECORDS='||count(*) FROM "MediaAsset" WHERE "relatedUserId" IN (SELECT "id" FROM "User" WHERE "name" ILIKE '%ayman%' OR "name" ILIKE '%lhadaf%');
            SELECT 'ALL_PRIVATE_MEDIA_RECORDS='||count(*) FROM "MediaAsset" WHERE "kind"='PROGRESS_PHOTO';
            SQL
            echo '=== FILE_COUNTS_ONLY ==='
            for root in /opt/bedifferent-temp/data/uploads /opt/bedifferent/backups /opt/bedifferent-temp/backups /root/bedifferent /opt/bedifferent; do
              if [ -d "$root" ]; then
                printf "PRESENT_%s=YES\n" "$root"
                printf "FILES_%s=" "$root"
                find "$root" -maxdepth 4 -type f 2>/dev/null | wc -l
              else
                printf "PRESENT_%s=NO\n" "$root"
              fi
            done
            echo '=== HEALTH ==='
            curl -fsS --max-time 8 http://127.0.0.1:3100/api/ready >/dev/null
            curl -fsS --max-time 8 http://127.0.0.1:8017/api/health/ >/dev/null
            curl -fsS --max-time 8 http://127.0.0.1:8770/api/mobile/status/ >/dev/null
            echo ALL_LOCAL_SERVICES_HEALTHY=YES

      - name: Verify external services unaffected
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://bedifferent.smarbiz.sbs/api/ready > /dev/null
          curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/api/mobile/status/ > /dev/null
          curl -fsS --max-time 20 https://book.a-esthetic.de/api/health/ > /dev/null
          echo EXTERNAL_SERVICES_OK
