name: Reconcile release candidate and run tests (isolated; no deployment)
on:
  push:
    branches: ['release/integration-qa-20261124']
    paths: ['.github/workflows/release-integration-candidate-20261124.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DJANGO_DEBUG: '1'
      PATIENT_SYNC_TOKEN: synthetic-testing-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile the pinned source with current web release
        run: |
          set -euo pipefail
          git config user.name 'Integration QA'
          git config user.email 'integration-qa@users.noreply.github.com'
          git merge --no-commit --no-ff 97902e66e0a8ed33ef3edf8356083580551aef9a || true
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          config = json.loads("{\"whole\":[\"platform_app/public_intake.py\",\"templates/office/general_intake.html\"],\"hunks\":{\"platform_app/models.py\":[0,1],\"platform_app/office_views.py\":[0,0],\"platform_app/test_office_invoicing.py\":[0,0]},\"edits\":[[\"platform_app/migrations/0006_native_office_identity_and_visit.py\",\"('platform_app', '0005_goae_draft')\",\"('platform_app', '0006_public_intake_forms')\"],[\"platform_app/migrations/0006_native_office_identity_and_visit.py\",\"        migrations.AddField(model_name='userprofile', name='date_of_birth',\\n                            field=models.DateField(blank=True, null=True)),\\n\",\"\"],[\"platform_app/migrations/0007_office_intake_review.py\",\"        migrations.CreateModel(name='OfficeIntakeLock', fields=[('id', models.BigAutoField(auto_created=True, primary_key=True, serialize=False, verbose_name='ID'))]),\\n\",\"\"]],\"noops\":[\"platform_app/migrations/0009_public_intake_forms.py\"]}")
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          expected = set(config['whole']) | set(config['hunks'])
          assert set(conflicts)==expected, (conflicts,expected)
          for filename in config['whole']:
              subprocess.run(['git','checkout','--ours','--',filename],check=True)
          for filename, selections in config['hunks'].items():
              p=Path(filename); data=p.read_text()
              pattern=re.compile(r'^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]+\n',re.M|re.S)
              assert len(list(pattern.finditer(data)))==len(selections), filename
              choices=iter(selections)
              p.write_text(pattern.sub(lambda m:m.group(1+next(choices)),data))
          for filename, before, after in config['edits']:
              p=Path(filename); data=p.read_text(); assert data.count(before)==1,filename; p.write_text(data.replace(before,after))
          for filename in config['noops']:
              p=Path(filename); data=p.read_text(); assert data.count('    operations = [')==1,filename
              p.write_text(data.split('    operations = [')[0]+'    # Equivalent schema already provided by the deployed web intake migration.\n    operations = []\n')
          # A signed ambiguous public submission remains private and must also be
          # available to the native admin identity-review workflow.
          p=Path('platform_app/public_intake.py')
          data=p.read_text()
          old="        user,_=_match_or_create(identity)\n"
          new="        user,match_status=_match_or_create(identity)\n        if user is None and match_status == 'review':\n            from .intake_identity import queue_review\n            queue_review(identity)\n"
          assert data.count(old)==1
          p.write_text(data.replace(old,new))
          subprocess.run(['git','add','-A'],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True)
          print('CANDIDATE_CONFLICTS_RESOLVED')
          PY
          mkdir -p /tmp/release-candidate
          git diff --cached --binary HEAD > /tmp/release-candidate/reconciled.patch
          git diff --cached --stat HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check candidate migration state and Django configuration
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check
      - name: Run focused regression on synthetic database
        run: python manage.py test platform_app.test_office_invoicing platform_app.test_goae_draft p0_app.test_mobile_staff_workspace p0_app.test_native_office --verbosity 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciled-candidate-patch
          path: /tmp/release-candidate/

  ios-appetize:
    needs: candidate
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reconciled-candidate-patch
          path: /tmp/release-candidate
      - name: Apply the exact regression-tested candidate
        run: git apply --index /tmp/release-candidate/reconciled.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate native app
        run: |
          set -euo pipefail
          npm pkg delete scripts.capacitor:sync:after
          npm install --no-audit --no-fund
          npx cap add ios
          python3 scripts/configure_native_camera_permissions.py
          python3 scripts/install_native_staff.py
          node scripts/test_native_staff_controller.mjs
          node scripts/test_native_calendar_layout.mjs
      - name: Compile unsigned iOS Simulator app
        run: |
          set -euo pipefail
          if [[ -d ios/App/App.xcworkspace ]]; then
            app=(-workspace ios/App/App.xcworkspace)
          else
            app=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${app[@]}" -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/esthetic-integrated" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/ios.log"; exit 1; }
      - name: Package Appetize simulator build
        run: |
          mkdir -p artifacts
          app="$RUNNER_TEMP/esthetic-integrated/Build/Products/Debug-iphonesimulator/App.app"
          test -s "$app/App"
          ditto -c -k --keepParent "$app" artifacts/APlus-Esthetic-Integrated-20261124-Appetize-iOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: APlus-Esthetic-Integrated-20261124-Appetize-iOS
          path: artifacts/APlus-Esthetic-Integrated-20261124-Appetize-iOS.zip
          if-no-files-found: error
          retention-days: 14
