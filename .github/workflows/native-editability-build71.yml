name: Build 71 native editability QA artifacts (no store upload)
on:
  push:
    branches: [qa/native-editability-build71]
    paths: ['.github/workflows/native-editability-build71.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check www/mobile/native-workspace.mjs
          node scripts/test_native_staff_controller.mjs
          node scripts/test_native_calendar_layout.mjs
          node --test scripts/test-mobile-lifecycle.js scripts/test-android-system-back.js
  ios:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Appetize simulator Build 71 only
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm pkg delete scripts.capacitor:sync:after
          npx cap add ios
          python3 scripts/configure_native_camera_permissions.py
          python3 scripts/install_native_staff.py
          if [[ -d ios/App/App.xcworkspace ]]; then app=(-workspace ios/App/App.xcworkspace); else app=(-project ios/App/App.xcodeproj); fi
          xcodebuild -quiet "${app[@]}" -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/aesthetic-ios" ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO ENABLE_DEBUG_DYLIB=NO IPHONEOS_DEPLOYMENT_TARGET=16.0 MARKETING_VERSION=1.0.64 CURRENT_PROJECT_VERSION=71 build
          mkdir -p artifacts
          app_path="$RUNNER_TEMP/aesthetic-ios/Build/Products/Debug-iphonesimulator/App.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app_path/Info.plist")" = 71
          cmp www/mobile/native-workspace.mjs "$app_path/public/mobile/native-workspace.mjs"
          /usr/bin/ditto -c -k --keepParent "$app_path" artifacts/a-esthetic-ios-simulator-b71.zip
      - uses: actions/upload-artifact@v4
        with:
          name: a-esthetic-ios-1.0.64-build71-QA
          path: artifacts/a-esthetic-ios-simulator-b71.zip
          if-no-files-found: error
  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_VERSION_NAME: '1.0.64'
      APP_BUILD_NUMBER: '71'
      REQUIRE_ANDROID_SIGNING: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Appetize debug APK only
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          bash scripts/build-android.sh
          cmp www/mobile/native-workspace.mjs android/app/src/main/assets/public/mobile/native-workspace.mjs
          (cd android && ./gradlew assembleDebug --no-daemon)
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/a-esthetic-b71-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: a-esthetic-android-1.0.64-build71-QA
          path: artifacts/a-esthetic-b71-debug.apk
          if-no-files-found: error
