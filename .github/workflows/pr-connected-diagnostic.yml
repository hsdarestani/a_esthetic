name: Diagnose A+ Esthetic TLS and API

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Inspect TLS, origin and API
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          envs: GH_TOKEN,GH_REPO
          command_timeout: 10m
          script: |
            set +e
            OUT=/tmp/aesthetic-tls-diagnostic.txt
            : > "$OUT"
            {
              echo "timestamp=$(date -u +%FT%TZ)"
              echo "api_active=$(systemctl is-active a-esthetic-api 2>/dev/null)"
              echo "nginx_active=$(systemctl is-active nginx 2>/dev/null)"
              echo "nginx_test=$(nginx -t 2>&1 | tr '\n' ' ' | head -c 500)"
              echo "listen_ports_start"
              ss -ltnp | grep -E ':(80|443|8765)[[:space:]]' || true
              echo "listen_ports_end"
              echo "cert_fullchain=$(test -s /etc/letsencrypt/live/esthetic.smarbiz.sbs/fullchain.pem && echo yes || echo no)"
              echo "cert_privkey=$(test -s /etc/letsencrypt/live/esthetic.smarbiz.sbs/privkey.pem && echo yes || echo no)"
              echo "certbot_start"
              certbot certificates 2>&1 | head -60
              echo "certbot_end"
              echo "nginx_config_start"
              nginx -T 2>&1 | grep -A45 -B4 'server_name esthetic.smarbiz.sbs' | head -120
              echo "nginx_config_end"
              echo "local_api_http=$(curl -sS -o /tmp/d1 -w '%{http_code}' --max-time 8 http://127.0.0.1:8765/api/health) body=$(tr -d '\n' < /tmp/d1 2>/dev/null | head -c 200)"
              echo "origin_http=$(curl -sS -o /tmp/d2 -w '%{http_code}' --max-time 8 -H 'Host: esthetic.smarbiz.sbs' http://127.0.0.1/api/health) body=$(tr -d '\n' < /tmp/d2 2>/dev/null | head -c 200)"
              echo "origin_https=$(curl -k -sS -o /tmp/d3 -w '%{http_code}' --max-time 8 --resolve esthetic.smarbiz.sbs:443:127.0.0.1 https://esthetic.smarbiz.sbs/api/health) body=$(tr -d '\n' < /tmp/d3 2>/dev/null | head -c 200)"
              echo "public_https=$(curl -sS -o /tmp/d4 -w '%{http_code}' --max-time 15 https://esthetic.smarbiz.sbs/api/health) body=$(tr -d '\n' < /tmp/d4 2>/dev/null | head -c 200)"
              echo "letsencrypt_log_start"
              tail -80 /var/log/letsencrypt/letsencrypt.log 2>/dev/null | sed -E 's/(token|password|secret)[^ ]*/[REDACTED]/Ig'
              echo "letsencrypt_log_end"
            } >> "$OUT" 2>&1

            python3 - "$OUT" <<'PY'
            import base64, json, os, sys, urllib.error, urllib.request
            path=sys.argv[1]; token=os.environ['GH_TOKEN']; repo=os.environ['GH_REPO']
            api=f'https://api.github.com/repos/{repo}/contents/.deploy/tls-diagnostic.txt'
            headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
            sha=None
            try:
                with urllib.request.urlopen(urllib.request.Request(api,headers=headers)) as response: sha=json.load(response).get('sha')
            except urllib.error.HTTPError as exc:
                if exc.code != 404: raise
            content=open(path,'rb').read()
            payload={'message':'record TLS and origin diagnostic','content':base64.b64encode(content).decode(),'branch':'main'}
            if sha: payload['sha']=sha
            request=urllib.request.Request(api,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
            with urllib.request.urlopen(request) as response: json.load(response)
            PY
