name: Verify gender-specific homepage hero images
on:
  pull_request:
    paths:
      - 'p0_app/**'
      - 'www/core-app.js'
      - '.github/workflows/verify-home-hero.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend requirements
        run: pip install -r requirements.txt
      - name: Validate migrations and hero API
        env:
          DJANGO_DEBUG: '1'
        run: |
          python -m compileall -q p0_app
          python manage.py check
          python manage.py makemigrations p0_app --check --dry-run
          python manage.py test p0_app.test_hero_images --verbosity 2
          node --check www/core-app.js
