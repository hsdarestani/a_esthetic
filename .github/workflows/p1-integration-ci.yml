name: Verify A+ Esthetic P1 experience integration

on:
  pull_request:
    branches: [main]
    paths:
      - "platform_app/**"
      - "p0_app/**"
      - "p1_app/**"
      - "config/**"
      - "www/**"
      - "requirements.txt"
      - ".github/workflows/p1-integration-ci.yml"
      - ".github/workflows/deploy-mobile-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and Django system check
        env:
          DJANGO_DEBUG: "1"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: |
          python -m compileall -q config platform_app p0_app p1_app
          python manage.py check
          python manage.py makemigrations --check --dry-run
          for file in \
            www/account-onboarding.js \
            www/booking-direct-api.js \
            www/admin-mode.js \
            www/core-app.js \
            www/booking-consent-bridge.js \
            www/booking-book-flow.js \
            www/focused-upgrade.js \
            www/native-push.js \
            www/native-interactions.js \
            www/mobile-polish.js \
            www/customer-luxury.js; do
            node --check "$file"
          done

      - name: Apply migrations on clean SQLite
        env:
          DJANGO_DEBUG: "1"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DATABASE_URL: "sqlite:///ci-p1.sqlite3"
        run: |
          rm -f ci-p1.sqlite3
          python manage.py migrate --noinput
          python manage.py seed_platform
          python manage.py seed_p1

      - name: Run P0 and P1 regression tests
        env:
          DJANGO_DEBUG: "1"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: python manage.py test p0_app p1_app --verbosity 2

      - name: Verify Store positioning
        run: python scripts/store_positioning_check.py

  native-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Android release verification bundle
        env:
          REQUIRE_ANDROID_SIGNING: "0"
        run: bash scripts/build-android.sh

      - name: Verify P1 web assets are packaged in Android
        run: |
          for file in \
            account-onboarding.js \
            booking-direct-api.js \
            admin-mode.js \
            core-app.js \
            booking-consent-bridge.js \
            booking-book-flow.js \
            focused-upgrade.js \
            native-push.js \
            native-interactions.js \
            mobile-polish.js \
            customer-luxury.js; do
            test -f "android/app/src/main/assets/public/$file"
          done
          grep -q 'core-app.js' android/app/src/main/assets/public/index.html
          grep -q 'account-onboarding.js' android/app/src/main/assets/public/index.html
          ! grep -q '<script src="./p0.js' android/app/src/main/assets/public/index.html
          ! grep -q '<script src="./p1.js' android/app/src/main/assets/public/index.html
          ! grep -q '<script src="./p2.js' android/app/src/main/assets/public/index.html
          ! grep -q '<script src="./p3.js' android/app/src/main/assets/public/index.html
          test -s artifacts/a-esthetic-release.aab

      - name: Upload verification AAB
        uses: actions/upload-artifact@v4
        with:
          name: a-esthetic-p1-android-release-aab
          path: artifacts/a-esthetic-release.aab
          if-no-files-found: error
