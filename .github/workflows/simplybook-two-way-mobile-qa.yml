name: A+ Esthetic SimplyBook bidirectional native build QA (no store submission)
on:
  push:
    branches: [feature/simplybook-bidirectional-safe-writeback-20261123]
    paths:
      - 'www/mobile/native-workspace.mjs'
      - 'scripts/test_native_staff_controller.mjs'
      - '.github/workflows/simplybook-two-way-mobile-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check www/mobile/native-workspace.mjs
          node scripts/test_native_staff_controller.mjs
          node scripts/test_native_calendar_layout.mjs
  native:
    needs: node
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: android
          - os: macos-latest
            platform: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Build native wrappers with guarded source edits
        run: |
          set -euo pipefail
          npm pkg delete scripts.capacitor:sync:after
          npm install --no-audit --no-fund
          npx cap add ${{ matrix.platform }}
          python3 scripts/configure_native_camera_permissions.py
          python3 scripts/install_native_staff.py
          node scripts/test_native_staff_controller.mjs
      - name: Compile unsigned Android test APK
        if: matrix.platform == 'android'
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Compile unsigned iOS simulator app
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          if [[ -d ios/App/App.xcworkspace ]]; then
            app=(-workspace ios/App/App.xcworkspace)
          else
            app=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${app[@]}" -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/two-way" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios.log" 2>&1 || { tail -n 100 "$RUNNER_TEMP/ios.log"; exit 1; }
      - name: Package iOS simulator for internal QA
        if: matrix.platform == 'ios'
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent "$RUNNER_TEMP/two-way/Build/Products/Debug-iphonesimulator/App.app" artifacts/a-esthetic-two-way-ios-simulator.zip
      - name: Upload unsigned test build (not App Store deliverable)
        uses: actions/upload-artifact@v4
        with:
          name: a-esthetic-two-way-${{ matrix.platform }}-internal-test
          path: |
            artifacts/a-esthetic-two-way-ios-simulator.zip
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
