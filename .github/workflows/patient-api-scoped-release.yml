name: Guarded patient API and native relay release
on:
  push:
    branches: [remediation/goae-draft-session-03]
    paths: ['.github/workflows/patient-api-scoped-release.yml']
permissions:
  contents: read
concurrency:
  group: a-esthetic-mobile-api-production
  cancel-in-progress: false
env:
  PATIENT_BASELINE: 6d85d20edb718ca132eb92e787c94e747a84ebae
  PATIENT_TARGET: 5de94d4b7fa015f3d2e954bb8775f4f42cc80d3e
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PATIENT_TARGET }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify migration graph and patient API integration
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py test p0_app.test_book_billing_bridge p0_app.test_mobile_staff_workspace p0_app.test_native_office platform_app.test_goae_draft platform_app.test_office_invoicing --noinput
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build only the audited server-side delta
        run: |
          set -euo pipefail
          mkdir -p patient-release/files
          git merge-base --is-ancestor "$PATIENT_BASELINE" "$PATIENT_TARGET"
          while IFS=$'\t' read -r status path; do
            case "$status" in A|M) ;; *) exit 1;; esac
            case "$path" in p0_app/*|platform_app/*|templates/office/*) ;; *) exit 1;; esac
            if [ "$status" = M ]; then
              old=$(git show "$PATIENT_BASELINE:$path" | sha256sum | cut -d' ' -f1)
            else
              old=absent
            fi
            mkdir -p "patient-release/files/$(dirname "$path")"
            git show "$PATIENT_TARGET:$path" > "patient-release/files/$path"
            new=$(sha256sum "patient-release/files/$path" | cut -d' ' -f1)
            printf '%s %s %s\n' "$old" "$new" "$path" >> patient-release/manifest
          done < <(git diff --name-status "$PATIENT_BASELINE" "$PATIENT_TARGET" -- p0_app platform_app templates/office)
          test -s patient-release/manifest
          cp scripts/patient_api_scoped_release.sh patient-release/release.sh
          tar -czf "patient-api-${GITHUB_RUN_ID}.tar.gz" -C patient-release .
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: patient-api-${{ github.run_id }}.tar.gz
          target: /tmp
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            bundle=/tmp/patient-api-${{ github.run_id }}.tar.gz
            work=$(mktemp -d)
            trap 'rm -rf -- "$work"; rm -f -- "$bundle"' EXIT
            tar -xzf "$bundle" -C "$work"
            bash "$work/release.sh" "$work" '${{ env.PATIENT_TARGET }}'
