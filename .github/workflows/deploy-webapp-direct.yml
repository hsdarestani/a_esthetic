name: Deploy A+ Esthetic web app direct

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: a-esthetic-direct-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-ci-only-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver,esthetic.smarbiz.sbs
      PRIVATE_FILE_ENCRYPTION_KEYS: ${{ secrets.CI_PRIVATE_FILE_ENCRYPTION_KEY }}
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate release
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          if [ -z "${PRIVATE_FILE_ENCRYPTION_KEYS}" ]; then
            export PRIVATE_FILE_ENCRYPTION_KEYS="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          fi
          python manage.py makemigrations platform_app experience_app --check --dry-run
          python manage.py check
          python manage.py migrate --noinput
          python manage.py seed_platform
          python manage.py seed_complete_features
          python manage.py clean_production_placeholders
          python manage.py test --verbosity 2
          python manage.py smoke_webapp
          python manage.py collectstatic --noinput

      - name: Build release archive
        run: |
          rm -f /tmp/a-esthetic-webapp.tar.gz
          git archive --format=tar.gz --output=/tmp/a-esthetic-webapp.tar.gz HEAD
          tar -tzf /tmp/a-esthetic-webapp.tar.gz >/dev/null

      - name: Upload with direct SCP
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y sshpass >/dev/null
          sshpass -p "$PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 /tmp/a-esthetic-webapp.tar.gz root@"$HOST":/tmp/a-esthetic-webapp.tar.gz

      - name: Activate on production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          RELEASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
        run: |
          SMTP_PASSWORD_B64="$(printf '%s' "$EMAIL_SMTP_PASSWORD" | base64 -w0)"
          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 root@"$HOST" "RELEASE_SHA='$RELEASE_SHA' SMTP_PASSWORD_B64='$SMTP_PASSWORD_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          APP='/opt/aesthetic-platform'
          CURRENT="$APP/current"
          RELEASE="$APP/releases/$RELEASE_SHA"
          ENVFILE='/etc/aesthetic-platform.env'
          test -s "$ENVFILE"
          test -x "$APP/venv/bin/python"

          if [ -n "${SMTP_PASSWORD_B64:-}" ]; then
            SMTP_PASSWORD="$(printf '%s' "$SMTP_PASSWORD_B64" | base64 -d)"
            TMP_ENV="$(mktemp)"
            grep -Ev '^(EMAIL_BACKEND|EMAIL_HOST|EMAIL_PORT|EMAIL_HOST_USER|EMAIL_HOST_PASSWORD|EMAIL_SMTP_PASSWORD|EMAIL_USE_TLS|EMAIL_USE_SSL|EMAIL_TIMEOUT|DEFAULT_FROM_EMAIL|SERVER_EMAIL)=' "$ENVFILE" > "$TMP_ENV" || true
            {
              printf 'EMAIL_BACKEND=%q\n' 'django.core.mail.backends.smtp.EmailBackend'
              printf 'EMAIL_HOST=%q\n' 'smtp.strato.de'
              printf 'EMAIL_PORT=%q\n' '465'
              printf 'EMAIL_HOST_USER=%q\n' 'app@a-esthetic.de'
              printf 'EMAIL_HOST_PASSWORD=%q\n' "$SMTP_PASSWORD"
              printf 'EMAIL_USE_SSL=%q\n' '1'
              printf 'EMAIL_USE_TLS=%q\n' '0'
              printf 'EMAIL_TIMEOUT=%q\n' '20'
              printf 'DEFAULT_FROM_EMAIL=%q\n' 'A+ Esthetic <app@a-esthetic.de>'
              printf 'SERVER_EMAIL=%q\n' 'A+ Esthetic <app@a-esthetic.de>'
            } >> "$TMP_ENV"
            install -o root -g root -m 600 "$TMP_ENV" "$ENVFILE"
            rm -f "$TMP_ENV"
            unset SMTP_PASSWORD
          fi

          rm -rf "$RELEASE"
          mkdir -p "$RELEASE"
          tar -xzf /tmp/a-esthetic-webapp.tar.gz -C "$RELEASE"
          rm -f /tmp/a-esthetic-webapp.tar.gz
          rm -rf "$RELEASE/private_media"
          ln -s "$APP/shared/private_media" "$RELEASE/private_media"

          "$APP/venv/bin/pip" install -r "$RELEASE/requirements.txt" >/dev/null
          set -a
          . "$ENVFILE"
          set +a
          cd "$RELEASE"
          "$APP/venv/bin/python" manage.py migrate --noinput
          "$APP/venv/bin/python" manage.py seed_platform
          "$APP/venv/bin/python" manage.py seed_complete_features
          "$APP/venv/bin/python" manage.py clean_production_placeholders
          "$APP/venv/bin/python" manage.py collectstatic --noinput >/dev/null
          "$APP/venv/bin/python" manage.py check --deploy --fail-level ERROR
          "$APP/venv/bin/python" manage.py smoke_webapp
          test -s "$RELEASE/static/wallet-polish.css"
          test -s "$RELEASE/static/final-polish.css"
          grep -q 'management-hero' "$RELEASE/templates/management_dashboard.html"
          grep -q 'apple-wallet-pass-preview' "$RELEASE/templates/experience/member.html"

          if [ "${EMAIL_BACKEND:-}" = 'django.core.mail.backends.smtp.EmailBackend' ]; then
            "$APP/venv/bin/python" manage.py shell -c "from django.core.mail import get_connection; c=get_connection(); opened=c.open(); assert opened is not False; c.close(); print('STRATO SMTP connection verified')"
          fi

          chown -R aesthetic:aesthetic "$RELEASE" "$APP/shared/private_media"
          chmod -R o-rwx "$APP/shared/private_media"
          ln -sfn "$RELEASE" "$CURRENT"
          test "$(readlink -f "$CURRENT")" = "$RELEASE"
          systemctl restart aesthetic-platform
          systemctl reload nginx

          local_health() {
            curl -fsS --max-time 10 \
              -H 'Host: esthetic.smarbiz.sbs' \
              -H 'X-Forwarded-Proto: https' \
              http://127.0.0.1:8766/health/
          }
          for attempt in $(seq 1 30); do
            if local_health | grep -q '"ok": true'; then break; fi
            sleep 2
          done
          local_health | grep -q '"database": "connected"'
          curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/health/ | grep -q '"ok": true'
          systemctl is-active --quiet aesthetic-platform
          systemctl is-active --quiet nginx
          echo "Activated $RELEASE_SHA"
          REMOTE

      - name: Verify key public routes
        run: |
          curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/health/ | grep -q '"ok": true'
          curl -fsSI --max-time 20 https://esthetic.smarbiz.sbs/ | grep -Eq 'HTTP/.* (200|302)'
          curl -fsSI --max-time 20 https://esthetic.smarbiz.sbs/accounts/login/ | grep -Eq 'HTTP/.* 200'
          curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/static/wallet-polish.css | grep -q 'wallet-overview'
          curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/static/final-polish.css | grep -q 'management-hero'
