name: Verify A+ Esthetic Android wrapper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install native dependencies
        run: npm install

      - name: Verify product positioning
        run: npm run store:check

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew

      - name: Build debug app bundle
        run: |
          cd android
          ./gradlew --no-daemon bundleDebug

      - name: Upload verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: a-esthetic-android-debug-aab
          path: android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
