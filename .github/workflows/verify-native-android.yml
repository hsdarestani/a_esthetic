name: Verify A+ Esthetic Android wrapper

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "www/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/build-android.sh"
      - "scripts/configure_android_signing.py"
      - "scripts/store_positioning_check.py"
      - ".github/workflows/verify-native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build branded Android release bundle
        run: bash scripts/build-android.sh

      - name: Upload verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: a-esthetic-android-release-aab
          path: artifacts/a-esthetic-release.aab
          if-no-files-found: error
