name: Verify A+ Esthetic Android wrapper

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "www/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/build-android.sh"
      - "scripts/configure_android_release.py"
      - "scripts/configure_android_signing.py"
      - "scripts/store_positioning_check.py"
      - ".github/workflows/verify-native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Create ephemeral Publisher-style upload key
        env:
          STORE_PASSWORD: verification-only-password
          KEY_PASSWORD: verification-only-password
          KEY_ALIAS: upload
        run: |
          mkdir -p android
          keytool -genkeypair -noprompt \
            -keystore android/upload-keystore.jks \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 100 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=A Esthetic Verification, OU=CI, O=A Esthetic GmbH, C=DE"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Build signed branded Android release bundle
        env:
          APP_VERSION_NAME: "1.0.0"
          APP_BUILD_NUMBER: "1"
          REQUIRE_ANDROID_SIGNING: "1"
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: verification-only-password
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: verification-only-password
        run: |
          bash scripts/build-android.sh
          jarsigner -verify -verbose -certs artifacts/a-esthetic-release.aab >/tmp/jarsigner.txt
          tail -n 20 /tmp/jarsigner.txt

      - name: Upload verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: a-esthetic-android-release-aab
          path: artifacts/a-esthetic-release.aab
          if-no-files-found: error
