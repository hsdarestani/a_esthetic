name: Finalize connected A+ Esthetic platform

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: a-esthetic-connected-production
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Fix permissions, activate API and verify admin login
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          envs: GH_TOKEN,GH_REPO
          command_timeout: 15m
          script: |
            set -euo pipefail
            DOMAIN="esthetic.smarbiz.sbs"
            APIROOT="/opt/a-esthetic-api"
            WEBROOT="/opt/a-esthetic-web/site"

            test -s "$APIROOT/server.py"
            test -s "$APIROOT/bootstrap_admin.json"
            ADMIN_PASSWORD="$(python3 - <<'PY'
            import json
            with open('/opt/a-esthetic-api/bootstrap_admin.json', encoding='utf-8') as fh:
                print(json.load(fh)['password'])
            PY
            )"

            chown aesthetic:aesthetic "$APIROOT"
            chown aesthetic:aesthetic "$APIROOT/bootstrap_admin.json"
            chown -R aesthetic:aesthetic "$APIROOT/data"
            chmod 0750 "$APIROOT"
            chmod 0600 "$APIROOT/bootstrap_admin.json"
            chmod 0700 "$APIROOT/data"

            systemctl daemon-reload
            systemctl restart a-esthetic-api
            sleep 5
            systemctl is-active --quiet a-esthetic-api
            test ! -e "$APIROOT/bootstrap_admin.json"

            cat > /etc/nginx/sites-available/a-esthetic-web.conf <<'NGINX'
            server {
              listen 80;
              listen [::]:80;
              server_name esthetic.smarbiz.sbs;
              root /opt/a-esthetic-web/site;
              index index.html;
              client_max_body_size 1m;

              location /api/ {
                proxy_pass http://127.0.0.1:8765;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 5s;
                proxy_read_timeout 30s;
              }
              location / { try_files $uri $uri/ /index.html; }
              location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
              add_header X-Content-Type-Options nosniff always;
              add_header X-Frame-Options DENY always;
              add_header Referrer-Policy strict-origin-when-cross-origin always;
              add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
              add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            }
            NGINX
            rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/a-esthetic-connected.conf
            ln -sfn /etc/nginx/sites-available/a-esthetic-web.conf /etc/nginx/sites-enabled/a-esthetic-web.conf
            nginx -t
            systemctl reload nginx

            LOCAL_HEALTH="$(curl -fsS --max-time 15 http://127.0.0.1:8765/api/health)"
            printf '%s' "$LOCAL_HEALTH" | grep -q 'A+ Esthetic API'
            LOGIN="$(curl -fsS --max-time 15 -H 'Content-Type: application/json' -d "{\"username\":\"admin\",\"password\":\"${ADMIN_PASSWORD}\"}" http://127.0.0.1:8765/api/auth/login)"
            printf '%s' "$LOGIN" | grep -q '"ok": true'
            curl -fsS --max-time 25 "https://${DOMAIN}/api/health" | grep -q 'A+ Esthetic API'
            curl -fsS --max-time 25 "https://${DOMAIN}/" | grep -q 'Ihr digitaler Beauty Club'

            cat > /tmp/aesthetic-public.pem <<'PUBKEY'
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAsG9LOU6zBawY/vmOAUZw
            O1GwgS2B9KlNtsLzgU1C+4L4Ya0EI8bzKNt+NKo5BBAC4yKkNRjPNa1JuslXmnbF
            Kxp9vI3coQDed7LMOCsQSKGUDxEwffIc4iYGQbrBL51EA1hNUdwtIJuoOwAGblJJ
            zjZXt/RHCj+lhZRjHhG6XCdsSzqHT6GwJGzQn3ZMviaDPEx3bYOrWBvJslhqfeBL
            aqtnNqAvFi5+xDWL5qGueVRY8jcCXUn+sFEbtBEPr09YIOSZCqjHuqItY+98LjsM
            zAHM51b4S/QQ1qxJ7u+c81BvrCseoMI+05OiU0vwgvg9yO2xCqgKe44GadL4VqoP
            TQIDAQAB
            -----END PUBLIC KEY-----
            PUBKEY
            printf '%s' "$ADMIN_PASSWORD" | openssl pkeyutl -encrypt -pubin -inkey /tmp/aesthetic-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 > /tmp/aesthetic-admin.enc
            base64 -w0 /tmp/aesthetic-admin.enc > /tmp/aesthetic-admin.enc.b64

            python3 - <<'PY'
            import base64, json, os, urllib.error, urllib.request
            token=os.environ['GH_TOKEN']; repo=os.environ['GH_REPO']
            headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
            def put(path, content, message):
                api=f'https://api.github.com/repos/{repo}/contents/{path}'
                sha=None
                try:
                    with urllib.request.urlopen(urllib.request.Request(api,headers=headers)) as response:
                        sha=json.load(response).get('sha')
                except urllib.error.HTTPError as exc:
                    if exc.code != 404: raise
                payload={'message':message,'content':base64.b64encode(content.encode()).decode(),'branch':'main'}
                if sha: payload['sha']=sha
                request=urllib.request.Request(api,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
                with urllib.request.urlopen(request) as response: json.load(response)
            status=json.dumps({'status':'success','api':'connected','database':'sqlite','admin_user':'admin','login_verified':True,'domain':'esthetic.smarbiz.sbs'},indent=2)
            put('.deploy/connected-status.json',status,'record verified connected deployment')
            put('.deploy/admin-credential.enc',open('/tmp/aesthetic-admin.enc.b64').read(),'store encrypted verified admin credential')
            PY

            rm -f /tmp/aesthetic-public.pem /tmp/aesthetic-admin.enc /tmp/aesthetic-admin.enc.b64
