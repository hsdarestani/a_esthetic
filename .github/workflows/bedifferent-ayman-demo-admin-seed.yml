name: Add clearly marked Ayman admin demonstration records
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bedifferent-ayman-demo-admin-seed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify existing services before example data
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/api/mobile/status/ >/dev/null
          curl -fsS --max-time 20 https://book.a-esthetic.de/api/health/ >/dev/null
          curl -fsS --max-time 20 https://bedifferent.smarbiz.sbs/api/ready >/dev/null
      - name: Download demo script from official repository
        uses: actions/checkout@v4
        with:
          repository: hsdarestani/aymantraining
          ref: main
          persist-credentials: false
      - name: Package only isolated admin fixture
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/seed-ayman-admin-demo.mjs
          node --check scripts/seed-ayman-admin-demo.mjs
          tar -czf bd-demo-admin-fixtures.tgz scripts/seed-ayman-admin-demo.mjs
      - name: Copy fixture to server temporary directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: bd-demo-admin-fixtures.tgz
          target: /tmp
      - name: Backup then add isolated non-login DEMO users and examples
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            APP=/opt/bedifferent-temp/current
            test "$(id -u)" -eq 0
            systemctl is-active --quiet bedifferent-temp
            systemctl is-active --quiet a-esthetic-mobile
            systemctl is-active --quiet aesthetic-book
            test -s /tmp/bd-demo-admin-fixtures.tgz
            test -s /etc/bedifferent-temp.env
            systemctl start bedifferent-temp-backup.service
            install -m 644 /dev/null "$APP/scripts/seed-ayman-admin-demo.mjs"
            trap 'rm -f /tmp/bd-demo-admin-fixtures.tgz "$APP/scripts/seed-ayman-admin-demo.mjs"' EXIT
            tar -xOf /tmp/bd-demo-admin-fixtures.tgz scripts/seed-ayman-admin-demo.mjs > "$APP/scripts/seed-ayman-admin-demo.mjs"
            set -a
            . /etc/bedifferent-temp.env
            set +a
            cd "$APP"
            runuser -u bedifferenttemp -- env DATABASE_URL="$DATABASE_URL" "$APP/bin/node" "$APP/scripts/seed-ayman-admin-demo.mjs"
            curl -fsS --max-time 12 http://127.0.0.1:3100/api/ready >/dev/null
            curl -fsS --max-time 12 http://127.0.0.1:8017/api/health/ >/dev/null
            curl -fsS --max-time 12 http://127.0.0.1:8770/api/mobile/status/ >/dev/null
            echo ADMIN_DEMO_SAFE=YES
      - name: Confirm three sites still healthy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/api/mobile/status/ >/dev/null
          curl -fsS --max-time 20 https://book.a-esthetic.de/api/health/ >/dev/null
          curl -fsS --max-time 20 https://bedifferent.smarbiz.sbs/api/ready >/dev/null
          echo ALL_PUBLIC_APPS_OK
