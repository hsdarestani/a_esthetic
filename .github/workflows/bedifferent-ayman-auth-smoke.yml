name: Verify Ayman authenticated demo screens with removable temporary session
# Revalidate admin responsive UI, demo customer details, and uploaded photos.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bedifferent-ayman-auth-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout BE DIFFERENT
        uses: actions/checkout@v4
        with:
          repository: hsdarestani/aymantraining
          ref: main
          persist-credentials: false
      - name: Validate smoke source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/smoke-ayman-auth.mjs
          tar czf bd-ayman-auth-smoke.tgz scripts/smoke-ayman-auth.mjs
      - name: Copy temporary smoke file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: bd-ayman-auth-smoke.tgz
          target: /tmp
      - name: Test real server pages with ephemeral administrator session
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -euo pipefail
            APP=/opt/bedifferent-temp/current
            test -s /tmp/bd-ayman-auth-smoke.tgz
            systemctl is-active --quiet bedifferent-temp
            systemctl is-active --quiet a-esthetic-mobile
            systemctl is-active --quiet aesthetic-book
            install -m 644 /dev/null "$APP/scripts/smoke-ayman-auth.mjs"
            trap 'rm -f /tmp/bd-ayman-auth-smoke.tgz "$APP/scripts/smoke-ayman-auth.mjs"' EXIT
            tar -xOf /tmp/bd-ayman-auth-smoke.tgz scripts/smoke-ayman-auth.mjs > "$APP/scripts/smoke-ayman-auth.mjs"
            set -a
            . /etc/bedifferent-temp.env
            set +a
            cd "$APP"
            runuser -u bedifferenttemp -- env DATABASE_URL="$DATABASE_URL" "$APP/bin/node" "$APP/scripts/smoke-ayman-auth.mjs"
            echo DEMO_AUTHENTICATED_CHECK_FINISHED
      - name: Verify all public production services stay healthy
        if: always()
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://bedifferent.smarbiz.sbs/api/ready >/dev/null
          curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/api/mobile/status/ >/dev/null
          curl -fsS --max-time 20 https://book.a-esthetic.de/api/health/ >/dev/null
          echo ALL_PUBLIC_APPS_OK
