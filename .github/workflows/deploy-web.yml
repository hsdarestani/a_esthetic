name: Trigger connected A+ Esthetic deployment

on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - ".deploy/full-app.tar.gz.b64"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: a-esthetic-deploy-trigger
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start connected deployment workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-connected-app.yml',
              ref: 'main'
            });
