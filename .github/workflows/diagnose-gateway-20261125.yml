name: Read-only production gateway incident diagnosis
on:
  push:
    branches: ['diagnostics/502-20261125']
    paths: ['.github/workflows/diagnose-gateway-20261125.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read safe aggregated incident evidence
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            date -u
            for svc in a-esthetic-mobile.service aesthetic-book.service nginx.service; do
              echo "SERVICE $svc"
              systemctl show "$svc" -p ActiveState -p SubState -p ActiveEnterTimestamp -p NRestarts -p Result -p MemoryCurrent || true
            done
            free -m
            df -h /
            ss -lntp | grep -E ':8773 |:8770 |:8017 ' || true
            systemctl list-units --type=service --all --no-pager | grep -Ei 'esthetic|book|gunicorn' || true
            python3 - <<'PY'
            import os,re,glob,subprocess
            s=subprocess.run(['ss','-lntp'],capture_output=True,text=True).stdout
            for line in s.splitlines():
                if ':8773 ' not in line: continue
                m=re.search(r'pid=(\d+)',line)
                if not m: continue
                pid=m.group(1); root=os.readlink('/proc/'+pid+'/cwd')
                print('RUNTIME_ROOT',root)
                print('RUNTIME_UNIT',open('/proc/'+pid+'/cgroup').read().strip())
                for base, dirs, files in os.walk(root):
                    dirs[:]=[d for d in dirs if d not in {'venv','.venv','node_modules','.git','media','static','staticfiles','uploads','__pycache__','vendor'}]
                    for fn in files:
                        if not fn.endswith('.py'): continue
                        path=os.path.join(base,fn)
                        try:
                            src=open(path,errors='replace').read()
                        except OSError: continue
                        if 'staff/book/' in src or 'staff_book' in src:
                            print('SOURCE',path)
                            for i,l in enumerate(src.splitlines()):
                                if ('staff/book/' in l or 'staff_book' in l or '502' in l or 'urlopen' in l or 'requests.' in l or 'httpx.' in l or 'BOOK_' in l or 'def ' in l) and not re.search(r'secret|password|token|authorization|key',l,re.I):
                                    print('CODE',i+1,l[:240])
            PY
