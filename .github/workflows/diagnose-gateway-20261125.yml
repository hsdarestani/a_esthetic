name: Read-only production gateway incident diagnosis
on:
  push:
    branches: ['diagnostics/502-20261125']
    paths: ['.github/workflows/diagnose-gateway-20261125.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read safe aggregated incident evidence
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            date -u
            for svc in a-esthetic-mobile.service aesthetic-book.service nginx.service; do
              echo "SERVICE $svc"
              systemctl show "$svc" -p ActiveState -p SubState -p ActiveEnterTimestamp -p NRestarts -p Result -p MemoryCurrent || true
            done
            free -m
            df -h /
            python3 - <<'PY'
            import subprocess, re, collections, glob, os
            since='2026-11-25 14:30:00 UTC'
            patterns={'worker_timeout':r'WORKER TIMEOUT','worker_boot_failure':r'Worker failed to boot','worker_exit':r'Worker exiting|Worker .* exited|Worker .* was sent SIGKILL','worker_start':r'Booting worker','service_restart':r'Starting |Started |Stopping |Stopped |Scheduled restart','oom':r'Out of memory|oom-kill|Killed process|oom_reaper','db_failure':r'OperationalError|database is locked|connection to server .* failed','upstream_refused':r'connect\(\) failed.*while connecting to upstream','upstream_timeout':r'upstream timed out','upstream_closed':r'upstream prematurely closed connection','no_live_upstreams':r'no live upstreams','bad_gateway':r'Bad Gateway|HTTP/[^"]+" 502 '}
            def report(label, lines):
                counts=collections.Counter()
                for line in lines:
                    stamp=re.search(r'(?:2026-11-25[T ]|2026/11/25 |25/Nov/2026:)(\d{2}:\d{2})',line)
                    if not stamp: continue
                    for kind, pat in patterns.items():
                        if re.search(pat,line,re.I): counts[(stamp.group(1),kind)]+=1
                for (minute,kind),n in sorted(counts.items()):
                    print(label,minute,kind,n)
                if not counts: print(label,'no matching incidents')
            for svc in ['a-esthetic-mobile.service','aesthetic-book.service','nginx.service']:
                p=subprocess.run(['journalctl','--utc','--since',since,'-u',svc,'--no-pager','-o','short-iso'],capture_output=True,text=True)
                report(svc,p.stdout.splitlines())
            p=subprocess.run(['journalctl','--utc','--since',since,'-k','--no-pager','-o','short-iso'],capture_output=True,text=True)
            report('kernel',p.stdout.splitlines())
            for fn in glob.glob('/var/log/nginx/*error*.log')+glob.glob('/var/log/nginx/*access*.log'):
                try:
                    with open(fn,errors='replace') as f:
                        lines=[line for line in f if re.search(r'2026/11/25 (?:14:[3-5]|15:)|25/Nov/2026:(?:14:[3-5]|15:)',line)]
                    report(os.path.basename(fn),lines)
                except OSError: pass
            PY

            python3 - <<'PY'
            import re, glob, collections, os
            routes=['/api/mobile/admin/book/overview/','/api/mobile/admin/book/calendar/','/api/mobile/admin/book/bookings/','/api/mobile/admin/book/customers/','/api/mobile/admin/book/services/','/api/mobile/admin/book/settings/','/api/mobile/admin/billing/','/api/mobile/admin/','/api/mobile/app-admin/','/api/mobile/status/','/api/health/','/verwaltung/app-sso/','/verwaltung/app/','/verwaltung/dashboard/','/verwaltung/kalender/','/verwaltung/','/admin/','/api/','/static/']
            def route(p):
                if p=='/': return 'root'
                return next((s for s in routes if p.startswith(s)),'other')
            for fn in glob.glob('/var/log/nginx/*access*.log'):
                counts=collections.Counter()
                with open(fn,errors='replace') as f:
                    for line in f:
                        m=re.search(r'25/Nov/2026:((?:14:[3-5][0-9]|15:[0-9][0-9])):[0-9]{2}[^\]]*\].*?"(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS) ([^ ?"]+)(?:\?[^ "]*)? HTTP/[^"]+" (\d{3}) ',line)
                        if m and m.group(4) in ('502','503','504'):
                            counts[(m.group(1),m.group(2),route(m.group(3)),m.group(4))]+=1
                for key,n in sorted(counts.items()): print('HTTP_INCIDENT',os.path.basename(fn),*key,n)
            PY

            python3 - <<'PY'
            import re, glob, collections, os, subprocess
            allowed=set('api admin admins internal proxy book booking bookings overview bootstrap billing billing-catalog calendar calendar-day availability appointments services staff sso auth patient patients record records patient-records patient-intake app app-admin dashboard settings customers customer-sync status health wallet login office desktop goae invoices invoice notifications mobile api-v1 v1 v2 sync verification verify token management integration bridge doctor user users session admin-bootstrap admin-dashboard admin-calendar admin-bookings admin-proxy admin-api book-admin book-proxy'.split())
            def route(path):
                path=path.split('?')[0]
                return '/'+ '/'.join(x if x in allowed else 'REDACTED' for x in path.strip('/').split('/'))+'/'
            regex=re.compile(r'"(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS) ([^ "]*) HTTP/[^"]+" (\d{3})')
            for fn in glob.glob('/var/log/nginx/*access*.log'):
                counts=collections.Counter()
                with open(fn,errors='replace') as f:
                    for line in f:
                        t=re.search(r'25/Nov/2026:(15:0[0-9]):\d{2}',line); m=regex.search(line)
                        if t and m and m.group(3) in ('502','503','504'):
                            counts[(t.group(1),route(m.group(2)),m.group(3))]+=1
                for key,n in sorted(counts.items()): print('EXACT_SAFE_ROUTE',*key,n)
            for svc in ['a-esthetic-mobile.service','aesthetic-book.service']:
                p=subprocess.run(['journalctl','--utc','--since','2026-11-25 15:00:00 UTC','-u',svc,'--no-pager','-o','short-iso'],capture_output=True,text=True)
                counts=collections.Counter()
                for line in p.stdout.splitlines():
                    m=regex.search(line)
                    if m and m.group(3) in ('502','503','504'):
                        counts[(route(m.group(2)),m.group(3))]+=1
                    for typ in ['invalid_book_admin_response','book_admin_unavailable','Bad Gateway','Service Unavailable','Gateway Timeout']:
                        if typ in line: counts[(typ,'application')]+=1
                print('APPLICATION',svc,dict(counts))
            PY
