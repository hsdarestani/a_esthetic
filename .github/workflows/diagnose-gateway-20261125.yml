name: Read-only production gateway incident diagnosis
on:
  push:
    branches: ['diagnostics/502-20261125']
    paths: ['.github/workflows/diagnose-gateway-20261125.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read safe aggregated incident evidence
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            date -u
            for svc in a-esthetic-mobile.service aesthetic-book.service nginx.service; do
              echo "SERVICE $svc"
              systemctl show "$svc" -p ActiveState -p SubState -p ActiveEnterTimestamp -p NRestarts -p Result -p MemoryCurrent || true
            done
            free -m
            df -h /
            cd /opt/a-esthetic-mobile
            set -a
            . ./mobile.env
            set +a
            ./venv/bin/python manage.py shell -c '
            import inspect, re
            from django.urls import resolve
            for path in ["/api/mobile/staff/book/overview/","/api/mobile/staff/book/calendar/","/api/mobile/staff/book/patients/"]:
                try:
                    m=resolve(path); fn=inspect.unwrap(m.func)
                    print("RESOLVED",path,m.view_name,fn.__module__,inspect.getsourcefile(fn))
                    src=inspect.getsource(fn)
                    for line in src.splitlines():
                        if not re.search(r"secret|password|token|authorization|key",line,re.I): print(line)
                    for name in fn.__code__.co_names:
                        obj=fn.__globals__.get(name)
                        if inspect.isfunction(obj) and obj.__module__==fn.__module__ and ("proxy" in name or "book" in name or "request" in name or "fetch" in name):
                            print("HELPER",name)
                            for line in inspect.getsource(obj).splitlines():
                                if not re.search(r"secret|password|token|authorization|key",line,re.I): print(line)
                except Exception as e: print("RESOLVE_ERROR",path,type(e).__name__)
            '
            python3 - <<'PY'
            import subprocess,re
            s=subprocess.run(['nginx','-T'],capture_output=True,text=True).stdout
            for line in s.splitlines():
                if re.search(r'location .*staff|proxy_pass .*127\.0\.0\.1|server_name .*esthetic',line):
                    print('NGINX_ROUTE',line.strip())
            PY
