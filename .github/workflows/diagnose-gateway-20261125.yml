name: Read-only production gateway incident diagnosis
on:
  push:
    branches: ['diagnostics/502-20261125']
    paths: ['.github/workflows/diagnose-gateway-20261125.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read safe aggregated incident evidence
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            date -u
            for svc in a-esthetic-mobile.service aesthetic-book.service nginx.service; do
              echo "SERVICE $svc"
              systemctl show "$svc" -p ActiveState -p SubState -p ActiveEnterTimestamp -p NRestarts -p Result -p MemoryCurrent || true
            done
            free -m
            df -h /
            python3 - <<'PY'
            import pathlib, subprocess, urllib.request, urllib.error, json, time, shutil
            def run(*args): return subprocess.check_output(args,text=True).strip()
            unit='aesthetic-native-app-daf287f613.service'
            book='aesthetic-native-book-daf287f613.service'
            root=pathlib.Path(run('systemctl','show',unit,'-p','WorkingDirectory','--value'))
            assert root.name=='daf287f613b62c87d385fe7356c8a040ebbdf204'
            assert run('systemctl','is-active',book)=='active'
            assert '/etc/aesthetic-book.env' in run('systemctl','show',book,'-p','EnvironmentFiles','--value')
            def check(url,expected):
                req=urllib.request.Request(url,headers={'Accept':'application/json'})
                try: r=urllib.request.urlopen(req,timeout=10)
                except urllib.error.HTTPError as e: r=e
                with r:
                    assert r.code==expected and r.headers.get_content_type()=='application/json',f'{url}: HTTP {r.code} {r.headers.get_content_type()}'
                    json.loads(r.read(65536))
                print('PASS',url,expected,flush=True)
            for route in ['overview','calendar','patients']:
                check('http://127.0.0.1:8019/api/mobile/staff/'+route+'/',401)
            path=root/'production_native_settings.py'
            assert path.is_file()
            original=path.read_text()
            backup=root/'production_native_settings.py.before-staff-routing-20261125'
            assert not backup.exists()
            proposed=original+'\n# Route the native staff workspace to its matching local Book release.\nMOBILE_STAFF_BOOK_ORIGIN = "http://127.0.0.1:8019"\n'
            compile(proposed,str(path),'exec')
            shutil.copy2(path,backup)
            def reload():
                subprocess.run(['systemctl','kill','--kill-whom=main','--signal=HUP',unit],check=True)
                time.sleep(3)
                assert run('systemctl','is-active',unit)=='active'
            try:
                path.write_text(proposed)
                reload()
                for route in ['overview','calendar','patients']:
                    check('https://app.a-esthetic.de/api/mobile/staff/book/'+route+'/',401)
                check('https://app.a-esthetic.de/api/mobile/status/',200)
                check('https://book.a-esthetic.de/api/health/',200)
                print('LOCAL_STAFF_ROUTE_REPAIRED=1',flush=True)
            except BaseException:
                path.write_text(original)
                reload()
                print('ROLLED_BACK=1',flush=True)
                raise
            PY
