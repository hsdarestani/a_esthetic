name: Read-only production gateway incident diagnosis
on:
  push:
    branches: ['diagnostics/502-20261125']
    paths: ['.github/workflows/diagnose-gateway-20261125.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read safe aggregated incident evidence
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            date -u
            for svc in a-esthetic-mobile.service aesthetic-book.service nginx.service; do
              echo "SERVICE $svc"
              systemctl show "$svc" -p ActiveState -p SubState -p ActiveEnterTimestamp -p NRestarts -p Result -p MemoryCurrent || true
            done
            free -m
            df -h /
            python3 - <<'PY'
            import re, subprocess, pathlib, json, urllib.request, urllib.error, shutil
            def run(*args):
                return subprocess.check_output(args,text=True).strip()
            canonical='aesthetic-book.service'
            candidate='aesthetic-native-book-daf287f613.service'
            for unit in (canonical,candidate):
                assert run('systemctl','is-active',unit)=='active'
                assert '/etc/aesthetic-book.env' in run('systemctl','show',unit,'-p','EnvironmentFiles','--value')
            listeners=run('ss','-lntp')
            assert '127.0.0.1:8019' in listeners
            class NoRedirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self,*a): return None
            opener=urllib.request.build_opener(NoRedirect)
            def check(base,path,host,expected,require_json=True):
                req=urllib.request.Request(base+path,headers={'Host':host,'Accept':'application/json'})
                try: r=opener.open(req,timeout=15)
                except urllib.error.HTTPError as e: r=e
                with r:
                    code=r.code; typ=r.headers.get_content_type()
                    assert code==expected and (not require_json or typ=='application/json'),f'{path}: HTTP {code} {typ}, expected {expected}'
                    if require_json: json.loads(r.read(65536))
                print('PASS',path,code,flush=True)
            for route in ['overview','calendar','patients']:
                check('http://127.0.0.1:8019','/api/mobile/staff/'+route+'/','book.a-esthetic.de',401)
            conf=pathlib.Path('/etc/nginx/sites-available/aesthetic-book.conf')
            original=conf.read_text()
            assert 'server_name book.a-esthetic.de' in original,'Unexpected virtual host'
            assert 'location ^~ /api/mobile/staff/' not in original,'Staff route already present'
            matches=list(re.finditer(r'(?m)^([ \t]*)location\s+/\s*\{(?=[^}]*proxy_pass\s+http://127\.0\.0\.1:8017\s*;)',original))
            assert len(matches)==1,'Unexpected canonical proxy configuration'
            m=matches[0]
            indent=m.group(1)
            block=indent+'location ^~ /api/mobile/staff/ {\n'+indent+'    proxy_pass http://127.0.0.1:8019;\n'+indent+'    proxy_set_header Host $host;\n'+indent+'    proxy_set_header X-Forwarded-Proto $scheme;\n'+indent+'    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n'+indent+'    proxy_set_header X-Real-IP $remote_addr;\n'+indent+'}\n'
            proposed=original[:m.start()]+block+original[m.start():]
            backup=pathlib.Path('/root/aesthetic-book-nginx-before-staff-20261125.conf')
            assert not backup.exists(),'Backup already exists'
            shutil.copy2(conf,backup)
            try:
                conf.write_text(proposed)
                subprocess.run(['nginx','-t'],check=True)
                subprocess.run(['systemctl','reload','nginx'],check=True)
                for route in ['overview','calendar','patients']:
                    check('https://book.a-esthetic.de','/api/mobile/staff/'+route+'/','book.a-esthetic.de',401)
                    check('https://app.a-esthetic.de','/api/mobile/staff/book/'+route+'/','app.a-esthetic.de',401)
                check('https://book.a-esthetic.de','/api/health/','book.a-esthetic.de',200)
                check('https://app.a-esthetic.de','/api/mobile/status/','app.a-esthetic.de',200)
            except BaseException:
                conf.write_text(original)
                subprocess.run(['nginx','-t'],check=True)
                subprocess.run(['systemctl','reload','nginx'],check=True)
                print('ROLLED_BACK=1',flush=True)
                raise
            print('STAFF_ROUTE_REPAIRED=1',flush=True)
            PY
