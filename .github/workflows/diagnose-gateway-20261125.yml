name: Read-only production gateway incident diagnosis
on:
  push:
    branches: ['diagnostics/502-20261125']
    paths: ['.github/workflows/diagnose-gateway-20261125.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read safe aggregated incident evidence
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            date -u
            for svc in a-esthetic-mobile.service aesthetic-book.service nginx.service; do
              echo "SERVICE $svc"
              systemctl show "$svc" -p ActiveState -p SubState -p ActiveEnterTimestamp -p NRestarts -p Result -p MemoryCurrent || true
            done
            free -m
            df -h /
            python3 - <<'PY'
            import os,re,subprocess,urllib.request,urllib.error
            units=subprocess.run(['systemctl','list-units','--type=service','--all','--no-legend','--plain'],capture_output=True,text=True).stdout
            for line in units.splitlines():
                if not re.search(r'aesthetic-native-(app|book)-',line): continue
                unit=line.split()[0]
                print('UNIT',unit)
                s=subprocess.run(['systemctl','show',unit,'-p','WorkingDirectory','-p','MainPID','-p','ActiveState','-p','EnvironmentFiles'],capture_output=True,text=True).stdout
                print(s.strip())
                pid=re.search(r'MainPID=(\d+)',s)
                if not pid or pid.group(1)=='0': continue
                pid=pid.group(1)
                env=dict(x.split('=',1) for x in open('/proc/'+pid+'/environ','rb').read().decode(errors='replace').split('\0') if '=' in x)
                for k,v in env.items():
                    if k in ['MOBILE_STAFF_BOOK_ORIGIN','MOBILE_STAFF_APP_ORIGIN','DJANGO_SETTINGS_MODULE','DJANGO_ALLOWED_HOSTS','ALLOWED_HOSTS','BOOK_ORIGIN','APP_ORIGIN']: print('SAFE_ENV',k,v)
                root=os.readlink('/proc/'+pid+'/cwd')
                for rel in ['config/settings.py','booking/urls.py','booking/mobile_staff_api.py','booking/staff_mobile_api.py','p0_app/mobile_staff_views.py']:
                    p=os.path.join(root,rel)
                    if not os.path.isfile(p): continue
                    for i,l in enumerate(open(p,errors='replace')):
                        if re.search(r'MOBILE_STAFF.*ORIGIN|api/mobile/staff/|staff_session|def _verify|def _staff',l) and not re.search(r'password|secret|token',l,re.I):
                            print('CONFIG',rel,i+1,l.strip()[:240])
            s=subprocess.run(['ss','-lntp'],capture_output=True,text=True).stdout
            for line in s.splitlines():
                if 'gunicorn' in line: print('LISTENER',line.strip())
            class NoRedirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self,*a): return None
            opener=urllib.request.build_opener(NoRedirect)
            for base in ['https://book.a-esthetic.de','http://127.0.0.1:8017','http://127.0.0.1:8018','http://127.0.0.1:8019','http://127.0.0.1:8020','http://127.0.0.1:8773']:
                for route in ['/api/mobile/staff/overview/','/api/health/']:
                    try:
                        req=urllib.request.Request(base+route,headers={'Host':'book.a-esthetic.de','Accept':'application/json'})
                        try: r=opener.open(req,timeout=3)
                        except urllib.error.HTTPError as e: r=e
                        with r: print('PROBE',base,route,r.code,r.headers.get_content_type())
                    except Exception as e: print('PROBE',base,route,type(e).__name__)
            PY
