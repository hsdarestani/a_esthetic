name: Materialize complete A+ Esthetic source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: a-esthetic-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Expand verified source package
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.release/complete.part*)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "Source already materialized."
            exit 0
          fi
          cat .release/complete.part* > /tmp/complete.b64
          test "$(wc -c < /tmp/complete.b64)" = "80072"
          base64 -d /tmp/complete.b64 > /tmp/complete.tar.gz
          echo "9edc7ee473f05238dd8c3f5516a802eef3b5946856e85ff2c3bbfb4901c081bc  /tmp/complete.tar.gz" | sha256sum -c -
          tar -tzf /tmp/complete.tar.gz >/dev/null
          tar -xzf /tmp/complete.tar.gz
          rm -rf .release
          python3 -m compileall -q experience_app config
          test -s experience_app/models.py
          test -s experience_app/views.py
          test -s .github/workflows/deploy-complete-platform.yml
      - name: Commit readable source
        id: push_source
        continue-on-error: true
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -o pipefail
          : > /tmp/materialize-push.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit." | tee -a /tmp/materialize-push.log
            exit 0
          fi
          git commit -m "Materialize complete A+ Esthetic source" 2>&1 | tee -a /tmp/materialize-push.log
          git fetch origin "$TARGET_BRANCH" 2>&1 | tee -a /tmp/materialize-push.log
          if ! git merge-base --is-ancestor "origin/$TARGET_BRANCH" HEAD; then
            git rebase "origin/$TARGET_BRANCH" 2>&1 | tee -a /tmp/materialize-push.log
          fi
          git push origin "HEAD:$TARGET_BRANCH" 2>&1 | tee -a /tmp/materialize-push.log
      - name: Upload push diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materialize-push-log-${{ github.run_id }}
          path: /tmp/materialize-push.log
          if-no-files-found: error
      - name: Fail when source push failed
        if: steps.push_source.outcome == 'failure'
        run: exit 1
