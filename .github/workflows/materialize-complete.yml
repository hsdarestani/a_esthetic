name: Materialize complete A+ Esthetic source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: a-esthetic-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Record transfer checksums
        run: |
          set -euo pipefail
          {
            for file in .release/complete.part*; do
              [ -f "$file" ] || continue
              case "$file" in *actual-checksums.txt) continue;; esac
              printf '%s %s ' "$(wc -c < "$file")" "$(sha256sum "$file" | cut -d' ' -f1)"
              echo "$file"
            done
          } > .release/actual-checksums.txt
          cat .release/actual-checksums.txt
      - name: Commit checksum report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release/actual-checksums.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record transfer checksums"
          git push origin HEAD:${{ github.head_ref }}
