name: Materialize complete A+ Esthetic source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: a-esthetic-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Expand verified source package
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.release/complete.part*)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "Source already materialized."
            exit 0
          fi
          cat .release/complete.part* > /tmp/complete.b64
          test "$(wc -c < /tmp/complete.b64)" = "80072"
          base64 -d /tmp/complete.b64 > /tmp/complete.tar.gz
          echo "9edc7ee473f05238dd8c3f5516a802eef3b5946856e85ff2c3bbfb4901c081bc  /tmp/complete.tar.gz" | sha256sum -c -
          tar -tzf /tmp/complete.tar.gz >/dev/null
          tar -xzf /tmp/complete.tar.gz
          mv settings.py config/settings.py
          mv urls.py config/urls.py
          mv base.html templates/base.html
          mv app.js static/app.js
          mv static_experience.css static/experience.css
          rm -f .github/workflows/deploy-complete-platform.yml
          rm -rf .release mobile
          python3 -m compileall -q experience_app config
          find experience_app config -type d -name __pycache__ -prune -exec rm -rf {} +
          find experience_app config -type f -name '*.pyc' -delete
          test -s experience_app/models.py
          test -s experience_app/views.py
          test -s config/settings.py
          test -s templates/base.html
          test -s static/experience.css
      - name: Commit readable source
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize complete A+ Esthetic source"
          git fetch origin "$TARGET_BRANCH"
          if ! git merge-base --is-ancestor "origin/$TARGET_BRANCH" HEAD; then
            git rebase "origin/$TARGET_BRANCH"
          fi
          git push origin "HEAD:$TARGET_BRANCH"
