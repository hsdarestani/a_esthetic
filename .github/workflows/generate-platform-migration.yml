name: Generate retained platform migration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: a-esthetic-platform-migration
  cancel-in-progress: true

jobs:
  migrate-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: migration-only-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PRIVATE_FILE_ENCRYPTION_KEYS: Z1lqRkVxV2JmOWJOM2U2TF9leHgzZnRtTmxCM0EwX0NtYkVoZkFKcz0=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate and commit missing migration
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python manage.py makemigrations platform_app --noinput
          if git diff --quiet -- platform_app/migrations; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform_app/migrations
          git commit -m "Generate platform app migrations"
          git fetch origin "$TARGET_BRANCH"
          if ! git merge-base --is-ancestor "origin/$TARGET_BRANCH" HEAD; then git rebase "origin/$TARGET_BRANCH"; fi
          git push origin "HEAD:$TARGET_BRANCH"
