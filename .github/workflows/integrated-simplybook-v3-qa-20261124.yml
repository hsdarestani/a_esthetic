name: Integrated SimplyBook V3 calendar — exact iOS Appetize and Android regression
on:
  push:
    branches: ['fix/integrated-simplybook-v3-calendar-20261124']
    paths: ['.github/workflows/integrated-simplybook-v3-qa-20261124.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36e222269358289ef03f36067a5e15cf29c471fe
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify restored calendar renderer and safe command controller
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "36e222269358289ef03f36067a5e15cf29c471fe"
          grep -F 'StaffSimplyBookV3(state: state, model: calendar)' native/staff/ios/NativeStaff.swift
          grep -F 'new NativeStaffV3Calendar(' native/staff/android/NativeStaffPlugin.java
          grep -F 'block-info:' www/mobile/native-calendar-layout.mjs
          grep -F 'source_editable' www/mobile/native-workspace.mjs
          node scripts/test_native_calendar_layout.mjs
          node scripts/test_native_staff_controller.mjs
  ios-appetize:
    needs: js
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36e222269358289ef03f36067a5e15cf29c471fe
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate actual V3 native app and verify selected renderer
        run: |
          set -euo pipefail
          npm pkg delete scripts.capacitor:sync:after
          npm install --no-audit --no-fund
          npx cap add ios
          python3 scripts/configure_native_camera_permissions.py
          python3 scripts/install_native_staff.py
          grep -F 'struct StaffSimplyBookV3: View' ios/App/App/AppDelegate.swift
          grep -F 'StaffSimplyBookV3(state: state, model: calendar)' ios/App/App/AppDelegate.swift
          grep -F 'VISIBLE_START_HOUR = 10' ios/App/App/public/mobile/native-calendar-layout.mjs
          grep -F 'VISIBLE_END_HOUR = 20' ios/App/App/public/mobile/native-calendar-layout.mjs
          grep -F 'block-info:' ios/App/App/public/mobile/native-calendar-layout.mjs
      - name: Compile exact restored native iOS Simulator app
        run: |
          set -euo pipefail
          if [[ -d ios/App/App.xcworkspace ]]; then app=(-workspace ios/App/App.xcworkspace); else app=(-project ios/App/App.xcodeproj); fi
          xcodebuild "${app[@]}" -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/esthetic-v3-restored" CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=1.0.48 CURRENT_PROJECT_VERSION=54 build > "$RUNNER_TEMP/ios.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/ios.log"; exit 1; }
      - name: Verify final simulator executable and bundle layout
        run: |
          set -euo pipefail
          mkdir -p artifacts
          app="$RUNNER_TEMP/esthetic-v3-restored/Build/Products/Debug-iphonesimulator/App.app"
          test -s "$app/App"
          grep -F 'VISIBLE_START_HOUR = 10' "$app/public/mobile/native-calendar-layout.mjs"
          grep -F 'VISIBLE_END_HOUR = 20' "$app/public/mobile/native-calendar-layout.mjs"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist"
          ditto -c -k --keepParent "$app" artifacts/APlus-Esthetic-V3-1.0.48-B54-Appetize.zip
          python3 - <<'PY'
          import zipfile
          p='artifacts/APlus-Esthetic-V3-1.0.48-B54-Appetize.zip'
          with zipfile.ZipFile(p) as z:
              assert 'App.app/App' in z.namelist()
              assert 'App.app/Info.plist' in z.namelist()
              assert not z.testzip()
          print('APPETIZE_DIRECT_ZIP_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: APlus-Esthetic-V3-1.0.48-B54-Appetize
          path: artifacts/APlus-Esthetic-V3-1.0.48-B54-Appetize.zip
          if-no-files-found: error
          retention-days: 14
  android:
    needs: js
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36e222269358289ef03f36067a5e15cf29c471fe
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Publisher-style Android release with both fixes
        env:
          APP_VERSION_NAME: '1.0.48'
          APP_BUILD_NUMBER: '54'
        run: |
          set -euo pipefail
          bash scripts/build-android.sh
          grep -R -F 'registerPlugin(NativeStaffPlugin.class);' android/app/src/main/java
          grep -R -F 'new NativeStaffV3Calendar(' android/app/src/main/java
          test "$(find android/app/src/main/java -name 'NativeStaffV3Calendar.java' | wc -l)" -eq 1
          test -s artifacts/a-esthetic-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: APlus-Esthetic-V3-Android-verification
          path: artifacts/a-esthetic-release.aab
          if-no-files-found: error
