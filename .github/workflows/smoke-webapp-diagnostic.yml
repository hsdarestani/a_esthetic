name: Diagnose A+ Esthetic web app smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: smoke-only-secret-key-smoke-only-secret-key
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver,esthetic.smarbiz.sbs
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install and prepare
        run: |
          pip install -r requirements.txt >/dev/null
          echo "PRIVATE_FILE_ENCRYPTION_KEYS=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
          python manage.py migrate --noinput >/dev/null
          python manage.py seed_platform >/dev/null
          python manage.py seed_complete_features >/dev/null
      - name: Run focused smoke test
        id: smoke_test
        continue-on-error: true
        run: |
          set -o pipefail
          python manage.py smoke_webapp 2>&1 | tee /tmp/a-esthetic-smoke.log
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-esthetic-smoke-${{ github.run_id }}
          path: /tmp/a-esthetic-smoke.log
          if-no-files-found: error
      - name: Fail on smoke error
        if: steps.smoke_test.outcome == 'failure'
        run: exit 1
