name: Fix reference UI idempotence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-reference-ui-idempotence.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make topbar enhancement idempotent
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('www/reference-ui.js')
          text = p.read_text(encoding='utf-8')
          old = base64.b64decode('ICAgIGJyYW5kLmlubmVySFRNTCA9IGA8c3BhbiBjbGFzcz0idG9wYmFyLWxvdHVzIj4ke2xvdHVzKCd0b3BiYXItbG90dXMtc3ZnJyl9PC9zcGFuPjxzcGFuIGNsYXNzPSJ0b3BiYXItdGl0bGUiPjxiPiR7dGl0bGV9PC9iPjxzbWFsbD5BKyBFU1RIRVRJQzwvc21hbGw+PC9zcGFuPmA7Cg==').decode()
          new = base64.b64decode('').decode()
          if old not in text:
              raise SystemExit('Expected topbar assignment not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check www/reference-ui.js
      - name: Commit fix and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-reference-ui-idempotence.yml
          git add www/reference-ui.js
          git commit -m "Stop luxury UI observer from redrawing topbar"
          git push
