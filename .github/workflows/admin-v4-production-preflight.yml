name: V4 production read-only safety preflight
on:
  push:
    branches: ['ops/admin-v4-production-preflight-20261124']
    paths: ['.github/workflows/admin-v4-production-preflight.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/a-esthetic-mobile
            systemctl show a-esthetic-mobile.service -p ActiveState -p WorkingDirectory -p CanReload --no-pager
            if [ -d .git ]; then git rev-parse HEAD; git status --porcelain -- p0_app/native_office.py p0_app/mobile_staff_views.py p0_app/urls.py platform_app/models.py platform_app/goae_billing.py; fi
            for file in p0_app/native_office.py p0_app/mobile_staff_views.py p0_app/urls.py platform_app/models.py platform_app/goae_billing.py; do if [ -f "$file" ]; then sha256sum "$file"; else printf 'MISSING %s\n' "$file"; fi; done
            df -h "/opt/a-esthetic-mobile" | tail -1
            set -a
            source /opt/a-esthetic-mobile/mobile.env
            set +a
            /opt/a-esthetic-mobile/venv/bin/python manage.py shell <<'PY'
            from django.db import connection
            tables=set(connection.introspection.table_names())
            print('DB_VENDOR',connection.vendor)
            for name in ["platform_app_officeintakesubmission","platform_app_officepatientlink","platform_app_invoice"]:
                print('TABLE',name, 'present' if name in tables else 'missing')
            PY
