name: A+ Esthetic focused prebuild audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prebuild-focused-app-audit.yml"
      - "scripts/prebuild_production_smoke.py"
      - "www/**"
      - "platform_app/**"
      - "p0_app/**"
      - "p2_app/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "scripts/build-android.sh"
      - "scripts/build-ios.sh"
      - "scripts/install-google-services.js"

permissions:
  contents: read

concurrency:
  group: a-esthetic-focused-prebuild-audit
  cancel-in-progress: true

jobs:
  app-tests:
    name: A+ app full tests and native wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install --no-audit --no-fund

      - name: Check forbidden brand possessives
        run: python scripts/check_no_unser_copy.py

      - name: Run complete Django test suite
        env:
          DJANGO_DEBUG: "1"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test --verbosity 1

      - name: Validate focused customer runtime
        run: |
          set -euo pipefail
          python -m py_compile scripts/prebuild_production_smoke.py
          for file in booking-direct-api.js admin-mode.js core-app.js account-onboarding.js booking-consent-bridge.js booking-book-flow.js focused-upgrade.js native-push.js native-interactions.js; do
            node --check "www/$file"
          done
          python - <<'PY'
          import pathlib, re
          html=pathlib.Path('www/index.html').read_text()
          srcs=re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)',html,re.I)
          names={s.split('?',1)[0].rsplit('/',1)[-1] for s in srcs}
          required={'booking-direct-api.js','admin-mode.js','core-app.js','account-onboarding.js','booking-consent-bridge.js','booking-book-flow.js','focused-upgrade.js','native-push.js','native-interactions.js'}
          legacy={'app.js','p0.js','p1.js','p2.js','p3.js','ops.js','reference-ui.js','feature-flags.js','runtime-hotfix.js'}
          assert not (required-names), f'missing runtime: {sorted(required-names)}'
          assert not (names & legacy), f'legacy runtime loaded: {sorted(names & legacy)}'
          css=pathlib.Path('www/apple-wallet-only.css').read_text()
          assert 'nth-child(n+2)' in css
          interactions_css=pathlib.Path('www/native-interactions.css').read_text()
          assert '.record-preview-overlay' in interactions_css and '.record-preview-body' in interactions_css
          push=pathlib.Path('www/native-push.js').read_text()
          for needle in ('PushNotifications','/notifications/devices/','requestPermissions','native.register()','DELETE'):
              assert needle in push, f'native push bridge missing {needle}'
          consent=pathlib.Path('www/booking-consent-bridge.js').read_text()
          for needle in ('marketing_opt_in','cancellation_terms_accepted','privacy_accepted','/profile/'):
              assert needle in consent, f'booking consent bridge missing {needle}'
          interactions=pathlib.Path('www/native-interactions.js').read_text()
          for needle in ('data-open-review','data-record-file','about:blank','record-preview-overlay','/patient-records/','/reviews/'):
              assert needle in interactions, f'native interactions missing {needle}'
          book=pathlib.Path('www/booking-direct-api.js').read_text()
          assert 'https://book.a-esthetic.de/api/mobile' in book
          onboarding=pathlib.Path('www/account-onboarding.js').read_text()
          assert 'minimumVisibleMs = 2200' in onboarding and 'aplus:intro-finished' in onboarding, 'premium intro duration/event missing'
          loading=pathlib.Path('www/global-loading.js').read_text()
          loading_css=pathlib.Path('www/global-loading.css').read_text()
          assert 'introActive()' in loading and 'brand-intro-active' in loading_css, 'global loader must stay hidden over brand intro'
          booking_flow=pathlib.Path('www/booking-book-flow.js').read_text()
          assert 'book-duration-badge' in booking_flow and 'duration_minutes' in booking_flow, 'service duration must remain visible in booking cards'
          client_css=pathlib.Path('www/client-v19.css').read_text()
          assert '.book-progress-line' in client_css and 'max-height:1px' in client_css, 'booking progress connector must remain a thin line'
          site_assets = [
              'home-sculpture.webp','home-clinic.webp','treatment-botox.webp',
              'treatment-hyaluron.webp','treatment-prp.webp','treatment-rf.webp',
              'treatment-laser.webp','treatment-accent.webp'
          ]
          for asset in site_assets:
              assert pathlib.Path('www/assets/site', asset).is_file(), f'missing website visual {asset}'
          approved_css=pathlib.Path('www/approved-v22.css').read_text()
          for needle in ('.approved-home-hero','.approved-record-timeline','.approved-points-hero','.book-service-filters'):
              assert needle in approved_css, f'approved design missing {needle}'
          assert 'home-sculpture.webp' in approved_css and 'home-clinic.webp' in approved_css, 'website visuals must be integrated'
          assert 'serviceImage(' in booking_flow and 'treatment-botox.webp' in booking_flow, 'booking treatment visuals missing'
          print('FOCUSED_RUNTIME_STATIC_AUDIT=success')
          PY

      - name: Validate Android Capacitor Firebase wiring
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          node scripts/install-google-services.js
          test -s android/app/google-services.json
          grep -q 'de.aplusesthetic.app' android/app/google-services.json
          grep -Rqs 'com.google.gms.google-services' android || { echo 'Google Services Gradle plugin not wired'; exit 1; }
          grep -Rqs 'PushNotifications' android || { echo 'Capacitor push plugin missing from Android project'; exit 1; }
          echo 'ANDROID_NATIVE_PUSH_WIRING=success'

  book-tests:
    name: Canonical Book full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clone and test canonical Book
        env:
          DJANGO_DEBUG: "1"
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hsdarestani/book.git /tmp/aesthetic-book
          cd /tmp/aesthetic-book
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test --verbosity 1
          grep -q 'marketing_opt_in=marketing_opt_in' booking/mobile_api.py
          grep -q 'cancellation_terms_accepted=cancellation_terms_accepted' booking/mobile_api.py
          grep -q 'privacy_accepted=privacy_accepted' booking/mobile_api.py
          echo 'CANONICAL_BOOK_FULL_TESTS=success'

  production-smoke:
    name: Production five-function smoke
    needs: [app-tests, book-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for current focused web deployment
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            HTML="$(curl -fsS --max-time 15 'https://esthetic.smarbiz.sbs/?prebuild-audit=1' || true)"
            if printf '%s' "$HTML" | grep -q 'native-push.js' && printf '%s' "$HTML" | grep -q 'account-onboarding.js?v=20260923-intro-v24' && printf '%s' "$HTML" | grep -q 'ferrari-v18.css?v=20260922-v18' && printf '%s' "$HTML" | grep -q 'client-v19.css?v=20260923-progress-v21' && printf '%s' "$HTML" | grep -q 'approved-v22.css?v=20260923-sitevisuals-v25' && printf '%s' "$HTML" | grep -q 'core-app.js?v=20260923-sitevisuals-v25' && printf '%s' "$HTML" | grep -q 'booking-consent-bridge.js' && printf '%s' "$HTML" | grep -q 'native-interactions.js'; then
              echo 'CURRENT_WEB_RELEASE_READY=1'
              exit 0
            fi
            sleep 5
          done
          echo 'Current focused web release did not become ready in time'
          exit 1

      - name: Run isolated production integration smoke
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/aesthetic_prod
          chmod 600 ~/.ssh/aesthetic_prod
          PORT="${SERVER_PORT:-22}"
          scp -q -P "$PORT" -i ~/.ssh/aesthetic_prod -o StrictHostKeyChecking=no scripts/prebuild_production_smoke.py "$SERVER_USER@$SERVER_HOST":/tmp/aesthetic-prebuild-smoke.py
          ssh -p "$PORT" -i ~/.ssh/aesthetic_prod -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          chmod 700 /tmp/aesthetic-prebuild-smoke.py
          set -a
          . /opt/a-esthetic-mobile/mobile.env
          set +a
          export PYTHONPATH=/opt/a-esthetic-mobile/vendor
          cd /opt/a-esthetic-mobile
          python3 /tmp/aesthetic-prebuild-smoke.py
          rm -f /tmp/aesthetic-prebuild-smoke.py
          REMOTE

      - name: Audit summary
        run: |
          echo 'PREBUILD_AUDIT=success'
          echo 'Store build remains intentionally blocked until this audit is green.'
