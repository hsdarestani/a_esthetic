name: Deploy full A+ Esthetic platform

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: a-esthetic-full-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed platform
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate project structure
        run: |
          set -eu
          test -s manage.py
          test -s requirements.txt
          test -s config/settings.py
          test -s core/models.py
          test -s booking/models.py
          test -s club/models.py
          test -s care/models.py
          python3 -m compileall -q .

      - name: Create release archive
        run: |
          tar --exclude=.git --exclude=.github --exclude='__pycache__' --exclude='*.pyc' -czf aesthetic-release.tar.gz .

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          source: aesthetic-release.tar.gz
          target: /tmp
          overwrite: true

      - name: Install, migrate and activate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.PASS }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            DOMAIN='esthetic.smarbiz.sbs'
            APP='/opt/aesthetic-platform'
            CURRENT="$APP/current"
            ENVFILE='/etc/aesthetic-platform.env'

            apt-get update -y >/dev/null
            apt-get install -y python3 python3-venv python3-pip postgresql postgresql-contrib nginx certbot python3-certbot-nginx curl openssl >/dev/null
            systemctl enable --now postgresql nginx >/dev/null

            id -u aesthetic >/dev/null 2>&1 || useradd --system --home "$APP" --shell /usr/sbin/nologin aesthetic
            mkdir -p "$APP/releases" "$APP/shared/private_media"
            RELEASE="$APP/releases/${{ github.event.pull_request.head.sha }}"
            rm -rf "$RELEASE"
            mkdir -p "$RELEASE"
            tar -xzf /tmp/aesthetic-release.tar.gz -C "$RELEASE"
            rm -f /tmp/aesthetic-release.tar.gz
            ln -sfn "$APP/shared/private_media" "$RELEASE/private_media"
            ln -sfn "$RELEASE" "$CURRENT"

            DBPASS_FILE='/root/.aesthetic_db_password'
            SECRET_FILE='/root/.aesthetic_django_secret'
            ADMIN_FILE='/root/.aesthetic_admin_password'
            [ -s "$DBPASS_FILE" ] || (openssl rand -hex 24 > "$DBPASS_FILE" && chmod 600 "$DBPASS_FILE")
            [ -s "$SECRET_FILE" ] || (openssl rand -hex 48 > "$SECRET_FILE" && chmod 600 "$SECRET_FILE")
            [ -s "$ADMIN_FILE" ] || (openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 26 > "$ADMIN_FILE" && chmod 600 "$ADMIN_FILE")
            DBPASS="$(cat "$DBPASS_FILE")"
            DJANGO_SECRET="$(cat "$SECRET_FILE")"
            ADMIN_PASSWORD="$(cat "$ADMIN_FILE")"

            sudo -u postgres psql -v ON_ERROR_STOP=1 <<SQL
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='aesthetic') THEN
                CREATE ROLE aesthetic LOGIN PASSWORD '$DBPASS';
              ELSE
                ALTER ROLE aesthetic PASSWORD '$DBPASS';
              END IF;
            END
            \$\$;
            SQL
            sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='aesthetic'" | grep -q 1 || sudo -u postgres createdb -O aesthetic aesthetic

            cat > "$ENVFILE" <<ENV
            DJANGO_SECRET_KEY=$DJANGO_SECRET
            DJANGO_DEBUG=0
            DJANGO_ALLOWED_HOSTS=$DOMAIN,127.0.0.1,localhost
            DATABASE_URL=postgresql://aesthetic:$DBPASS@127.0.0.1:5432/aesthetic
            ENV
            chmod 600 "$ENVFILE"

            cd "$CURRENT"
            python3 -m venv "$APP/venv"
            "$APP/venv/bin/pip" install --upgrade pip wheel >/dev/null
            "$APP/venv/bin/pip" install -r requirements.txt >/dev/null
            set -a; . "$ENVFILE"; set +a
            "$APP/venv/bin/python" manage.py makemigrations core club booking care communications integrations --noinput
            "$APP/venv/bin/python" manage.py migrate --noinput
            ADMIN_USERNAME=admin ADMIN_PASSWORD="$ADMIN_PASSWORD" DEMO_PASSWORD='Aplus-Demo-2026!' "$APP/venv/bin/python" manage.py seed_platform
            "$APP/venv/bin/python" manage.py collectstatic --noinput >/dev/null
            chown -R aesthetic:aesthetic "$APP"
            chmod 750 "$APP" "$CURRENT" "$APP/shared" "$APP/shared/private_media"

            cat > /etc/systemd/system/aesthetic-platform.service <<SERVICE
            [Unit]
            Description=A+ Esthetic Django Platform
            After=network.target postgresql.service
            Requires=postgresql.service

            [Service]
            Type=simple
            User=aesthetic
            Group=aesthetic
            WorkingDirectory=$CURRENT
            EnvironmentFile=$ENVFILE
            ExecStart=$APP/venv/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8766 --workers 3 --threads 2 --timeout 90 --access-logfile - --error-logfile -
            Restart=always
            RestartSec=3
            PrivateTmp=true
            ProtectSystem=strict
            ReadWritePaths=$APP/shared/private_media
            NoNewPrivileges=true

            [Install]
            WantedBy=multi-user.target
            SERVICE
            systemctl daemon-reload
            systemctl enable --now aesthetic-platform
            systemctl restart aesthetic-platform

            if [ ! -s "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
              cat > /etc/nginx/sites-available/a-esthetic-web.conf <<NGINXHTTP
            server {
              listen 80;
              listen [::]:80;
              server_name $DOMAIN;
              location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
              location / { proxy_pass http://127.0.0.1:8766; }
            }
            NGINXHTTP
              ln -sfn /etc/nginx/sites-available/a-esthetic-web.conf /etc/nginx/sites-enabled/a-esthetic-web.conf
              nginx -t && systemctl reload nginx
              certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email || true
            fi

            cat > /etc/nginx/sites-available/a-esthetic-web.conf <<NGINX
            server {
              listen 80;
              listen [::]:80;
              server_name $DOMAIN;
              return 301 https://\$host\$request_uri;
            }
            server {
              listen 443 ssl http2;
              listen [::]:443 ssl http2;
              server_name $DOMAIN;
              ssl_certificate /etc/letsencrypt/live/$DOMAIN/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/$DOMAIN/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
              client_max_body_size 10m;
              location / {
                proxy_pass http://127.0.0.1:8766;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_read_timeout 90;
              }
              add_header X-Content-Type-Options nosniff always;
              add_header X-Frame-Options DENY always;
              add_header Referrer-Policy strict-origin-when-cross-origin always;
              add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            }
            NGINX
            ln -sfn /etc/nginx/sites-available/a-esthetic-web.conf /etc/nginx/sites-enabled/a-esthetic-web.conf
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl reload nginx

            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8766/health/ >/tmp/aesthetic-health.json && break
              sleep 2
            done
            grep -q '"ok": true' /tmp/aesthetic-health.json
            curl -kfsS --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/health/" | grep -q '"database": "connected"'
            curl -fsS "https://$DOMAIN/health/" | grep -q '"ok": true'
            systemctl is-active --quiet aesthetic-platform
            echo 'A+ Esthetic full platform deployed successfully.'
