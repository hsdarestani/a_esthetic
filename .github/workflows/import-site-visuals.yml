name: Import exact A+ website visuals

on:
  push:
    paths:
      - ".github/workflows/import-site-visuals.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import exact approved A+ visuals
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www/assets/site
          mkdir -p www/assets/site

          curl -fsSL --retry 4 --retry-delay 2             "https://a-esthetic.de/wp-content/themes/aesthetic-child/assets/staging/v5/hero.svg"             -o www/assets/site/hero.svg

          curl -fsSL --retry 4 --retry-delay 2             "https://a-esthetic.de/wp-content/themes/aesthetic-child/assets/staging/botox.png"             -o www/assets/site/botox.png

          curl -fsSL --retry 4 --retry-delay 2             "https://a-esthetic.de/wp-content/themes/aesthetic-child/assets/staging/hyaluron.png"             -o www/assets/site/hyaluron.png

          curl -fsSL --retry 4 --retry-delay 2             "https://a-esthetic.de/wp-content/themes/aesthetic-child/assets/staging/skinbooster.png"             -o www/assets/site/skinbooster.png

          curl -fsSL --retry 4 --retry-delay 2             "https://a-esthetic.de/wp-content/themes/aesthetic-child/assets/staging/prp.png"             -o www/assets/site/prp.png

          curl -fsSL --retry 4 --retry-delay 2             "https://a-esthetic.de/wp-content/uploads/WhatsApp-Image-2026-09-23-at-01.36.13.jpeg"             -o www/assets/site/infusion.jpeg

          curl -fsSL --retry 4 --retry-delay 2             "https://a-esthetic.de/wp-content/themes/aesthetic-child/assets/staging/lipolyse.png"             -o www/assets/site/lipolyse.png

          curl -fsSL --retry 4 --retry-delay 2             "https://a-esthetic.de/wp-content/themes/aesthetic-child/assets/staging/rf-microneedling.png"             -o www/assets/site/rf-microneedling.png

          curl -fsSL --retry 4 --retry-delay 2             "https://a-esthetic.de/wp-content/themes/aesthetic-child/assets/staging/laser.png"             -o www/assets/site/laser.png

          curl -fsSL --retry 4 --retry-delay 2             "https://a-esthetic.de/wp-content/uploads/IMG_4007_581440-scaled.jpg"             -o www/assets/site/clinic.jpg

          test -s www/assets/site/hero.svg
          for file in botox.png hyaluron.png skinbooster.png prp.png infusion.jpeg lipolyse.png rf-microneedling.png laser.png clinic.jpg; do
            test -s "www/assets/site/$file"
          done

          echo "Exact A+ visual assets imported:"
          find www/assets/site -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Commit exact visual assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A www/assets/site
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "Replace app visuals with approved A+ website assets"
          git push
