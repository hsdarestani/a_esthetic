name: Populate clearly labeled Ayman demo data without touching real media or Esthetic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bedifferent-ayman-demo-seed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check three existing public apps before
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/api/mobile/status/ >/dev/null
          curl -fsS --max-time 20 https://book.a-esthetic.de/api/health/ >/dev/null
          curl -fsS --max-time 20 https://bedifferent.smarbiz.sbs/api/ready >/dev/null
          echo PRECHECK_ALL_PUBLIC_APPS=OK
      - name: Backup BE DIFFERENT and seed only the Ayman account
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            APP=/opt/bedifferent-temp/current
            test "$(id -u)" -eq 0
            systemctl is-active --quiet bedifferent-temp
            systemctl is-active --quiet a-esthetic-mobile
            systemctl is-active --quiet aesthetic-book
            for i in $(seq 1 55); do
              if [ -s "$APP/scripts/seed-ayman-demo.mjs" ] && [ -f "$APP/app/focus/page.js" -o -s "$APP/server.js" ]; then
                break
              fi
              sleep 5
            done
            test -s "$APP/scripts/seed-ayman-demo.mjs"
            test -s "$APP/node_modules/@prisma/client/package.json"
            test -s /etc/bedifferent-temp.env
            systemctl start bedifferent-temp-backup.service
            set -a
            . /etc/bedifferent-temp.env
            set +a
            cd "$APP"
            runuser -u bedifferenttemp -- env DATABASE_URL="$DATABASE_URL" "$APP/bin/node" "$APP/scripts/seed-ayman-demo.mjs"
            curl -fsS --max-time 10 http://127.0.0.1:3100/api/ready >/dev/null
            curl -fsS --max-time 10 http://127.0.0.1:8017/api/health/ >/dev/null
            curl -fsS --max-time 10 http://127.0.0.1:8770/api/mobile/status/ >/dev/null
            echo LOCAL_SERVICES_AFTER_DEMO=OK
      - name: Check all public apps and new Focus route after seeding
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://esthetic.smarbiz.sbs/api/mobile/status/ >/dev/null
          curl -fsS --max-time 20 https://book.a-esthetic.de/api/health/ >/dev/null
          curl -fsS --max-time 20 https://bedifferent.smarbiz.sbs/api/ready >/dev/null
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 https://bedifferent.smarbiz.sbs/focus)
          test "$code" = "307" -o "$code" = "302" -o "$code" = "200"
          echo FOCUS_PAGE_STATUS="$code"
          echo POSTCHECK_ALL_PUBLIC_APPS=OK
